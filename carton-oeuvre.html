<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartons d'œuvres — Bertrand Basset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font: 'IBM Plex Sans', Arial, sans-serif;
      --black: #111; --gray: #555; --dim: #888; --line: #ddd;
    }

    body {
      font-family: var(--font); color: var(--black);
      background: #f4f4f4; padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── SCREEN HEADER ── */
    .screen-header {
      max-width: 700px; margin: 0 auto 24px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .screen-header-title { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
    .btn-print {
      font-family: var(--font);
      padding: 0.6rem 1.2rem; background: var(--black); color: #fff;
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px;
    }
    .btn-print:hover { background: #333; }

    /* ── CARTON ── */
    .cartons-wrap {
      max-width: 700px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 16px;
    }

    .carton {
      background: #fff;
      border: 1px solid var(--line);
      width: 100%;
      aspect-ratio: 148 / 105;
      display: flex;
      padding: 0;
      overflow: hidden;
      position: relative;
    }

    .carton-left {
      flex: 1;
      padding: 6% 6% 6% 8%;
      display: flex; flex-direction: column; justify-content: space-between;
      border-right: 1px solid var(--line);
    }

    .carton-top { display: flex; flex-direction: column; gap: 0.2em; }

    .carton-serie {
      font-size: clamp(6px, 1.4vw, 11px);
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--dim); font-weight: 400; margin-bottom: 0.15em;
    }
    .carton-title {
      font-size: clamp(14px, 3.5vw, 28px);
      font-weight: 300; letter-spacing: -0.02em; line-height: 1.05;
    }
    .carton-code {
      font-size: clamp(6px, 1.3vw, 10px);
      letter-spacing: 0.08em; color: var(--dim); margin-top: 0.15em;
    }

    .carton-sep {
      height: 1px; background: var(--line); margin: 4% 0;
    }

    .carton-specs { display: flex; flex-direction: column; gap: 0.25em; }
    .carton-spec {
      font-size: clamp(6px, 1.3vw, 10px);
      color: var(--gray); line-height: 1.4; font-weight: 300;
    }
    .carton-spec strong { color: var(--black); font-weight: 400; }

    .carton-price {
      font-size: clamp(11px, 2.8vw, 22px);
      font-weight: 300; letter-spacing: -0.02em;
      color: var(--black); margin-top: 4%;
    }
    .carton-price-note {
      font-size: clamp(5px, 1.1vw, 8px);
      letter-spacing: 0.08em; color: var(--dim);
      text-transform: uppercase; margin-top: 0.2em;
    }

    .carton-right {
      width: 26%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 6%;
      gap: 6%;
    }

    .carton-qr {
      width: 100%;
      aspect-ratio: 1;
    }
    .carton-qr canvas,
    .carton-qr img { width: 100% !important; height: 100% !important; }

    .carton-domain {
      font-size: clamp(5px, 1.1vw, 8px);
      letter-spacing: 0.08em; color: var(--dim);
      text-align: center; line-height: 1.4;
    }

    .carton-corner {
      position: absolute; bottom: 3%; right: 1%;
      font-size: clamp(4px, 0.9vw, 7px);
      color: #ccc; letter-spacing: 0.06em;
    }

    /* ── CUT MARK ── */
    .cut-mark {
      font-size: 0.55rem; color: #bbb; letter-spacing: 0.08em;
      text-align: center; padding: 4px 0;
      display: flex; align-items: center; gap: 8px;
    }
    .cut-mark::before, .cut-mark::after {
      content: ''; flex: 1; height: 1px;
      background: repeating-linear-gradient(to right, #ccc 0, #ccc 4px, transparent 4px, transparent 8px);
    }

    /* ── PRINT ── */
    @media print {
      body { background: #fff; padding: 0; }
      .screen-header, .cut-mark { display: none; }
      .cartons-wrap { max-width: none; gap: 0; }
      .carton {
        width: 148mm; height: 105mm;
        border: 0.3pt solid #ccc;
        page-break-inside: avoid;
        break-inside: avoid;
        margin: 10mm auto;
      }
      @page { size: A4 portrait; margin: 10mm 25mm; }
    }
  </style>
</head>
<body>

<div class="screen-header">
  <span class="screen-header-title">Cartons d'œuvres — Dust'in Kolor</span>
  <button class="btn-print" onclick="window.print()">Imprimer</button>
</div>

<div class="cartons-wrap" id="cartonsWrap"></div>

<script>
const BASE_URL = 'https://bertrandbasset.com/boutique.html?id=';

const EDITIONS = [
  { slug:'sandstorm-feu',
    serie:"Dust'in Kolor", num:'01',
    titre:'Sandstorm', code:'6090_Feu',
    format:'60 × 90 cm',
    support:'Contrecollé Dibond 2mm',
    imprimeur:'Pix in the City, Auray',
    edition:'10 ex. numérotés, datés & signés',
    total:10, vendus:1, prix:[950, 1100, 1250] },

  { slug:'flying-car-orange',
    serie:"Dust'in Kolor", num:'02',
    titre:'Flying Car', code:'70124_Orange',
    format:'70 × 124 cm',
    support:'Contrecollé Dibond 2mm',
    imprimeur:'Pix in the City, Auray',
    edition:'10 ex. numérotés, datés & signés',
    total:10, vendus:1, prix:[1290, 1490, 1690] },

  { slug:'after-the-storm-vert',
    serie:"Dust'in Kolor", num:'03',
    titre:'After the Storm', code:'70124_Vert',
    format:'70 × 124 cm',
    support:'Contrecollé Dibond 2mm',
    imprimeur:'Pix in the City, Auray',
    edition:'10 ex. numérotés, datés & signés',
    total:10, vendus:2, prix:[1290, 1490, 1690] },

  { slug:'lost-in-the-dust-rouge',
    serie:"Dust'in Kolor", num:'04',
    titre:'Lost in the Dust', code:'6080_Rouge',
    format:'60 × 80 cm',
    support:'Contrecollé Dibond 2mm',
    imprimeur:'Pix in the City, Auray',
    edition:'10 ex. numérotés, datés & signés',
    total:10, vendus:1, prix:[890, 1020, 1150] },

  { slug:'camp-lighters-jaune',
    serie:"Dust'in Kolor", num:'05',
    titre:'Camp Lighters', code:'40100_Jaune',
    format:'40 × 100 cm',
    support:'Contrecollé Dibond 2mm',
    imprimeur:'Pix in the City, Auray',
    edition:'10 ex. numérotés, datés & signés',
    total:10, vendus:1, prix:[790, 910, 1030] },

  { slug:'im-here-bleu',
    serie:"Dust'in Kolor", num:'06',
    titre:"I'm Here", code:'6080_Bleu',
    format:'60 × 80 cm',
    support:'Contrecollé Dibond 2mm',
    imprimeur:'Pix in the City, Auray',
    edition:'10 ex. numérotés, datés & signés',
    total:10, vendus:1, prix:[890, 1020, 1150] },

  { slug:'umbrellas-way-rose',
    serie:"Dust'in Kolor", num:'08',
    titre:'Umbrellas Way', code:'6080_Rose',
    format:'60 × 80 cm',
    support:'Contrecollé Dibond 2mm',
    imprimeur:'Pix in the City, Auray',
    edition:'10 ex. numérotés, datés & signés',
    total:10, vendus:1, prix:[890, 1020, 1150] },
];

function palierIdx(ed) { return ed.vendus < 3 ? 0 : ed.vendus < 7 ? 1 : 2; }
function prixAct(ed)   { return ed.prix[palierIdx(ed)]; }
function palierLabel(ed) {
  const i = palierIdx(ed);
  return ['Ex. 1–3','Ex. 4–7','Ex. 8–10'][i];
}

const wrap = document.getElementById('cartonsWrap');

EDITIONS.forEach((ed, idx) => {
  // Cut mark between cartons (not before first)
  if (idx > 0) {
    const cut = document.createElement('div');
    cut.className = 'cut-mark';
    cut.textContent = '✂';
    wrap.appendChild(cut);
  }

  const carton = document.createElement('div');
  carton.className = 'carton';
  carton.innerHTML = `
    <div class="carton-left">
      <div>
        <div class="carton-top">
          <div class="carton-serie">${ed.serie} — № ${ed.num}</div>
          <div class="carton-title">${ed.titre}</div>
          <div class="carton-code">${ed.code}</div>
        </div>
        <div class="carton-sep"></div>
        <div class="carton-specs">
          <div class="carton-spec"><strong>${ed.format}</strong> · ${ed.support}</div>
          <div class="carton-spec">${ed.edition} · Certificat d'authenticité</div>
          <div class="carton-spec">${ed.imprimeur}</div>
        </div>
      </div>
      <div>
        <div class="carton-price">${prixAct(ed).toLocaleString('fr-FR')} €</div>
        <div class="carton-price-note">${palierLabel(ed)} · Prix progressif</div>
      </div>
    </div>
    <div class="carton-right">
      <div class="carton-qr" id="qr-${ed.slug}"></div>
      <div class="carton-domain">bertrandbasset.com</div>
    </div>
    <div class="carton-corner">bertrandbasset.com</div>
  `;
  wrap.appendChild(carton);

  // Generate QR code
  new QRCode(document.getElementById('qr-' + ed.slug), {
    text: BASE_URL + ed.slug,
    width: 200, height: 200,
    colorDark: '#111111',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
});
</script>
</body>
</html>
