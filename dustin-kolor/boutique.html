<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dust'in Kolor — Boutique — Bertrand Basset</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo-b.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font: 'IBM Plex Sans', -apple-system, Arial, sans-serif;
      --black: #111; --gray: #555; --dim: #999;
      --line: #e8e8e8; --bg: #f7f7f7;
      --gold: #b8860b;
    }
    html { font-family: var(--font); color: var(--black); background: #fff; -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font); cursor: pointer; border: none; background: none; }
    img { display: block; max-width: 100%; }

    /* ── HEADER ── */
    .site-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 2.5rem;
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; background: #fff; z-index: 100;
    }
    .header-back {
      font-size: 0.55rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--dim); transition: color 0.15s;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .header-back:hover { color: var(--black); }
    .header-logo { width: 22px; height: 22px; opacity: 0.7; transition: opacity 0.15s; }
    .header-logo:hover { opacity: 1; }
    .header-right { display: flex; align-items: center; gap: 1.8rem; }
    .header-cart {
      font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--dim); transition: color 0.15s;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .header-cart:hover { color: var(--black); }
    .cart-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; background: var(--black); color: #fff;
      font-size: 0.45rem; border-radius: 50%; font-weight: 700;
    }
    .header-series {
      font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim);
    }

    /* ── LAYOUT ── */
    .product-wrap {
      max-width: 1100px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 480px; gap: 5rem;
      padding: 4rem 2.5rem 6rem;
      align-items: start;
    }
    @media (max-width: 900px) {
      .product-wrap { grid-template-columns: 1fr; gap: 2.5rem; padding: 2rem 1.5rem 4rem; }
    }

    /* ── IMAGE ── */
    .product-image-wrap { position: sticky; top: 90px; }
    .product-image-wrap img {
      width: 100%; aspect-ratio: auto;
      object-fit: contain; background: var(--bg);
    }
    .img-caption {
      margin-top: 0.9rem;
      font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim);
    }

    /* ── INFOS ── */
    .product-info { display: flex; flex-direction: column; gap: 0; }

    .product-kicker {
      font-size: 0.55rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dim);
      margin-bottom: 0.6rem;
    }
    .product-title {
      font-size: 2.2rem; font-weight: 300; letter-spacing: -0.02em; line-height: 1.1;
      margin-bottom: 0.3rem;
    }
    .product-couleur {
      font-size: 0.75rem; font-style: italic; color: var(--gray); margin-bottom: 1.6rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .couleur-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }

    .product-desc {
      font-size: 0.85rem; line-height: 1.7; color: var(--gray); font-weight: 300;
      border-top: 1px solid var(--line); padding-top: 1.4rem; margin-bottom: 2rem;
    }

    /* ── ONGLETS ── */
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 2rem; }
    .tab-btn {
      font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.65rem 1.2rem; color: var(--dim);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: var(--black); }
    .tab-btn.active { color: var(--black); border-bottom-color: var(--black); }

    /* ── SPEC ROWS ── */
    .spec-rows { display: flex; flex-direction: column; gap: 0; margin-bottom: 1.4rem; }
    .spec-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 0.55rem 0; border-bottom: 1px solid var(--line);
      font-size: 0.78rem;
    }
    .spec-label { color: var(--dim); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .spec-val { color: var(--black); font-weight: 300; text-align: right; }

    /* ── OPTION CHASSIS ── */
    .chassis-option {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.7rem 0.9rem; border: 1px solid var(--line);
      border-radius: 4px; cursor: pointer; margin-bottom: 1.4rem;
      transition: border-color 0.2s, background 0.2s;
      font-size: 0.75rem;
    }
    .chassis-option:hover { border-color: #aaa; }
    .chassis-option.active { border-color: var(--black); background: var(--bg); }
    .chassis-option-left { display: flex; align-items: center; gap: 0.7rem; }
    .chassis-check {
      width: 18px; height: 18px; border-radius: 3px;
      border: 1.5px solid var(--dim); display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s; flex-shrink: 0;
    }
    .chassis-option.active .chassis-check { background: var(--black); border-color: var(--black); }
    .chassis-check svg { display: none; }
    .chassis-option.active .chassis-check svg { display: block; }
    .chassis-option-label { font-size: 0.72rem; color: var(--black); }
    .chassis-option-sublabel { font-size: 0.6rem; color: var(--dim); }
    .chassis-option-price { font-size: 0.72rem; color: var(--gray); }

    /* ── EDITION BLOCK ── */
    .edition-block {
      border: 1px solid var(--line); border-radius: 4px;
      padding: 0.9rem 1rem; margin-bottom: 1.6rem;
      display: flex; flex-direction: column; gap: 0.6rem;
    }
    .edition-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.72rem;
    }
    .edition-label { color: var(--dim); font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .edition-val { font-weight: 400; font-size: 0.78rem; }
    .stock-row {
      display: flex; flex-direction: column; gap: 0.35rem;
    }
    .stock-text { font-size: 0.68rem; color: var(--gray); }
    .stock-bar {
      height: 3px; background: var(--line); border-radius: 2px; overflow: hidden;
    }
    .stock-fill { height: 100%; background: var(--black); border-radius: 2px; transition: width 0.4s; }

    /* ── EARLY BADGE ── */
    .early-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: #fffbea; border: 1px solid #e6d06a;
      color: var(--gold); font-size: 0.6rem; letter-spacing: 0.06em;
      padding: 0.35rem 0.7rem; border-radius: 3px;
      margin-bottom: 1rem; font-weight: 400;
    }

    /* ── PRIX ── */
    .prix-block { margin-bottom: 1.8rem; }
    .prix-main {
      font-size: 2.6rem; font-weight: 300; letter-spacing: -0.03em; line-height: 1;
      color: var(--black);
    }
    .prix-main sup { font-size: 1.4rem; font-weight: 300; vertical-align: super; }
    .prix-barre {
      font-size: 1rem; color: var(--dim); text-decoration: line-through;
      margin-right: 0.6rem; font-weight: 300;
    }
    .prix-sub { font-size: 0.6rem; color: var(--dim); letter-spacing: 0.08em; margin-top: 0.4rem; }

    /* ── CTA ── */
    .btn-add-cart {
      width: 100%; padding: 1rem 1.5rem;
      background: var(--black); color: #fff;
      font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 400;
      border-radius: 2px; transition: background 0.2s; margin-bottom: 0.75rem;
    }
    .btn-add-cart:hover { background: #333; }
    .btn-add-cart:disabled { background: #ccc; cursor: not-allowed; }

    .btn-voir-panier {
      width: 100%; padding: 0.85rem 1.5rem;
      background: none; color: var(--gray);
      font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
      border: 1px solid var(--line); border-radius: 2px; transition: border-color 0.2s, color 0.2s;
    }
    .btn-voir-panier:hover { border-color: var(--gray); color: var(--black); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(12px);
      background: var(--black); color: #fff;
      padding: 0.75rem 1.8rem; border-radius: 2px;
      font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
      opacity: 0; transition: opacity 0.22s, transform 0.22s;
      z-index: 9999; pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>

      <button class="btn-voir-panier" onclick="location.href='../panier.html'">Voir le panier</button>

    <!-- TAB: GRAND FORMAT -->
    <div id="tab-grand" style="display:none">
      <div class="spec-rows" id="spec-grand"></div>
      <div class="edition-block" id="edition-grand"></div>

      <div class="prix-block" id="prix-grand"></div>
      <button class="btn-add-cart" id="btn-grand" onclick="addToCart('grand')">Ajouter au panier</button>
      <button class="btn-voir-panier" onclick="location.href='../panier.html'">Voir le panier</button>

    <div style="border-top:1px solid var(--line);padding-top:2rem;margin-top:0.5rem">

        Découvrir les cartes postales Dust'in Kolor →

</div>

const EARLY_PETIT = 0;
const EARLY_GRAND = 0;
const EARLY_TAUX  = 0;

/* ══════════════════════════════════════════════════
   ÉTAT
══════════════════════════════════════════════════ */
let edition = null;
let currentTab = 'simple';

/* ══════════════════════════════════════════════════
   PANIER
══════════════════════════════════════════════════ */
function getCart() {
  try { return JSON.parse(localStorage.getItem('bb_cart') || '[]'); }
  catch(e) { return []; }
}
function saveCart(c) { localStorage.setItem('bb_cart', JSON.stringify(c)); }
function getCartCount() { return getCart().reduce(function(s,i){ return s + (i.qty||1); }, 0); }
function updateCartBadge() {
  var n = getCartCount();
  var el = document.getElementById('cartCount');
  if (n > 0) { el.textContent = n; el.style.display = ''; }
  else { el.style.display = 'none'; }
}

function addToCart(type) {
  if (!edition) return;
  var cart = getCart();
  var item;
  if (type === 'simple') {
    var p = edition.petit;
    var prix = prixEarlyPetit(p.prix_simple, p.vendus_petit);
    item = { type:'simple', slug:edition.slug, num:edition.num,
             titre: lang==='fr' ? edition.titre_fr : edition.titre_en,
             taille: p.taille, support: p.support, prix: prix, qty:1 };
  } else if (type === 'dibond') {
    var p2 = edition.petit;
    var basePrix = p2.prix_dibond + (chassisActive ? p2.surcout_chassis : 0);
    var prix2 = prixEarlyPetit(basePrix, p2.vendus_petit);
    item = { type:'dibond', chassis: chassisActive, slug:edition.slug, num:edition.num,
             titre: lang==='fr' ? edition.titre_fr : edition.titre_en,
             taille: p2.taille, support: p2.support, prix: prix2, qty:1 };
  } else if (type === 'grand') {
    var g = edition.grand;
    var prix3 = prixEarlyGrand(g.prix, g.vendus_grand);
    item = { type:'grand', slug:edition.slug, num:edition.num,
             titre: lang==='fr' ? edition.titre_fr : edition.titre_en,
             taille: g.taille, support: g.support + ' / ' + g.montage, prix: prix3, qty:1 };
    item = { type:'carte', id:selectedCarte, prix: CARTE_PRIX, qty:1,
             titre: 'Carte postale Dust\'in Kolor #' + selectedCarte.replace('cp-','') };
  }
  var existing = cart.findIndex(function(c){ return c.type===item.type && c.slug===item.slug && c.chassis===item.chassis && c.id===item.id; });
  if (existing >= 0) { cart[existing].qty = (cart[existing].qty||1) + 1; }
  else { cart.push(item); }
  saveCart(cart);
  updateCartBadge();
  showToast(lang==='fr' ? 'Ajouté au panier' : 'Added to cart');
}

/* ══════════════════════════════════════════════════
   PRIX EARLY ADOPTER
══════════════════════════════════════════════════ */
function prixEarlyPetit(prix, vendus) {
  if (vendus < EARLY_PETIT) return Math.round(prix * (1 - EARLY_TAUX));
  return prix;
}
function prixEarlyGrand(prix, vendus) {
  if (vendus < EARLY_GRAND) return Math.round(prix * (1 - EARLY_TAUX));
  return prix;
}
function isEarlyPetit(vendus) { return vendus < EARLY_PETIT; }
function isEarlyGrand(vendus) { return vendus < EARLY_GRAND; }

/* ══════════════════════════════════════════════════
   ONGLETS
══════════════════════════════════════════════════ */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.getElementById('tab-simple').style.display = tab === 'simple' ? '' : 'none';
  document.getElementById('tab-dibond').style.display = tab === 'dibond' ? '' : 'none';
  document.getElementById('tab-grand').style.display  = tab === 'grand'  ? '' : 'none';
}

/* ══════════════════════════════════════════════════
   CHÂSSIS
══════════════════════════════════════════════════ */
function toggleChassis() {
  chassisActive = !chassisActive;
  document.getElementById('chassisToggle').classList.toggle('active', chassisActive);
  renderPrixDibond();
}

/* ══════════════════════════════════════════════════
   RENDER EDITION BLOCK
══════════════════════════════════════════════════ */
function renderEditionBlock(el, ed_count, vendus, isGrand) {
  var dispo = ed_count - vendus;
  var pct = Math.round((dispo / ed_count) * 100);
  var label = lang === 'fr'
    ? ed_count + ' ex. numérotés, signés'
    : ed_count + ' numbered, signed copies';
  var dispoTxt = lang === 'fr'
    ? dispo + ' / ' + ed_count + ' disponibles'
    : dispo + ' / ' + ed_count + ' available';
  el.innerHTML =
    '<div class="edition-row">' +
      '<span class="edition-label">Édition</span>' +
      '<span class="edition-val">' + label + '</span>' +
    '</div>' +
    '<div class="stock-row">' +
      '<span class="stock-text">' + dispoTxt + '</span>' +
      '<div class="stock-bar"><div class="stock-fill" style="width:' + pct + '%"></div></div>' +
    '</div>';
}

/* ══════════════════════════════════════════════════
   RENDER EARLY BADGE
══════════════════════════════════════════════════ */
function renderEarlyBadge(el, isEarly, count) {
  if (!isEarly) { el.innerHTML = ''; return; }
  var txt = lang === 'fr'
    ? '★ Early adopter — Les ' + count + ' premiers acheteurs — −10 %'
    : '★ Early adopter — First ' + count + ' buyers — −10 %';
  el.innerHTML = '<div class="early-badge">' + txt + '</div>';
}

/* ══════════════════════════════════════════════════
   RENDER PRIX
══════════════════════════════════════════════════ */
function renderPrix(el, prix, prixBase, isEarly) {
  var html = '<div class="prix-main">';
  if (isEarly && prixBase !== prix) {
    html += '<span class="prix-barre">' + prixBase + ' €</span>';
  }
  html += prix + '<sup> €</sup></div>';
  html += '<div class="prix-sub">' + (lang==='fr' ? 'TTC · Livraison incluse France' : 'VAT incl. · Free shipping France') + '</div>';
  el.innerHTML = html;
}

function renderPrixDibond() {
  if (!edition) return;
  var p = edition.petit;
  var base = p.prix_dibond + (chassisActive ? p.surcout_chassis : 0);
  var prix = prixEarlyPetit(base, p.vendus_petit);
  var early = isEarlyPetit(p.vendus_petit);
  renderPrix(document.getElementById('prix-dibond'), prix, base, early);
}

/* ══════════════════════════════════════════════════
   RENDER SPECS
══════════════════════════════════════════════════ */
function makeSpecRow(label, val) {
  return '<div class="spec-row"><span class="spec-label">' + label + '</span><span class="spec-val">' + val + '</span></div>';
}

function renderAll() {
  if (!edition) return;
  var p = edition.petit;
  var g = edition.grand;

  /* ── Simple ── */
  document.getElementById('spec-simple').innerHTML =
    makeSpecRow('Format', p.taille) +
    makeSpecRow('Support', p.support) +
    makeSpecRow('Finition', 'Tirage Fine Art');
  renderEditionBlock(document.getElementById('edition-simple'), p.ed, p.vendus_petit, false);
  renderEarlyBadge(document.getElementById('early-simple'), isEarlyPetit(p.vendus_petit), EARLY_PETIT);
  renderPrix(document.getElementById('prix-simple'),
    prixEarlyPetit(p.prix_simple, p.vendus_petit), p.prix_simple, isEarlyPetit(p.vendus_petit));

  /* ── Dibond ── */
  document.getElementById('spec-dibond').innerHTML =
    makeSpecRow('Format', p.taille) +
    makeSpecRow('Support', p.support) +
    makeSpecRow('Montage', 'Contrecollage Dibond 2mm') +
    makeSpecRow('Finition', 'Brillant');
  document.getElementById('chassisSurcout').textContent = '+ ' + p.surcout_chassis + ' €';
  renderEditionBlock(document.getElementById('edition-dibond'), p.ed, p.vendus_petit, false);
  renderEarlyBadge(document.getElementById('early-dibond'), isEarlyPetit(p.vendus_petit), EARLY_PETIT);
  renderPrixDibond();

  /* ── Grand ── */
  document.getElementById('spec-grand').innerHTML =
    makeSpecRow('Format', g.taille) +
    makeSpecRow('Support', g.support) +
    makeSpecRow('Montage', g.montage) +
    makeSpecRow('Finition', 'Contrecollage face + vernis brillant');
  renderEditionBlock(document.getElementById('edition-grand'), g.ed, g.vendus_grand, true);
  renderEarlyBadge(document.getElementById('early-grand'), isEarlyGrand(g.vendus_grand), EARLY_GRAND);
  renderPrix(document.getElementById('prix-grand'),
    prixEarlyGrand(g.prix, g.vendus_grand), g.prix, isEarlyGrand(g.vendus_grand));
}


/* ══════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════ */
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
function init() {
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  lang = params.get('lang') || 'fr';
  document.documentElement.lang = lang;

  edition = EDITIONS.find(function(e){ return e.slug === id; }) || EDITIONS[0];

  var titre = lang === 'fr' ? edition.titre_fr : edition.titre_en;
  var couleur = lang === 'fr' ? edition.couleur_fr : edition.couleur_en;

  document.title = 'Dust\'in Kolor — ' + titre + ' — Bertrand Basset';
  document.getElementById('prodImg').src = edition.img;
  document.getElementById('prodImg').alt = titre;
  document.getElementById('imgCaption').textContent = 'Édition ' + edition.num + ' — ' + titre;
  document.getElementById('prodKicker').textContent = 'Dust\'in Kolor — Édition ' + edition.num;
  document.getElementById('prodTitle').textContent = titre;
  document.getElementById('couleurDot').style.background = edition.hex;
  document.getElementById('couleurText').textContent = couleur;
  document.getElementById('prodDesc').textContent = lang === 'fr' ? edition.desc_fr : edition.desc_en;

  var backLink = document.getElementById('backLink');
  backLink.href = 'index.html#' + edition.slug;
  document.getElementById('backLabel').textContent = lang === 'fr' ? 'Retour à la série' : 'Back to series';
  document.getElementById('cartLabel').textContent = lang === 'fr' ? 'Panier' : 'Cart';

  renderAll();
  updateCartBadge();
}

document.addEventListener('DOMContentLoaded', init);
</script>
