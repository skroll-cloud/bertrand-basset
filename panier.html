<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier — Bertrand Basset</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-b.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font: 'IBM Plex Sans', -apple-system, Arial, sans-serif;
      --black: #111; --gray: #555; --dim: #999; --line: #e8e8e8; --bg: #f9f9f9;
    }
    html { font-family: var(--font); color: var(--black); background: #fff; -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font); cursor: pointer; border: none; background: none; }
    img { display: block; max-width: 100%; }

    /* ── HEADER ── */
    .site-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 2rem; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; background: #fff; z-index: 100;
    }
    .header-logo { display: flex; align-items: center; gap: 0.5rem; }
    .header-logo img { width: 18px; height: 18px; }
    .header-logo-name { font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--black); }
    .header-back { font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); transition: color 0.15s; }
    .header-back:hover { color: var(--black); }

    /* ── LAYOUT ── */
    .page-wrap { max-width: 680px; margin: 0 auto; padding: 3rem 2rem 5rem; }
    .page-kicker { font-size: 0.52rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); margin-bottom: 0.5rem; }
    .page-title { font-size: 2rem; font-weight: 300; letter-spacing: -0.02em; margin-bottom: 2.5rem; }

    /* ── CART ITEMS ── */
    .cart-empty { font-size: 0.82rem; color: var(--dim); text-align: center; padding: 4rem 0; }
    .cart-items { display: flex; flex-direction: column; gap: 0; margin-bottom: 2rem; }
    .cart-item {
      display: grid; grid-template-columns: 80px 1fr auto;
      gap: 1.2rem; align-items: center;
      padding: 1.2rem 0; border-bottom: 1px solid var(--line);
    }
    .cart-item-img { aspect-ratio: 4/3; overflow: hidden; background: var(--bg); }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-name { font-size: 0.85rem; font-weight: 300; margin-bottom: 0.2rem; }
    .cart-item-format { font-size: 0.65rem; color: var(--dim); margin-bottom: 0.6rem; }
    .cart-item-qty {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.72rem; color: var(--gray);
    }
    .qty-btn {
      width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; color: var(--black); transition: border-color 0.15s;
    }
    .qty-btn:hover { border-color: var(--black); }
    .cart-item-right { text-align: right; }
    .cart-item-prix { font-size: 0.95rem; font-weight: 300; margin-bottom: 0.5rem; }
    .cart-item-del { font-size: 0.55rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); transition: color 0.15s; }
    .cart-item-del:hover { color: #c00; }

    /* ── TOTAUX ── */
    .cart-summary { border-top: 1px solid var(--black); padding-top: 1.2rem; margin-bottom: 2rem; }
    .cart-summary-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem; }
    .cart-summary-label { font-size: 0.68rem; color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; }
    .cart-summary-total { font-size: 1.8rem; font-weight: 300; letter-spacing: -0.02em; }

    /* ── CTA ── */
    .btn-checkout {
      display: block; width: 100%; padding: 1.1rem;
      background: var(--black); color: #fff;
      font-size: 0.65rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
      text-align: center; border-radius: 2px; cursor: pointer;
      transition: background 0.2s; border: none;
    }
    .btn-checkout:hover { background: #333; }
    .btn-checkout:disabled { background: #ccc; cursor: not-allowed; }
    .checkout-note { font-size: 0.6rem; color: var(--dim); text-align: center; margin-top: 0.8rem; line-height: 1.6; }

    .sep { height: 1px; background: var(--line); margin: 2rem 0; }
    .continue-link { font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); transition: color 0.15s; }
    .continue-link:hover { color: var(--black); }

    @media (max-width: 600px) {
      .page-wrap { padding: 2rem 1.2rem 4rem; }
      .header-logo-name { display: none; }
      .cart-item { grid-template-columns: 64px 1fr auto; gap: 0.8rem; }
    }

    /* ── CODE PROMO ── */
    .promo-section { margin-bottom:1.5rem; }
    .promo-row { display:flex; gap:0.5rem; margin-bottom:0.4rem; }
    .promo-input {
      flex:1; padding:0.5rem 0.8rem; border:1px solid var(--line);
      font-family:var(--font); font-size:0.7rem; outline:none; transition:border-color 0.15s;
    }
    .promo-input:focus { border-color:var(--black); }
    .promo-btn {
      padding:0.5rem 1rem; background:var(--black); color:#fff;
      font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; border:none; cursor:pointer;
    }
    .promo-msg { font-size:0.62rem; color:var(--dim); min-height:1.2em; }

    /* ── LIVRAISON ── */
    .livraison-note { font-size:0.62rem; color:var(--dim); margin-bottom:1rem; line-height:1.6; }

    /* ── CHECKOUT INFO ── */
    .checkout-info { font-size:0.62rem; color:var(--dim); text-align:center; margin-top:0.8rem; line-height:1.8; }
    .checkout-info strong { color:var(--black); font-weight:400; }

    /* ── MENTIONS LÉGALES ── */
    .mentions-legales { margin-top:3rem; padding-top:2rem; border-top:1px solid var(--line); }
    .ml-title { font-size:0.55rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--dim); margin-bottom:1.5rem; }
    .ml-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem 2rem; }
    .ml-label { font-size:0.55rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); margin-bottom:0.4rem; }
    .ml-block p { font-size:0.68rem; color:var(--gray); line-height:1.7; }
    .ml-block strong { color:var(--black); font-weight:400; }
    .ml-block a { color:var(--black); border-bottom:1px solid var(--line); }
    @media (max-width:600px) { .ml-grid { grid-template-columns:1fr; } }

  </style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="header-logo">
    <img src="assets/logo-b.svg" alt="B">
    <span class="header-logo-name">Bertrand Basset</span>
  </a>
  <a href="javascript:history.back()" class="header-back">← Continuer mes achats</a>
</header>

<div class="page-wrap">
  <p class="page-kicker">Mon sélection</p>
  <h1 class="page-title">Panier</h1>

  <div id="cartContent"></div>
</div>

<script>
  /* ── Configuration Supabase / Edge Function ─────────────────────────────── */
  const SUPABASE_URL       = 'https://[PROJECT_REF].supabase.co';   // ← à remplir
  const SUPABASE_ANON_KEY  = '[SUPABASE_ANON_KEY]';                 // ← à remplir
  const CHECKOUT_ENDPOINT  = SUPABASE_URL + '/functions/v1/stripe-checkout';
  const SUCCESS_URL        = window.location.origin + '/merci.html';
  const CANCEL_URL         = window.location.origin + '/panier.html';

  const IMG_BY_SLUG = {
    'sandstorm-feu':          'images/dustin-kolor/01.jpg',
    'flying-car-orange':      'images/dustin-kolor/02.jpg',
    'after-the-storm-vert':   'images/dustin-kolor/03.jpg',
    'lost-in-the-dust-rouge': 'images/dustin-kolor/04.jpg',
    'camp-lighters-jaune':    'images/dustin-kolor/05.jpg',
    'im-here-bleu':           'images/dustin-kolor/06.jpg',
    'umbrellas-way-rose':     'images/dustin-kolor/08.jpg',
  };

  const PROMO_CODE     = 'Maman';
  const PROMO_DISCOUNT = 0.10;
  let promoApplied     = false;

  function getCart() { try { return JSON.parse(localStorage.getItem('bb_cart')||'[]'); } catch(e){ return []; } }
  function saveCart(c) { localStorage.setItem('bb_cart', JSON.stringify(c)); }

  function getImg(item) {
    if (item.cat === 'carte' && item.imgs && item.imgs.length)
      return 'images/cartes-postales/' + item.imgs[0] + '.jpg';
    const slug = (item.id||item.slug||''). replace(/-(simple|dibond|chassis|grand)$/, '');
    return IMG_BY_SLUG[slug] || '';
  }

  function changeQty(id, delta) {
    const cart = getCart();
    const item = cart.find(x => (x.id||x.slug) === id);
    if (!item) return;
    item.qty = (item.qty||1) + delta;
    if (item.qty <= 0) cart.splice(cart.indexOf(item), 1);
    saveCart(cart); renderCart();
  }

  function removeItem(id) {
    saveCart(getCart().filter(x => (x.id||x.slug) !== id));
    renderCart();
  }

  function calcShipping(cart) {
    const tirages = cart.filter(i => i.cat !== 'carte');
    const cartes  = cart.filter(i => i.cat === 'carte');
    const tTotal  = tirages.reduce((s,i) => s + i.prix*(i.qty||1), 0);
    const cTotal  = cartes.reduce((s,i)  => s + i.prix*(i.qty||1), 0);
    let frais = 0, note = [];
    if (tTotal > 0)
      note.push(tTotal >= 200 ? 'Livraison France offerte pour vos tirages.' : 'Livraison tirages France offerte dès 200 €.');
    if (cTotal > 0) {
      if (cTotal >= 35) { note.push('Livraison cartes offerte.'); }
      else { frais += 4; note.push('Livraison cartes : 4 €.'); }
    }
    return { frais, note: note.join(' ') };
  }

  function applyPromo() {
    const val = (document.getElementById('promoInput')?.value || '').trim();
    promoApplied = val.toLowerCase() === PROMO_CODE.toLowerCase();
    const msg = document.getElementById('promoMsg');
    if (msg) {
      msg.textContent = promoApplied
        ? '✓ Code appliqué — 10 % de réduction (ex. 1 et 2 par œuvre et format)'
        : val ? 'Code invalide' : '';
      msg.style.color = promoApplied ? '#2a7a2a' : '#c00';
    }
    renderCart();
  }

  function renderCart() {
    const cart = getCart();
    const wrap = document.getElementById('cartContent');
    if (cart.length === 0) {
      wrap.innerHTML = `<p class="cart-empty">Votre panier est vide.</p>
        <div class="sep"></div>
        <a href="javascript:history.back()" class="continue-link">← Retour à la boutique</a>`;
      return;
    }

    const sub   = cart.reduce((s,i) => s + i.prix*(i.qty||1), 0);
    const { frais, note } = calcShipping(cart);
    const remise = promoApplied ? Math.round(sub * PROMO_DISCOUNT * 100) / 100 : 0;
    const total  = sub - remise + frais;

    const itemsHtml = cart.map(item => {
      const img = getImg(item);
      const eid = item.id || item.slug;
      return `
        <div class="cart-item">
          <div class="cart-item-img">
            <img src="${img}" alt="${item.titre}" loading="lazy">
          </div>
          <div>
            <div class="cart-item-name">${item.titre}</div>
            <div class="cart-item-format">${item.type||item.format||''}${item.taille?' — '+item.taille:''}</div>
            <div class="cart-item-qty">
              <button class="qty-btn" onclick="changeQty('${eid}',-1)">−</button>
              <span>${item.qty||1}</span>
              <button class="qty-btn" onclick="changeQty('${eid}',+1)">+</button>
            </div>
          </div>
          <div class="cart-item-right">
            <div class="cart-item-prix">${(item.prix*(item.qty||1)).toLocaleString('fr-FR')} €</div>
            <button class="cart-item-del" onclick="removeItem('${eid}')">Retirer</button>
          </div>
        </div>`;
    }).join('');

    wrap.innerHTML = `
      <div class="cart-items">${itemsHtml}</div>

      <div class="promo-section">
        <div class="promo-row">
          <input type="text" id="promoInput" class="promo-input" placeholder="Code de réduction" value="${promoApplied ? PROMO_CODE : ''}">
          <button class="promo-btn" onclick="applyPromo()">Appliquer</button>
        </div>
        <div id="promoMsg" class="promo-msg" style="color:${promoApplied?'#2a7a2a':'#c00'}">
          ${promoApplied ? '✓ Code appliqué — 10 % de réduction (ex. 1 et 2 par œuvre et format)' : ''}
        </div>
      </div>

      <div class="cart-summary">
        <div class="cart-summary-row">
          <span class="cart-summary-label">Sous-total</span>
          <span>${sub.toLocaleString('fr-FR')} €</span>
        </div>
        ${remise > 0 ? `<div class="cart-summary-row">
          <span class="cart-summary-label">Réduction −10 %</span>
          <span style="color:#2a7a2a">−${remise.toLocaleString('fr-FR')} €</span>
        </div>` : ''}
        ${frais > 0 ? `<div class="cart-summary-row">
          <span class="cart-summary-label">Livraison</span>
          <span>${frais} €</span>
        </div>` : ''}
        <div class="cart-summary-row" style="margin-top:0.8rem;border-top:1px solid var(--line);padding-top:0.8rem">
          <span class="cart-summary-label" style="font-size:0.75rem;color:var(--black)">Total</span>
          <span class="cart-summary-total">${total.toLocaleString('fr-FR')} €</span>
        </div>
      </div>

      ${note ? `<p class="livraison-note">${note}</p>` : ''}

      <button class="btn-checkout" onclick="checkout()">Procéder au paiement</button>
      <div class="checkout-info">
        <p>⏱ Délai de fabrication et livraison : <strong>2 à 3 semaines</strong></p>
        <p>Paiement sécurisé · Fabriqué par Pix in the City, Auray</p>
      </div>

      <div class="mentions-legales">
        <p class="ml-title">Informations légales</p>
        <div class="ml-grid">
          <div class="ml-block">
            <p class="ml-label">Vendeur</p>
            <p>Bertrand Basset<br>SIREN 820 257 962<br>Carantec, Finistère, Bretagne<br>
              <a href="mailto:bertrand.basset@gmail.com">bertrand.basset@gmail.com</a><br>06 43 10 58 60</p>
          </div>
          <div class="ml-block">
            <p class="ml-label">Retours & échanges</p>
            <p>Les œuvres étant fabriquées à la commande et personnalisées (numérotées, signées), elles sont <strong>exclues du droit de rétractation</strong> (art. L221-28 4° du Code de la consommation). Ni reprises, ni échangées après fabrication.</p>
          </div>
          <div class="ml-block">
            <p class="ml-label">Garanties légales</p>
            <p>Garantie légale de conformité (art. L217-4 C. conso.) et garantie contre les vices cachés (art. 1641 C. civil) applicables à toute commande.</p>
          </div>
          <div class="ml-block">
            <p class="ml-label">Livraison</p>
            <p>Tirages expédiés par Pix in the City, Auray. Délai 2–3 semaines. Livraison France offerte dès 200 €. Cartes postales offerte dès 35 €, sinon 4 €. Tarifs Europe et monde sur demande.</p>
          </div>
          <div class="ml-block">
            <p class="ml-label">Données personnelles</p>
            <p>Vos données sont traitées uniquement pour l'exécution de votre commande, conformément au RGPD. Elles ne sont pas transmises à des tiers hors prestataires de livraison.</p>
          </div>
          <div class="ml-block">
            <p class="ml-label">Litige</p>
            <p>En cas de litige, une solution amiable sera prioritairement recherchée. Vous pouvez recourir à la plateforme de résolution en ligne de la Commission européenne : <a href="https://ec.europa.eu/consumers/odr">ec.europa.eu/consumers/odr</a></p>
          </div>
        </div>
      </div>

      <div class="sep"></div>
      <a href="javascript:history.back()" class="continue-link">← Continuer mes achats</a>`;
  }

  async function checkout() {
    const cart = getCart();
    if (!cart.length) return;

    // Vérifier que l'URL Supabase est configurée
    if (SUPABASE_URL.includes('[PROJECT_REF]') || SUPABASE_ANON_KEY.includes('[SUPABASE_ANON_KEY]')) {
      alert('Le paiement en ligne n\'est pas encore activé.\nPour commander : bertrand.basset@gmail.com · 06 43 10 58 60');
      return;
    }

    const btn = document.querySelector('.btn-checkout');
    if (!btn) return;
    btn.disabled = true;
    btn.textContent = 'Redirection vers le paiement…';

    try {
      const items = cart.map(item => ({
        type:    item.type   || 'simple',
        slug:    item.slug   || null,
        titre:   item.titre  || item.name || 'Article',
        prix:    item.prix,
        qty:     item.qty    || 1,
        chassis: item.chassis || false,
        id:      item.id     || null,
        ids:     item.ids    || null,
        cat:     item.cat    || null,
      }));

      const res = await fetch(CHECKOUT_ENDPOINT, {
        method:  'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({
          items,
          promo:       promoApplied ? PROMO_CODE : '',
          success_url: SUCCESS_URL,
          cancel_url:  CANCEL_URL,
        }),
      });

      const data = await res.json();
      if (data.url) {
        window.location.href = data.url;
      } else {
        alert(data.error || 'Erreur lors du paiement. Veuillez réessayer.');
        btn.disabled = false;
        btn.textContent = 'Procéder au paiement';
      }
    } catch (e) {
      console.error('checkout error:', e);
      alert('Erreur de connexion. Veuillez réessayer ou nous contacter : bertrand.basset@gmail.com');
      btn.disabled = false;
      btn.textContent = 'Procéder au paiement';
    }
  }

  renderCart();
</script>
</body>
</html>
