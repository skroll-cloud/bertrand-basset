<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='UTF-8'>
<title>QR Code — Payer ses cartes postales</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap');
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'IBM Plex Sans',-apple-system,Arial,sans-serif;
    background:#f0f0f0;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:2rem;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .card {
    background:#fff;
    width:85mm; /* carte de visite large */
    padding:10mm;
    text-align:center;
    border-radius:3px;
    box-shadow:0 4px 24px rgba(0,0,0,0.10);
    page-break-inside:avoid;
  }
  .kicker {
    font-size:7pt; letter-spacing:0.18em; text-transform:uppercase;
    color:#999; margin-bottom:4mm;
  }
  .qr { width:52mm; height:52mm; margin:0 auto 5mm; display:block; }
  .qr svg { width:100%; height:100%; }
  .title {
    font-size:14pt; font-weight:300; letter-spacing:-0.01em;
    color:#111; line-height:1.2; margin-bottom:2mm;
  }
  .subtitle {
    font-size:7.5pt; color:#777; font-weight:300; line-height:1.6;
    margin-bottom:5mm;
  }
  .prices {
    display:flex; justify-content:center; gap:4mm;
    margin-bottom:5mm;
  }
  .price-chip {
    border:1px solid #e0e0e0; border-radius:2px;
    padding:2mm 4mm; text-align:center;
  }
  .price-chip .amount { font-size:16pt; font-weight:500; color:#111; display:block; }
  .price-chip .label  { font-size:7pt; color:#555; letter-spacing:0.08em; text-transform:uppercase; display:block; }
  .url {
    font-size:6.5pt; color:#bbb; letter-spacing:0.04em;
    border-top:1px solid #eee; padding-top:4mm;
  }
  .logo-line {
    display:flex; align-items:center; justify-content:center;
    gap:2mm; margin-bottom:5mm;
  }
  .logo-b { font-size:10pt; font-weight:500; color:#111; }
  .brand-name { font-size:6.5pt; letter-spacing:0.12em; text-transform:uppercase; color:#999; }
  @media print {
    body { background:#fff; padding:0; }
    .card { box-shadow:none; }
  }
</style>
</head>

</html>
