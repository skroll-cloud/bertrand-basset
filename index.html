<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bertrand Basset — Photographer & Filmmaker</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/logo-b.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Open Graph -->
    <meta property="og:title" content="Bertrand Basset — Photographer & Filmmaker">
    <meta property="og:description" content="Portrait — Immersion — Conversation. Photographer and filmmaker based in Brittany.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bertrandbasset.com">
</head>
<body>
    <!-- LANDING PAGE -->
    <div class="landing" id="landing">
        <div class="landing-image">
            <img src="images/landing/landing-01.jpg" alt="Photography by Bertrand Basset">
        </div>
        <div class="landing-content">
            <div class="lang-toggle">
                <a href="#" data-lang="en" class="active">EN</a>
                <span>/</span>
                <a href="#" data-lang="fr">FR</a>
            </div>

            <div class="brand-wrapper">
                <div class="brand-block">
                    <div class="logo-b">
                        <img src="assets/logo-b.svg" alt="B">
                    </div>
                    <div class="brand-text">
                        <span class="brand-name">Bertrand Basset</span>
                        <span class="brand-subtitle">Photographer & Filmmaker</span>
                    </div>
                </div>
                <button class="enter-btn" id="enterBtn">Enter</button>
            </div>
        </div>
    </div>

    <!-- MAIN SITE -->
    <div class="site" id="site">
        <aside class="sidebar">
            <header class="sidebar-header">
                <a href="#" class="sidebar-brand" id="homeLink">
                    <img src="assets/logo-b.svg" alt="B" class="sidebar-logo">
                    <span class="sidebar-brand-name">Bertrand Basset</span>
                </a>
                <div class="sidebar-lang">
                    <a href="#" data-lang="en" class="active">EN</a>
                    <span>/</span>
                    <a href="#" data-lang="fr">FR</a>
                </div>
            </header>

            <!-- Mobile menu toggle -->
            <button class="menu-toggle" id="menuToggle" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Nav — built dynamically by gallery.js -->
            <nav class="main-nav" id="mainNav"></nav>

            <!-- Gallery description zone -->
            <div id="galleryDesc" class="gallery-desc"></div>

            <footer class="sidebar-footer" id="sidebarFooter">
                <!-- Image caption -->
                <div class="image-caption"></div>

                <!-- Navigation -->
                <div class="gallery-footer-nav">
                    <div class="gallery-counter"></div>
                    <div class="gallery-nav">
                        <a href="#" id="prevBtn">prev</a>
                        <span>/</span>
                        <a href="#" id="nextBtn">next</a>
                    </div>
                    <button id="gridToggle" class="grid-toggle-btn" title="Voir toutes les photos">⊞</button>
                </div>
            </footer>
        </aside>

        <main class="site-main">
            <div class="gallery-container" id="galleryContainer">
                <img src="images/landing/landing-01.jpg" alt="Portfolio" class="gallery-image loaded">
            </div>
        </main>

        <!-- Thumbnails Panel -->
        <div class="thumbnails-panel" id="thumbnailsPanel">
            <button class="thumbnails-close" id="thumbnailsClose">&times;</button>
            <div class="thumbnails-grid" id="thumbnailsGrid"></div>
        </div>
    </div>

    <!-- Custom cursor -->
    <div class="custom-cursor" id="customCursor">
        <svg viewBox="0 0 24 24">
            <polyline points="9,6 15,12 9,18"></polyline>
        </svg>
    </div>

    <!-- Auto-generated image lists — run: node scan-galleries.js to refresh -->
    <script src="js/gallery-images.js"></script>
    <script src="js/gallery.js"></script>
</body>
</html>
