/* ── Sync all local images that are missing from GitHub ── */
async function syncImagesToGitHub(forceAll = false) {
    const cfg = loadGhConfig();
    if (!cfg.token) { openGhSettings('syncImagesToGitHub'); return; }

    if (!window._siteRootHandle) {
        showToast('⚠️ Lie d\'abord le dossier site/ (bouton 🔴 / 🟢)');
        return;
    }

    const btn = document.getElementById('imgSyncBtn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Scan…'; }

    try {
        /* Collect all image/audio files from images/ recursively */
        const files = [];
        async function walkDir(dirHandle, pathPrefix) {
            for await (const [name, handle] of dirHandle.entries()) {
                if (handle.kind === 'directory') {
                    await walkDir(handle, `${pathPrefix}/${name}`);
                } else if (handle.kind === 'file' && /\.(jpg|jpeg|png|gif|webp|svg|mp3|wav|m4a|ogg)$/i.test(name)) {
                    files.push({ handle, ghPath: `${pathPrefix}/${name}` });
                }
            }
        }

        const imagesDir = await window._siteRootHandle.getDirectoryHandle('images').catch(() => null);
        if (!imagesDir) { showToast('⚠️ Dossier images/ introuvable dans le dossier lié'); return; }
        await walkDir(imagesDir, 'images');

        if (files.length === 0) { showToast('Aucun fichier image trouvé dans images/'); return; }

        let uploaded = 0, skipped = 0, errors = 0;

        for (let i = 0; i < files.length; i++) {
            const { handle, ghPath } = files[i];
            if (btn) btn.textContent = `⏳ ${i + 1}/${files.length}`;

            try {
                /* Check existence on GitHub */
                const existingSha = await ghGetSha(cfg, ghPath);
                /* In normal mode: skip existing files. In forceAll mode: re-upload everything */
                if (existingSha !== null && !forceAll) { skipped++; continue; }

                /* Read and base64-encode binary file */
                const file = await handle.getFile();
                const arrayBuffer = await file.arrayBuffer();
                const uint8 = new Uint8Array(arrayBuffer);
                let binary = '';
                const CHUNK = 65536;
                for (let j = 0; j < uint8.length; j += CHUNK) {
                    binary += String.fromCharCode(...uint8.subarray(j, j + CHUNK));
                }
                const b64 = btoa(binary);

                /* Build PUT body — include sha if updating an existing file */
                const putBody = { message: `${existingSha ? 'Update' : 'Add'} image: ${ghPath}`, branch: cfg.branch, content: b64 };
                if (existingSha) putBody.sha = existingSha;

                /* Upload via GitHub Contents API */
                const res = await fetch(
                    `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(ghPath).replace(/%2F/g, '/')}`,
                    {
                        method: 'PUT',
                        headers: {
                            Authorization: `Bearer ${cfg.token}`,
                            'Content-Type': 'application/json',
                            'X-GitHub-Api-Version': '2022-11-28'
                        },
                        body: JSON.stringify(putBody)
                    }
                );

                if (res.ok) {
                    uploaded++;
                } else {
                    const errJson = await res.json().catch(() => ({}));
                    console.error(`Upload failed (${res.status}): ${ghPath}`, errJson);
                    errors++;
                    if (res.status === 401 || res.status === 403) {
                        showToast('🔴 Token invalide ou expiré — reconfigure GitHub');
                        openGhSettings('syncImagesToGitHub');
                        return;
                    }
                }
            } catch (e) {
                console.error(`Erreur upload: ${ghPath}`, e);
                errors++;
            }
        }

        const resultMsg = `📸 ${uploaded} image(s) envoyée(s) · ${skipped} déjà sur GitHub · ${errors} erreur(s)`;
        showToast(resultMsg);
        if (uploaded > 0) showToast('⏳ GitHub Pages déploie dans ~1 min — les images apparaîtront bientôt.');

    } catch (e) {
        console.error('syncImagesToGitHub error:', e);
        showToast('⚠️ Erreur sync images\u00a0: ' + e.message);
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = '📸 Images →'; }
    }
}

async function publishToGitHub() {
    const cfg = loadGhConfig();
    if (!cfg.token) { openGhSettings('publishToGitHub'); return; }

    const btn = document.getElementById('publishBtn');
    if (btn) { btn.disabled = true; btn.textContent = '\u23f3 Publication\u2026'; }

    try {
        /* Step 1 — ensure we have the root folder handle (required, no fallback) */
        if (!window._siteRootHandle) {
            if (btn) btn.textContent = '\u23f3 S\u00e9lectionne le dossier\u2026';
            await linkJsFolder();
            if (!window._siteRootHandle) {
                showToast('\u26a0\ufe0f Publi\u00e9 annul\u00e9 — dossier non s\u00e9lectionn\u00e9');
                return;
            }
        }

        if (btn) btn.textContent = '\u23f3 Lecture des fichiers\u2026';

        /* Step 2 — read all static files from disk */
        const indexContent      = await readFileFromDir(window._siteRootHandle, 'index.html');
        const cssContent        = await readFileFromSubDir(window._siteRootHandle, 'css', 'style.css');
        const galleryJsContent  = await readFileFromSubDir(window._siteRootHandle, 'js', 'gallery.js');
        const galleryImgContent  = await readFileFromSubDir(window._siteRootHandle, 'js', 'gallery-images.js');
        const dustinKolorContent = await readFileFromSubDir(window._siteRootHandle, 'dustin-kolor', 'index.html');

        if (!indexContent) {
            showToast('\u274C index.html illisible \u2014 le dossier s\u00e9lectionn\u00e9 est incorrect');
            return;
        }

        /* Step 3 — build file list */
        const now = new Date().toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
        const msg = `Admin: update \u2014 ${now}`;

        /* Auto cache-busting: replace ?v=YYYYMMDD in index.html with today's date */
        const d = new Date();
        const vTag = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
        const indexWithVersion = indexContent.replace(/\?v=\d{8}/g, `?v=${vTag}`);

        const files = [
            { path: 'index.html',                content: indexWithVersion },
            { path: 'css/style.css',             content: cssContent || '' },
            /* Lit depuis le disque — évite d’écraser avec l’état interne de l’admin */
            { path: 'js/gallery.js',             content: galleryJsContent   || generateGalleryJS() },
            { path: 'js/gallery-images.js',      content: galleryImgContent  || generateGalleryImagesJS() },
            /* Page expo Dust'in Kolor */
            ...(dustinKolorContent ? [{ path: 'dustin-kolor/index.html', content: dustinKolorContent }] : [])
        ];

        /* Step 4 — push files one by one (sequential to avoid GitHub commit conflicts) */
        for (let i = 0; i < files.length; i++) {
            const f = files[i];
            if (btn) btn.textContent = `\u23f3 Envoi ${i + 1}/${files.length}\u00a0: ${f.path.split('/').pop()}\u2026`;
            const sha = await ghGetSha(cfg, f.path);
            await ghPutFile(cfg, f.path, f.content, sha, msg);
        }

        clearDirty();
        const label = document.getElementById('savedLabel');
        if (label) label.textContent = '\uD83D\uDE80 Publi\u00e9 ' + new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
        showToast('\uD83D\uDE80 4 fichiers publi\u00e9s \u2014 GitHub Pages d\u00e9ploie dans ~1\u00a0min.');

    } catch(e) {
        console.error('GitHub publish error:', e);
        if (String(e.message).includes('401') || String(e.message).includes('403')) {
            showToast('\uD83D\uDD34 Token invalide ou expir\u00e9 \u2014 reconfigure GitHub');
            openGhSettings('publishToGitHub');
        } else {
            showToast('\u26a0\ufe0f ' + String(e.message).substring(0, 100));
        }
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = '\uD83D\uDE80 Publier'; }
    }
}

async function saveFileDirect(content, suggestedName, description) {
    if (!window.showSaveFilePicker) return false;
    try {
        const handle = await window.showSaveFilePicker({
            suggestedName,
            types: [{ description, accept: { 'text/javascript': ['.js'] } }],
            excludeAcceptAllOption: false
        });
        const writable = await handle.createWritable();
        await writable.write(content);
        await writable.close();
        return true;
    } catch(e) {
        if (e.name === 'AbortError') return null;
        console.error('showSaveFilePicker error:', e);
        return false;
    }
}

/* ── Fallback : téléchargement classique ── */
function downloadFile(content, filename) {
    const blob = new Blob([content], { type: 'text/javascript;charset=utf-8' });
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
}

    );

    [...builtInAuto, ...customAutoIds].forEach(id => {
        js += `    ${JSON.stringify(id)}: [\n`;
        (gc[id]?.images||[]).forEach((img,i,arr) => {

/* ── Serialise cartons array for export ── */
function serializeCartons(cartons) {
    if (!cartons || !cartons.length) return null;
    return JSON.stringify(cartons.map(c => ({
        cid:         c.cid,
        position:    c.position,
        titleFr:     c.titleFr     || '',
        titleEn:     c.titleEn     || '',
        subtitleFr:  c.subtitleFr  || '',
        subtitleEn:  c.subtitleEn  || '',
        descFr:      c.descFr      || '',
        descEn:      c.descEn      || '',
        ctaLabel:    c.ctaLabel    || '',
        ctaUrl:      c.ctaUrl      || '',
        categoryFr:  c.categoryFr  || '',
        categoryEn:  c.categoryEn  || '',
        sidebarFr:   c.sidebarFr   || '',
        sidebarEn:   c.sidebarEn   || ''
    })), null, 8);
}

function buildScannedGallery(id, g) {
    if (!g) return '';
    let s = `    ${JSON.stringify(id)}: {\n`;
    s += `        path:          ${JSON.stringify(g.path)},\n`;
    s += `        autoplay:      ${g.autoplay?'true':'false'},\n`;
    s += `        autoplayDelay: ${g.autoplayDelay||4},\n`;
    /* description/cta removed — represented by cartons to avoid duplicates */
    /* New cartons */
    const cartonsSer = serializeCartons(g.cartons);
    if (cartonsSer) s += `        cartons: ${cartonsSer},\n`;

    const captions = {}, buttons = {};
    (g.images||[]).forEach(img => {
        if (img.captionFr||img.captionEn) captions[img.filename] = { en: img.captionEn||'', fr: img.captionFr||'' };
        if (img.btnUrl) buttons[img.filename] = { label: img.btnLabel||'En savoir plus', url: img.btnUrl };
    });
    s += `        captions: ${JSON.stringify(captions)},\n`;
    if (Object.keys(buttons).length) s += `        buttons: ${JSON.stringify(buttons)},\n`;
    s += `    },\n\n`;
    return s;
}

function buildManualGallery(id, g) {
    if (!g) return '';
    let s = `    ${JSON.stringify(id)}: {\n`;
    s += `        path:          ${JSON.stringify(g.path)},\n`;
    s += `        autoplay:      ${g.autoplay?'true':'false'},\n`;
    s += `        autoplayDelay: ${g.autoplayDelay||4},\n`;
    if (g.autoplayAudio) s += `        autoplayAudio: true,\n`;
    if (g.hidden) s += `        hidden: true,\n`;
    /* description field removed — use cartons at position 0 instead to avoid duplicates */
    /* New cartons */
    const cartonsSer = serializeCartons(g.cartons);
    if (cartonsSer) s += `        cartons: ${cartonsSer},\n`;
    s += `        images: [\n`;
    (g.images||[]).forEach((img,i,arr) => {
        const obj = { filename: img.filename };
        if (img.audio)    obj.audio    = img.audio;
        if (img.audio && img.audioAutoplay !== undefined) obj.audioAutoplay = img.audioAutoplay;
        if (img.title)    obj.title    = img.title;
        if (img.subtitle) obj.subtitle = img.subtitle;
        if (img.captionFr||img.captionEn) obj.caption = { en: img.captionEn||'', fr: img.captionFr||'' };
        if (img.btnUrl)   obj.button   = { label: img.btnLabel||'En savoir plus', url: img.btnUrl };
        s += `            ${JSON.stringify(obj)}${i<arr.length-1?',':''}\n`;
    });
    s += `        ],\n        captions: {}\n    },\n\n`;
    return s;
}

/* ═══════════════════════════════════════════════════════
   TOAST & MODAL
═══════════════════════════════════════════════════════ */
function showToast(msg, isError=false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = 'show' + (isError?' error':'');
    setTimeout(() => t.className='', 2500);
}
function openModal(title, body, footer) {
    document.getElementById('modalTitle').textContent  = title;
    document.getElementById('modalBody').innerHTML     = body;
    document.getElementById('modalFooter').innerHTML   = footer;
    document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }
document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
});

function escHtml(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
