<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier — Dust'in Kolor — Bertrand Basset</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo-b.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font: 'IBM Plex Sans', -apple-system, Arial, sans-serif;
      --black: #111; --gray: #555; --dim: #999; --line: #e8e8e8; --bg: #f7f7f7;
    }
    html { font-family: var(--font); color: var(--black); background: #fff; -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font); cursor: pointer; border: none; background: none; }
    img { display: block; }

    /* HEADER */
    .site-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 2.5rem; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; background: #fff; z-index: 100;
    }
    .header-back {
      font-size: 0.55rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--dim); transition: color 0.15s;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .header-back:hover { color: var(--black); }
    .header-logo { width: 22px; height: 22px; opacity: 0.7; transition: opacity 0.15s; }
    .header-logo:hover { opacity: 1; }
    .header-right { display: flex; align-items: center; gap: 0.5rem; }
    .header-series { font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }

    /* LAYOUT */
    .page-wrap {
      max-width: 680px; margin: 0 auto; padding: 3rem 2.5rem 6rem;
    }
    .page-kicker { font-size: 0.52rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); margin-bottom: 0.5rem; }
    .page-title  { font-size: 2rem; font-weight: 300; letter-spacing: -0.02em; margin-bottom: 2.5rem; }

    /* CART ITEMS */
    .cart-empty { font-size: 0.82rem; color: var(--dim); text-align: center; padding: 4rem 0; }
    .cart-items { display: flex; flex-direction: column; margin-bottom: 0; }
    .cart-item {
      display: grid; grid-template-columns: 72px 1fr auto;
      gap: 1.1rem; align-items: center;
      padding: 1.1rem 0; border-bottom: 1px solid var(--line);
    }
    .cart-item-img { background: var(--bg); overflow: hidden; }
    .cart-item-img img { width: 72px; height: 72px; object-fit: cover; display: block; }
    .cart-item-name   { font-size: 0.82rem; font-weight: 300; margin-bottom: 0.15rem; }
    .cart-item-detail { font-size: 0.62rem; color: var(--dim); margin-bottom: 0.5rem; line-height: 1.5; }
    .cart-item-qty    { display: flex; align-items: center; gap: 0.5rem; }
    .qty-btn {
      width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; color: var(--black); transition: border-color 0.15s;
    }
    .qty-btn:hover { border-color: var(--black); }
    .qty-num { font-size: 0.72rem; color: var(--gray); min-width: 1ch; text-align: center; }
    .cart-item-right { text-align: right; display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-end; }
    .cart-item-prix { font-size: 0.92rem; font-weight: 300; }
    .cart-item-del  {
      font-size: 0.52rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim);
      transition: color 0.15s; cursor: pointer;
    }
    .cart-item-del:hover { color: #c00; }

    /* PROMO */
    .promo-section { margin: 1.6rem 0; }
    .promo-row { display: flex; gap: 0.5rem; }
    .promo-input {
      flex: 1; padding: 0.55rem 0.8rem; border: 1px solid var(--line);
      font-family: var(--font); font-size: 0.7rem; outline: none; transition: border-color 0.15s;
    }
    .promo-input:focus { border-color: var(--black); }
    .promo-btn {
      padding: 0.55rem 1rem; background: var(--bg); color: var(--black);
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      border: 1px solid var(--line); cursor: pointer; transition: background 0.15s;
    }
    .promo-btn:hover { background: var(--line); }
    .promo-msg { font-size: 0.62rem; margin-top: 0.4rem; min-height: 1em; }

    /* SUMMARY */
    .cart-summary {
      border-top: 1px solid var(--black); padding-top: 1.2rem; margin-bottom: 1.8rem;
    }
    .summary-row {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 0.5rem; font-size: 0.75rem;
    }
    .summary-label { color: var(--dim); font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .summary-total { font-size: 1.8rem; font-weight: 300; letter-spacing: -0.02em; }
    .livraison-note { font-size: 0.62rem; color: var(--dim); margin-bottom: 1.6rem; line-height: 1.6; }

    /* CHECKOUT */
    .btn-checkout {
      display: block; width: 100%; padding: 1.1rem;
      background: var(--black); color: #fff;
      font-size: 0.65rem; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase;
      text-align: center; border-radius: 2px; cursor: pointer; border: none;
      transition: background 0.2s; position: relative;
    }
    .btn-checkout:hover:not(:disabled) { background: #333; }
    .btn-checkout:disabled { background: #ccc; cursor: not-allowed; }
    .btn-checkout .spinner {
      display: none; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.6s linear infinite;
      position: absolute; right: 1.2rem; top: 50%; transform: translateY(-50%);
    }
    .btn-checkout.loading .spinner { display: block; }
    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    .checkout-note {
      font-size: 0.58rem; color: var(--dim); text-align: center; margin-top: 0.9rem; line-height: 1.7;
    }
    .checkout-error {
      font-size: 0.68rem; color: #c00; text-align: center;
      margin-top: 0.8rem; display: none;
    }

    /* MENTIONS */
    .sep { height: 1px; background: var(--line); margin: 2.5rem 0; }
    .continue-link {
      font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--dim); transition: color 0.15s;
    }
    .continue-link:hover { color: var(--black); }

    .mentions { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--line); }
    .mentions-title { font-size: 0.52rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); margin-bottom: 1.5rem; }
    .mentions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem 2.5rem; }
    .m-label { font-size: 0.52rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin-bottom: 0.4rem; }
    .m-block p { font-size: 0.67rem; color: var(--gray); line-height: 1.75; }
    .m-block strong { color: var(--black); font-weight: 400; }
    .m-block a { color: var(--black); border-bottom: 1px solid var(--line); }

    @media (max-width: 600px) {
      .page-wrap { padding: 2rem 1.2rem 4rem; }
      .mentions-grid { grid-template-columns: 1fr; }
      .cart-item { grid-template-columns: 60px 1fr auto; gap: 0.8rem; }
      .cart-item-img img { width: 60px; height: 60px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <a class="header-back" href="index.html">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2">
      <polyline points="9,2 4,7 9,12"/>
    </svg>
    Continuer mes achats
  </a>
  <a href="../index.html" title="Bertrand Basset">
    <img src="../assets/logo-b.svg" class="header-logo" alt="B">
  </a>
  <span class="header-series">Dust'in Kolor</span>
</header>

<div class="page-wrap">
  <p class="page-kicker">Ma sélection</p>
  <h1 class="page-title">Panier</h1>
  <div id="cartContent"></div>
</div>

<script>
/* ══════════════════════════════════
   CONFIG — À RENSEIGNER
   Récupérer dans : Supabase Dashboard → Settings → API
══════════════════════════════════ */
var SUPABASE_URL      = 'https://VOTRE_PROJECT_REF.supabase.co';
var SUPABASE_ANON_KEY = 'VOTRE_ANON_KEY';
var CHECKOUT_ENDPOINT = SUPABASE_URL + '/functions/v1/stripe-checkout';

/* ══════════════════════════════════
   IMAGES
══════════════════════════════════ */
var IMG_BY_SLUG = {
  'sandstorm-feu':          '../images/dustin-kolor/01.jpg',
  'flying-car-orange':      '../images/dustin-kolor/02.jpg',
  'after-the-storm-vert':   '../images/dustin-kolor/03.jpg',
  'lost-in-the-dust-rouge': '../images/dustin-kolor/04.jpg',
  'camp-lighters-jaune':    '../images/dustin-kolor/05.jpg',
  'im-here-bleu':           '../images/dustin-kolor/06.jpg',
  'umbrellas-way-rose':     '../images/dustin-kolor/08.jpg'
};

var PROMO_CODE     = 'Maman';
var PROMO_DISCOUNT = 0.10;
var promoApplied   = false;

/* ══════════════════════════════════
   PANIER
══════════════════════════════════ */
function getCart()    { try { return JSON.parse(localStorage.getItem('dk_cart') || '[]'); } catch(e) { return []; } }
function saveCart(c)  { localStorage.setItem('dk_cart', JSON.stringify(c)); }

function getImg(item) {
  if (item.type === 'carte')      return '../images/cartes-postales/' + item.id + '.jpg';
  if (item.type === 'carte-pack') return '../images/cartes-postales/' + (item.ids ? item.ids[0] : 'cp-01') + '.jpg';
  return IMG_BY_SLUG[item.slug] || '';
}

function getItemKey(item) {
  if (item.type === 'carte')      return 'carte-' + item.id;
  if (item.type === 'carte-pack') return 'carte-pack-' + (item.ids || []).join('-');
  return item.type + '-' + item.slug + (item.chassis ? '-chassis' : '');
}

function getDetail(item) {
  var parts = [];
  if (item.type === 'simple')      parts.push('Tirage simple');
  if (item.type === 'dibond')      parts.push('Contrecollé Dibond' + (item.chassis ? ' + Châssis alu' : ''));
  if (item.type === 'grand')       parts.push('Grand format');
  if (item.type === 'carte-pack')  parts.push('Pack 3 cartes');
  if (item.taille) parts.push(item.taille);
  return parts.join(' — ');
}

function changeQty(key, delta) {
  var cart = getCart();
  var idx = cart.findIndex(function(x) { return getItemKey(x) === key; });
  if (idx < 0) return;
  // Les tirages numérotés = qty toujours 1
  if (['simple','dibond','grand'].includes(cart[idx].type)) { if (delta < 0) { cart.splice(idx,1); } }
  else {
    cart[idx].qty = (cart[idx].qty || 1) + delta;
    if (cart[idx].qty <= 0) cart.splice(idx, 1);
  }
  saveCart(cart); renderCart();
}

function removeItem(key) {
  saveCart(getCart().filter(function(x) { return getItemKey(x) !== key; }));
  renderCart();
}

/* ══════════════════════════════════
   LIVRAISON
══════════════════════════════════ */
function calcShipping(cart) {
  var tirages = cart.filter(function(i) { return ['simple','dibond','grand'].includes(i.type); });
  var cartes  = cart.filter(function(i) { return i.type === 'carte' || i.type === 'carte-pack'; });
  var tTotal  = tirages.reduce(function(s,i) { return s + i.prix * (i.qty||1); }, 0);
  var cTotal  = cartes.reduce(function(s,i)  { return s + i.prix * (i.qty||1); }, 0);
  var frais = 0; var notes = [];
  if (tTotal > 0) {
    if (tTotal >= 200) notes.push('Livraison tirages France offerte.');
    else               notes.push('Livraison tirages France offerte dès 200 €.');
  }
  if (cTotal > 0) {
    if (cTotal >= 35) notes.push('Livraison cartes offerte.');
    else { frais += 4; notes.push('Livraison cartes : 4 €.'); }
  }
  return { frais: frais, note: notes.join(' ') };
}

/* ══════════════════════════════════
   PROMO
══════════════════════════════════ */
function applyPromo() {
  var val = (document.getElementById('promoInput').value || '').trim();
  promoApplied = val.toLowerCase() === PROMO_CODE.toLowerCase();
  var msg = document.getElementById('promoMsg');
  msg.textContent = promoApplied ? '✓ Code appliqué — −10 %' : (val ? 'Code invalide' : '');
  msg.style.color = promoApplied ? '#2a7a2a' : '#c00';
  renderCart();
}

/* ══════════════════════════════════
   RENDER
══════════════════════════════════ */
function renderCart() {
  var cart = getCart();
  var wrap = document.getElementById('cartContent');

  if (cart.length === 0) {
    wrap.innerHTML =
      '<p class="cart-empty">Votre panier est vide.</p>' +
      '<div class="sep"></div>' +
      '<a href="index.html" class="continue-link">← Retour à la galerie</a>';
    return;
  }

  var sub    = cart.reduce(function(s,i) { return s + i.prix * (i.qty||1); }, 0);
  var ship   = calcShipping(cart);
  var remise = promoApplied ? Math.round(sub * PROMO_DISCOUNT * 100) / 100 : 0;
  var total  = sub - remise + ship.frais;

  var itemsHtml = cart.map(function(item) {
    var key    = getItemKey(item);
    var img    = getImg(item);
    var detail = getDetail(item);
    var isTirage = ['simple','dibond','grand'].includes(item.type);
    var qty    = item.qty || 1;
    var qtyCtrl = isTirage
      ? '<span style="font-size:0.62rem;color:var(--dim)">1 exemplaire numéroté</span>'
      : '<div class="cart-item-qty">' +
          '<button class="qty-btn" onclick="changeQty(\'' + key + '\',-1)">−</button>' +
          '<span class="qty-num">' + qty + '</span>' +
          '<button class="qty-btn" onclick="changeQty(\'' + key + '\',+1)">+</button>' +
        '</div>';
    return '<div class="cart-item">' +
        '<div class="cart-item-img"><img src="' + img + '" alt="' + item.titre + '" loading="lazy"></div>' +
        '<div>' +
          '<div class="cart-item-name">' + item.titre + '</div>' +
          '<div class="cart-item-detail">' + detail + '</div>' +
          qtyCtrl +
        '</div>' +
        '<div class="cart-item-right">' +
          '<div class="cart-item-prix">' + (item.prix * qty).toLocaleString('fr-FR') + ' €</div>' +
          '<span class="cart-item-del" onclick="removeItem(\'' + key + '\')">Retirer</span>' +
        '</div>' +
      '</div>';
  }).join('');

  var promoHtml =
    '<div class="promo-section">' +
      '<div class="promo-row">' +
        '<input type="text" id="promoInput" class="promo-input" placeholder="Code de réduction"' +
          ' value="' + (promoApplied ? PROMO_CODE : '') + '">' +
        '<button class="promo-btn" onclick="applyPromo()">Appliquer</button>' +
      '</div>' +
      '<div id="promoMsg" class="promo-msg" style="color:' + (promoApplied?'#2a7a2a':'#c00') + '">' +
        (promoApplied ? '✓ Code appliqué — −10 %' : '') +
      '</div>' +
    '</div>';

  var summaryHtml =
    '<div class="cart-summary">' +
      '<div class="summary-row"><span class="summary-label">Sous-total</span><span>' + sub.toLocaleString('fr-FR') + ' €</span></div>' +
      (remise > 0 ? '<div class="summary-row"><span class="summary-label">Réduction −10 %</span><span style="color:#2a7a2a">−' + remise.toLocaleString('fr-FR') + ' €</span></div>' : '') +
      (ship.frais > 0 ? '<div class="summary-row"><span class="summary-label">Livraison</span><span>' + ship.frais + ' €</span></div>' : '') +
      '<div class="summary-row" style="margin-top:0.8rem;border-top:1px solid var(--line);padding-top:0.8rem">' +
        '<span class="summary-label" style="font-size:0.75rem;color:var(--black)">Total</span>' +
        '<span class="summary-total">' + total.toLocaleString('fr-FR') + ' €</span>' +
      '</div>' +
    '</div>' +
    (ship.note ? '<p class="livraison-note">' + ship.note + '</p>' : '');

  var ctaHtml =
    '<button class="btn-checkout" id="btnCheckout" onclick="checkout()">Payer avec Stripe<div class="spinner"></div></button>' +
    '<p class="checkout-note">Paiement 100 % sécurisé · Carte bancaire · Délai fabrication 2–3 semaines<br>Fabriqué par Pix in the City, Auray</p>' +
    '<p class="checkout-error" id="checkoutError"></p>';

  var mentionsHtml =
    '<div class="sep"></div>' +
    '<a href="index.html" class="continue-link">← Continuer mes achats</a>' +
    '<div class="mentions"><p class="mentions-title">Informations légales</p>' +
    '<div class="mentions-grid">' +
      '<div class="m-block"><p class="m-label">Vendeur</p><p>Bertrand Basset<br>SIREN 820 257 962<br>Carantec, Finistère<br><a href="mailto:bertrand.basset@gmail.com">bertrand.basset@gmail.com</a></p></div>' +
      '<div class="m-block"><p class="m-label">Retours</p><p>Œuvres fabriquées à la commande — <strong>exclues du droit de rétractation</strong> (art. L221-28 4°). Ni reprises ni échangées.</p></div>' +
      '<div class="m-block"><p class="m-label">Livraison</p><p>France offerte dès 200 € (tirages) et dès 35 € (cartes). Europe et monde sur demande.</p></div>' +
      '<div class="m-block"><p class="m-label">Données</p><p>Vos données sont traitées uniquement pour l\'exécution de la commande, conformément au RGPD.</p></div>' +
    '</div></div>';

  wrap.innerHTML = '<div class="cart-items">' + itemsHtml + '</div>' +
    promoHtml + summaryHtml + ctaHtml + mentionsHtml;
}

/* ══════════════════════════════════
   CHECKOUT → STRIPE
══════════════════════════════════ */
function checkout() {
  var cart = getCart();
  if (cart.length === 0) return;

  var btn = document.getElementById('btnCheckout');
  var errEl = document.getElementById('checkoutError');
  btn.disabled = true;
  btn.classList.add('loading');
  if (errEl) errEl.style.display = 'none';

  var body = {
    items:      cart,
    promo:      promoApplied ? PROMO_CODE : null,
    success_url: window.location.origin + '/dustin-kolor/merci.html',
    cancel_url:  window.location.href
  };

  fetch(CHECKOUT_ENDPOINT, {
    method:  'POST',
    headers: {
      'Content-Type':  'application/json',
      'apikey':        SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
    },
    body: JSON.stringify(body)
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (data.url) {
      window.location.href = data.url;
    } else {
      throw new Error(data.error || 'Erreur inconnue');
    }
  })
  .catch(function(err) {
    btn.disabled = false;
    btn.classList.remove('loading');
    if (errEl) {
      errEl.textContent = 'Erreur : ' + err.message + '. Réessayez ou contactez bertrand.basset@gmail.com';
      errEl.style.display = 'block';
    }
  });
}

renderCart();
</script>
</body>
</html>
