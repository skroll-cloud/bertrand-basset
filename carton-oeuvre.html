<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartons d'œuvres — Bertrand Basset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'IBM Plex Sans', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background: #d8d8d8; padding: 24px; }

    /* ── SCREEN HEADER ── */
    .screen-bar {
      max-width: 220mm; margin: 0 auto 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .screen-title { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #888; }
    .btn-print {
      font-family: inherit; padding: 8px 20px; background: #111; color: #fff;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px;
    }
    .btn-print:hover { background: #333; }

    /* ── PAGE A4 ── */
    .page {
      width: 210mm;
      background: #fff;
      margin: 0 auto 20px;
      padding: 10mm;
      display: flex; flex-direction: column; gap: 4.5mm;
      box-shadow: 0 2px 20px rgba(0,0,0,0.15);
    }

    /* ══════════════════════════════
       GABARIT UNIQUE — tous les cartons
       ══════════════════════════════ */
    .carton {
      border: 0.5pt solid #ccc;
      display: flex; flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Header coloré */
    .c-head {
      padding: 3.5mm 6mm 3mm 7mm;
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0;
    }
    .c-head-left {}
    .c-head-meta {
      font-size: 5.5pt; letter-spacing: 0.18em; text-transform: uppercase;
      margin-bottom: 1mm;
    }
    .c-head-title { font-size: 17pt; font-weight: 300; letter-spacing: -0.02em; line-height: 1; }
    .c-head-right {
      font-size: 5.5pt; letter-spacing: 0.12em; text-transform: uppercase;
      text-align: right;
    }

    /* Body : info | prix | QR */
    .c-body {
      flex: 1;
      display: flex; align-items: center;
      padding: 3.5mm 5mm 3.5mm 7mm;
      gap: 5mm;
      border-top: 0.3pt solid #e0e0e0;
    }

    .c-info { flex: 1; }
    .c-desc { font-size: 6.5pt; color: #444; line-height: 1.55; font-weight: 300; margin-bottom: 2mm; }
    .c-specs { font-size: 6.5pt; color: #666; line-height: 1.55; font-weight: 300; }
    .c-specs strong { font-weight: 500; color: #111; }

    /* Bloc prix (grand format + A4) */
    .c-prix {
      flex-shrink: 0; min-width: 42mm;
      display: flex; flex-direction: column; gap: 1.5mm;
      border-left: 0.3pt solid #e0e0e0;
      padding-left: 5mm;
    }
    .c-prix-row { display: flex; justify-content: space-between; align-items: baseline; gap: 3mm; }
    .c-prix-label { font-size: 5.5pt; color: #888; text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
    .c-prix-val { font-size: 11pt; font-weight: 300; color: #111; letter-spacing: -0.01em; white-space: nowrap; }
    .c-prix-val-small { font-size: 9pt; font-weight: 300; color: #555; }
    .c-prix-note { font-size: 5pt; color: #aaa; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 0.5mm; }

    /* QR code */
    .c-qr-wrap {
      flex-shrink: 0;
      border-left: 0.3pt solid #e0e0e0;
      padding-left: 5mm;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5mm;
    }
    .c-qr { width: 20mm; height: 20mm; }
    .c-qr canvas, .c-qr img { width: 100% !important; height: 100% !important; }
    .c-qr-label { font-size: 4.5pt; letter-spacing: 0.08em; text-transform: uppercase; color: #bbb; text-align: center; }

    /* ── PRINT ── */
    @media print {
      body { background: none; padding: 0; }
      .screen-bar { display: none; }
      .page { margin: 0; box-shadow: none; page-break-after: always; break-after: page; }
      .carton { border: 0.3pt solid #bbb; }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body>

<div class="screen-bar">
  <span class="screen-title">Cartons d'œuvres · 2 pages A4 · imprimer → couper</span>
  <button class="btn-print" onclick="window.print()">Imprimer</button>
</div>

<!-- Page 1 : cartons 01 02 04 05 -->
<div class="page" id="page1"></div>

<!-- Page 2 : cartons 06 08 + cartes postales -->
<div class="page" id="page2"></div>

<script>
const BASE   = 'https://bertrandbasset.com/boutique.html?id=';
const PAYER  = 'https://bertrandbasset.com/payer.html';
let qrCount  = 0;

/* ── Catalogue (After the Storm exclue — pas encore tirée) ── */
const EDITIONS = [
  { slug:'sandstorm-feu',          num:'01', titre:'Sandstorm',       hex:'#FF4500', format:'60 × 90 cm',  prix:'850 €',  a4:'160 €', papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm' },
  { slug:'flying-car-orange',      num:'02', titre:'Flying Car',      hex:'#FF6600', format:'70 × 124 cm', prix:'1 290 €',a4:'160 €', papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm' },
  { slug:'lost-in-the-dust-rouge', num:'04', titre:'Lost in the Dust',hex:'#CC0000', format:'60 × 80 cm',  prix:'890 €',  a4:'160 €', papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm' },
  { slug:'camp-lighters-jaune',    num:'05', titre:'Camp Lighters',   hex:'#FFB300', format:'40 × 100 cm', prix:'790 €',  a4:'160 €', papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm' },
  { slug:'im-here-bleu',           num:'06', titre:"I'm Here",        hex:'#0066CC', format:'60 × 80 cm',  prix:'890 €',  a4:'160 €', papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm' },
  { slug:'umbrellas-way-rose',     num:'08', titre:'Umbrellas Way',   hex:'#FF1493', format:'60 × 80 cm',  prix:'890 €',  a4:'160 €', papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm' },
];

/* Luminance → couleur texte sur fond coloré */
function textColor(hex) {
  const h = hex.replace('#','');
  const l = (0.299*parseInt(h.substr(0,2),16) + 0.587*parseInt(h.substr(2,2),16) + 0.114*parseInt(h.substr(4,2),16)) / 255;
  return l > 0.55 ? '#111' : '#fff';
}
function dimColor(hex) {
  const h = hex.replace('#','');
  const l = (0.299*parseInt(h.substr(0,2),16) + 0.587*parseInt(h.substr(2,2),16) + 0.114*parseInt(h.substr(4,2),16)) / 255;
  return l > 0.55 ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.6)';
}

function makeArtworkCarton(ed) {
  const tc = textColor(ed.hex);
  const dc = dimColor(ed.hex);
  const qid = 'qr-' + ed.slug;

  const div = document.createElement('div');
  div.className = 'carton';
  div.innerHTML = `
    <div class="c-head" style="background:${ed.hex}">
      <div class="c-head-left">
        <div class="c-head-meta" style="color:${dc}">№ ${ed.num} · Dust'in Kolor · Bertrand Basset</div>
        <div class="c-head-title" style="color:${tc}">${ed.titre}</div>
      </div>
      <div class="c-head-right" style="color:${dc}">bertrandbasset.com</div>
    </div>
    <div class="c-body">
      <div class="c-info">
        <div class="c-desc">Série limitée à 10 exemplaires numérotée et signée par l'artiste · Certificat d'authenticité inclus</div>
        <div class="c-specs"><strong>${ed.format}</strong> · ${ed.papier}<br>Tirage d'art : Pix in the City, Auray</div>
      </div>
      <div class="c-prix">
        <div>
          <div class="c-prix-row">
            <span class="c-prix-label">Grand format</span>
            <span class="c-prix-val">${ed.prix}</span>
          </div>
          <div class="c-prix-note">3 premiers ex. · prix progressif</div>
        </div>
        <div>
          <div class="c-prix-row">
            <span class="c-prix-label">A4 · Museum Etching</span>
            <span class="c-prix-val-small">${ed.a4}</span>
          </div>
          <div class="c-prix-note">30 ex. · prix fixe</div>
        </div>
      </div>
      <div class="c-qr-wrap">
        <div class="c-qr" id="${qid}"></div>
        <div class="c-qr-label">Voir & commander</div>
      </div>
    </div>`;
  return div;
}

function makeCartePostale() {
  const div = document.createElement('div');
  div.className = 'carton';
  div.innerHTML = `
    <div class="c-head" style="background:#111">
      <div class="c-head-left">
        <div class="c-head-meta" style="color:rgba(255,255,255,0.5)">Exposition · Dust'in Kolor · Bertrand Basset</div>
        <div class="c-head-title" style="color:#fff">Cartes postales</div>
      </div>
      <div class="c-head-right" style="color:rgba(255,255,255,0.4)">bertrandbasset.com</div>
    </div>
    <div class="c-body">
      <div class="c-info">
        <div class="c-desc">Format 10 × 15 cm · Impression haute définition · Pix in the City, Auray</div>
        <div class="c-specs">Règlement sécurisé par carte bancaire · Scannez le QR code ci-contre</div>
      </div>
      <div class="c-prix">
        <div class="c-prix-row">
          <span class="c-prix-label">1 carte postale</span>
          <span class="c-prix-val">6 €</span>
        </div>
        <div class="c-prix-row" style="margin-top:2mm">
          <span class="c-prix-label">Pack 3 cartes</span>
          <span class="c-prix-val">15 €</span>
        </div>
        <div class="c-prix-note" style="margin-top:1mm">5 € la carte · économisez 17 %</div>
      </div>
      <div class="c-qr-wrap">
        <div class="c-qr" id="qr-cartes"></div>
        <div class="c-qr-label">Payer en ligne</div>
      </div>
    </div>`;
  return div;
}

/* ── Assemblage ── */
const page1 = document.getElementById('page1');
const page2 = document.getElementById('page2');

EDITIONS.forEach((ed, i) => {
  (i < 4 ? page1 : page2).appendChild(makeArtworkCarton(ed));
});
page2.appendChild(makeCartePostale());

/* ── QR Codes ── */
EDITIONS.forEach(ed => {
  new QRCode(document.getElementById('qr-' + ed.slug), {
    text: BASE + ed.slug, width: 120, height: 120,
    colorDark: '#111', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M
  });
});
new QRCode(document.getElementById('qr-cartes'), {
  text: PAYER, width: 120, height: 120,
  colorDark: '#111', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M
});
</script>
</body>
</html>
