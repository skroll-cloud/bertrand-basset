<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portfolio V4 — Bertrand Basset</title>
<style>
/* ─── RESET ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─── VARIABLES ──────────────────────────────────────── */
:root {
    --bg:       #111;
    --surface:  #1a1a1a;
    --surface2: #222;
    --border:   #2e2e2e;
    --border2:  #3a3a3a;
    --text:     #ddd;
    --dim:      #888;
    --accent:   #fff;
    --green:    #2e7d32;
    --red:      #b71c1c;
    --sidebar:  240px;
}

/* ─── BASE ───────────────────────────────────────────── */
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: 13px;
}

/* ─── TOPBAR ─────────────────────────────────────────── */
#topbar {
    background: #0a0a0a;
    border-bottom: 1px solid var(--border);
    height: 44px;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-shrink: 0;
    z-index: 20;
}
.topbar-brand {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
}
.topbar-version {
    font-size: 0.6rem;
    color: #444;
}
.topbar-spacer { flex: 1; }
.topbar-saved {
    font-size: 0.6rem;
    color: #555;
    font-style: italic;
}

/* ─── BUTTONS ────────────────────────────────────────── */
.btn {
    padding: 0.3rem 0.8rem;
    font-size: 0.68rem;
    font-family: inherit;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid var(--border2);
    transition: all 0.15s;
    white-space: nowrap;
}
.btn-ghost   { background: transparent; color: var(--dim); }
.btn-ghost:hover { background: var(--surface2); color: var(--text); }
.btn-white   { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
.btn-white:hover { background: #e8e8e8; }
.btn-green   { background: var(--green); color: #fff; border-color: var(--green); }
.btn-green:hover { background: #388e3c; }
.btn-red     { background: var(--red); color: #fff; border-color: var(--red); }
.btn-red:hover { background: #c62828; }
.btn-sync    { background: transparent; color: var(--dim); border-color: var(--border); font-size: 0.68rem; }
.btn-sync:hover { background: var(--surface2); color: var(--text); }
.btn-sync.linked { color: #4caf50; border-color: #4caf50; }
.btn-publish { background: #1565c0; color: #fff; border-color: #1565c0; font-size: 0.68rem; }
.btn-publish:hover { background: #0d47a1; }
.btn-publish:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-publish.dirty { background: #e65100; border-color: #e65100; animation: pulse-dirty 1.5s ease-in-out infinite; }
.btn-img-sync { background: #1b5e20; color: #fff; border-color: #1b5e20; font-size: 0.68rem; }
.btn-img-sync:hover { background: #2e7d32; }
.btn-img-sync:disabled { opacity: 0.5; cursor: not-allowed; }
@keyframes pulse-dirty { 0%,100%{opacity:1} 50%{opacity:0.75} }
.autopush-label { display:flex; align-items:center; gap:0.3rem; font-size:0.62rem; color:var(--dim); cursor:pointer; user-select:none; white-space:nowrap; }
.autopush-label input { cursor:pointer; }
.btn-sm { padding: 0.18rem 0.5rem; font-size: 0.62rem; }

/* ─── LAYOUT ─────────────────────────────────────────── */
#app { display: flex; flex: 1; overflow: hidden; }

/* ─── SIDEBAR ────────────────────────────────────────── */
#sidebar {
    width: var(--sidebar);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
}
.sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
.sidebar-tab {
    flex: 1;
    padding: 0.55rem 0;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--dim);
    font-size: 0.6rem;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.15s;
}
.sidebar-tab:hover { color: var(--text); background: var(--surface2); }
.sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.sidebar-body { flex: 1; overflow-y: auto; }

/* Gallery list */
.gallery-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.65rem 1rem;
    cursor: pointer;
    border-left: 2px solid transparent;
    font-size: 0.75rem;
    transition: all 0.12s;
}
.gallery-item:hover { background: var(--surface2); }
.gallery-item.active {
    background: var(--surface2);
    border-left-color: var(--accent);
    color: var(--accent);
}
.gallery-item-icon { font-size: 0.8rem; opacity: 0.6; width: 16px; flex-shrink: 0; }
.gallery-item-name { flex: 1; }
.gallery-item-count {
    font-size: 0.6rem;
    color: var(--dim);
    background: var(--bg);
    padding: 0.1rem 0.35rem;
    border-radius: 10px;
}
.gallery-item-del {
    background: none; border: none; cursor: pointer;
    font-size: 0.75rem; color: #555; opacity: 0;
    padding: 0 0.15rem; line-height: 1; flex-shrink: 0;
    transition: opacity 0.15s, color 0.15s;
}
.gallery-item:hover .gallery-item-del { opacity: 1; }
.gallery-item-del:hover { color: #c55 !important; }
.gallery-badge {
    font-size: 0.55rem;
    color: #555;
    background: var(--bg);
    padding: 0.1rem 0.3rem;
    border-radius: 2px;
    border: 1px solid var(--border);
}

/* Menu list */
.menu-item-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.45rem 0.75rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.7rem;
}
.menu-item-drag { color: var(--dim); cursor: grab; font-size: 0.7rem; }
.menu-item-name { flex: 1; }
.menu-item-name input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 0.7rem;
    font-family: inherit;
    border-bottom: 1px solid transparent;
    padding: 1px 0;
}
.menu-item-name input:focus { outline: none; border-bottom-color: var(--border2); }
.menu-item-type { font-size: 0.58rem; color: #555; }
.menu-item-vis { display: flex; align-items: center; }
.menu-item-vis input[type="checkbox"] { width: 13px; height: 13px; cursor: pointer; accent-color: #fff; }
.menu-item-hidden { opacity: 0.4; }

/* Cartons — editor card */
.carton-card {
    background: #161616;
    border: 1px solid #3a3a3a;
    border-left: 3px solid #666;
    border-radius: 4px;
    padding: 0.8rem 0.9rem;
    margin-bottom: 0;
    position: relative;
}
.carton-card-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.65rem;
}
.carton-card-badge {
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #888;
    background: #222;
    border: 1px solid #333;
    padding: 0.15rem 0.45rem;
    border-radius: 2px;
}
.carton-card-title-preview {
    flex: 1;
    font-size: 0.78rem;
    font-weight: 600;
    color: #ccc;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.carton-card-actions {
    display: flex;
    gap: 0.4rem;
    flex-shrink: 0;
}
.carton-card-body {
    display: grid;
    gap: 0.5rem;
}
.carton-card-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
}

/* Insert-carton button between items */
.insert-carton-zone {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.25rem 0;
    opacity: 0.3;
    transition: opacity 0.15s;
    cursor: pointer;
}
.insert-carton-zone:hover { opacity: 1; }
.insert-carton-line {
    flex: 1;
    height: 1px;
    background: #444;
}
.insert-carton-btn {
    font-size: 0.6rem;
    color: #aaa;
    background: #1e1e1e;
    border: 1px dashed #444;
    border-radius: 2px;
    padding: 0.2rem 0.6rem;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
}
.insert-carton-btn:hover { background: #2a2a2a; color: #fff; border-color: #666; }

/* The unified list (images + cartons) */
.gallery-items-list {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}
/* Images subgrid: 3 columns inside the flex column */
.images-subgrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
    align-items: start;
}
/* Add-zone and notice are direct flex children, naturally full-width */

/* Settings */
.settings-group { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
.settings-group h4 { font-size: 0.6rem; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
.settings-field { margin-bottom: 0.4rem; }
.settings-label { font-size: 0.58rem; color: #555; margin-bottom: 0.2rem; display: block; }
.settings-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.25rem 0.4rem;
    font-size: 0.68rem;
    font-family: inherit;
    border-radius: 2px;
}
.settings-input:focus { outline: none; border-color: var(--border2); }

/* Sidebar footer */
.sidebar-footer {
    padding: 0.6rem;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    flex-shrink: 0;
}

/* ─── EDITOR ─────────────────────────────────────────── */
#editor {
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
    padding: 1.5rem 2rem 3rem;
}

/* Editor header */
.ed-header { margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
.ed-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.2rem; }
.ed-subtitle { font-size: 0.65rem; color: var(--dim); }

/* Field groups */
.field-group { margin-bottom: 1rem; }
.field-label {
    font-size: 0.6rem;
    font-weight: 600;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.3rem;
    display: block;
}
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.field-input, .field-textarea, .field-select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.4rem 0.6rem;
    font-size: 0.72rem;
    font-family: inherit;
    border-radius: 3px;
}
.field-input:focus, .field-textarea:focus { outline: none; border-color: var(--border2); }
.field-textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
.field-textarea.tall { min-height: 110px; }

/* Section separator */
.sep { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
.section-title {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.section-title span { flex: 1; }
.section-title .count { font-size: 0.6rem; color: #444; font-weight: 400; }

/* ─── IMAGE GRID ─────────────────────────────────────── */
.images-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 1rem;
    margin-top: 0.5rem;
}

.image-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    transition: border-color 0.15s;
}
.image-card:hover { border-color: var(--border2); }
.image-card.dragging { opacity: 0.35; border-style: dashed; }
.image-card.drag-over { border-color: var(--accent); border-style: dashed; }

.image-thumb-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--surface2);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}
.image-thumb {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}
.image-thumb-empty {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    font-size: 1.2rem;
}
.image-card-body { padding: 0.5rem 0.6rem 0.3rem; }

/* Compact filename shown below thumbnail */
.image-card-filename {
    font-size: 0.58rem;
    color: #666;
    padding: 0.25rem 0.4rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border-top: 1px solid var(--border);
}

/* Legacy (inside body, kept for accueil cards) */
.img-filename {
    font-size: 0.6rem;
    color: #555;
    margin-bottom: 0.6rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* Collapsible edit fields */
details.image-card-fields {
    border-top: 1px solid var(--border);
}
details.image-card-fields > summary {
    font-size: 0.58rem;
    color: var(--dim);
    cursor: pointer;
    padding: 0.25rem 0.5rem;
    list-style: none;
    user-select: none;
    outline: none;
}
details.image-card-fields > summary::-webkit-details-marker { display: none; }
details.image-card-fields > summary::before {
    content: '▸ ';
    font-size: 0.5rem;
}
details.image-card-fields[open] > summary::before {
    content: '▾ ';
}

/* ── Image Scanner ──────────────────────────── */
.scanner-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
}
.scanner-card {
    display: flex;
    flex-direction: column;
    border-radius: 3px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
}
.scanner-thumb-wrap {
    aspect-ratio: 1 / 1;
    background: var(--surface2);
    position: relative;
    overflow: hidden;
}
.scanner-thumb {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}
/* Actions overlay: hidden until hover */
.scanner-actions {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    opacity: 0;
    transition: opacity 0.15s;
}
.scanner-thumb-wrap:hover .scanner-actions { opacity: 1; }
.scanner-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    padding: 0.25rem 0.6rem;
    font-size: 0.65rem;
    border-radius: 3px;
    cursor: pointer;
    width: 80%;
    transition: background 0.12s;
}
.scanner-btn:hover { background: rgba(255,255,255,0.3); }
.scanner-move-select {
    width: 80%;
    background: rgba(20,20,20,0.85);
    border: 1px solid rgba(255,255,255,0.25);
    color: #ddd;
    font-size: 0.58rem;
    font-family: inherit;
    padding: 0.22rem 0.3rem;
    border-radius: 3px;
    cursor: pointer;
}
.scanner-fname {
    font-size: 0.55rem;
    color: #777;
    padding: 0.2rem 0.35rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border-top: 1px solid var(--border);
}
/* Filter buttons */
.scan-filter-btn { font-size: 0.65rem !important; padding: 0.2rem 0.6rem !important; }
.scan-filter-btn.active { background: var(--accent) !important; color: var(--bg) !important; border-color: var(--accent) !important; }
/* Landing button (below image card) */
.scanner-landing-btn {
    width: 100%;
    background: transparent;
    border: none;
    border-top: 1px solid var(--border);
    color: var(--dim);
    font-size: 0.56rem;
    padding: 0.22rem 0.35rem;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: color 0.12s;
}
.scanner-landing-btn:hover { color: #6dbf6d; }
/* Broken image card — always show actions overlay, orange border */
.scanner-card-broken { border-color: rgba(255,120,0,0.5); }
.scanner-card-broken .scanner-thumb { opacity: 0.05; }
.scanner-card-broken .scanner-actions { opacity: 1; background: rgba(0,0,0,0.7); }
.scanner-card-broken .scanner-fname { color: #e65100; }
/* Relink button (in broken image-thumb-empty zone) */
.relink-btn {
    margin-top: 0.35rem;
    font-size: 0.58rem;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: #bbb;
    padding: 0.2rem 0.5rem;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s;
}
.relink-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }

/* Mini fields */
.mini-field { margin-bottom: 0.45rem; }
.mini-label {
    font-size: 0.56rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 0.18rem;
    display: block;
}
.mini-input, .mini-textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.22rem 0.4rem;
    font-size: 0.67rem;
    font-family: inherit;
    border-radius: 2px;
}
.mini-input:focus, .mini-textarea:focus { outline: none; border-color: var(--border2); }
.mini-textarea { resize: vertical; min-height: 42px; line-height: 1.4; }
.mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem; }
.mini-flex { display: flex; gap: 0.3rem; }

/* Image card actions */
.image-card-actions {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.4rem 0.75rem;
    border-top: 1px solid var(--border);
}
.btn-icon {
    background: transparent;
    border: none;
    color: var(--dim);
    cursor: pointer;
    padding: 0.18rem 0.4rem;
    font-size: 0.65rem;
    border-radius: 2px;
    font-family: inherit;
    transition: all 0.12s;
}
.btn-icon:hover { background: var(--surface2); color: var(--text); }
.btn-icon.danger:hover { color: #e57373; }
.drag-handle { cursor: grab; }
.drag-handle:active { cursor: grabbing; }

/* Add image zone */
.add-zone {
    border: 2px dashed var(--border);
    border-radius: 4px;
    padding: 1.5rem;
    text-align: center;
    color: var(--dim);
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    min-height: 80px;
}
.add-zone:hover { border-color: var(--border2); color: var(--text); }
.add-zone .icon { font-size: 1.2rem; }

/* ─── NOTICE ─────────────────────────────────────────── */
.notice {
    background: var(--surface);
    border-left: 3px solid var(--border2);
    padding: 0.5rem 0.75rem;
    font-size: 0.68rem;
    color: var(--dim);
    border-radius: 0 3px 3px 0;
    margin-bottom: 1rem;
    line-height: 1.5;
}

/* ─── MODAL ──────────────────────────────────────────── */
.modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex; align-items: center; justify-content: center;
    z-index: 500;
}
.modal-overlay.hidden { display: none; }
.modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 6px;
    min-width: 380px;
    max-width: 560px;
    width: 90%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
}
.modal-header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.modal-title { font-size: 0.82rem; font-weight: 600; flex: 1; }
.modal-close {
    background: transparent; border: none; color: var(--dim);
    cursor: pointer; font-size: 1rem; padding: 0; line-height: 1;
}
.modal-body { padding: 1.25rem; overflow-y: auto; flex: 1; font-size: 0.75rem; line-height: 1.6; }
.modal-footer {
    padding: 0.75rem 1.25rem;
    border-top: 1px solid var(--border);
    display: flex; gap: 0.5rem; justify-content: flex-end;
}

/* ─── TOAST ──────────────────────────────────────────── */
#toast {
    position: fixed; bottom: 1.5rem; left: 50%;
    transform: translateX(-50%);
    background: #2a2a2a; color: var(--text);
    padding: 0.55rem 1.4rem;
    border-radius: 4px; font-size: 0.75rem;
    pointer-events: none; opacity: 0;
    transition: opacity 0.2s; z-index: 1000;
    border: 1px solid #3a3a3a; white-space: nowrap;
}
#toast.show { opacity: 1; }
#toast.error { background: #3a1a1a; border-color: #c62828; color: #ffcccc; }

/* ─── SCROLLBAR ──────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: #444; }

/* ─── EXPORT CODE PREVIEW ────────────────────────────── */
.code-preview {

/* ─── SVG ICONS ──────────────────────────────────────── */
const SVG = {

    facebook:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>`,
    linkedin:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4V9h4v2a6 6 0 0 1 2-2z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>`
};

/* ─── PAGE BUILDERS ──────────────────────────────────── */
function buildPage(pageId, lang) {
    const page = (typeof PAGES_CONFIG !== 'undefined') && PAGES_CONFIG[pageId];
    const en   = lang === 'en';
    const s    = SITE_CONFIG.social;
    const email = SITE_CONFIG.email || 'bertrand.basset@gmail.com';
    if (!page || !page.sections?.length) return '';
    const sections = page.sections.map(sec => {
        const title = en ? (sec.titleEn || sec.titleFr || '') : (sec.titleFr || sec.titleEn || '');
        const body  = en ? (sec.bodyEn  || sec.bodyFr  || '') : (sec.bodyFr  || sec.bodyEn  || '');
        let html = '<div class="page-section">';
        if (title) html += `<h2>${title}</h2>`;
        if (sec.image) html += `<img src="${sec.image}" alt="" style="max-width:100%;margin-bottom:1rem;display:block;">`;
        if (body) {
            const paras = body.split(/\n\n+/).map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
            html += paras;
        }
        if (sec.showContact) {
            html += `<p><a href="mailto:${email}">${email}</a></p>
                <div class="social-links">
                    <a href="${s.instagram}" target="_blank" class="social-icon" title="Instagram">${SVG.instagram}</a>
                    <a href="${s.facebook}"  target="_blank" class="social-icon" title="Facebook">${SVG.facebook}</a>
                    <a href="${s.linkedin}"  target="_blank" class="social-icon" title="LinkedIn">${SVG.linkedin}</a>
                </div>`;
        }
        html += '</div>';
        return html;
    }).join('');
    return `<div class="page-text">${sections}</div>`;
}
function buildInfosPage(lang) { return buildPage('infos', lang); }

function buildContactPage(lang) {
    const t  = T[lang];
    const en = lang === 'en';
    return `
        <div class="page-text">
            <div class="page-section">
                <h2>${t.form_title}</h2>
                <form class="contact-form" onsubmit="portfolio.submitContact(event)">
                    <div class="form-group">
                        <label class="form-label">${t.form_label}</label>
                        <select id="contactType" class="form-select">
                            <option value="${en ? 'Portrait session' : 'S\u00E9ance portrait'}">Portrait</option>
                            <option value="${en ? 'Conversation session' : 'S\u00E9ance conversation'}">Conversation</option>
                            <option value="${en ? 'Immersion session' : 'S\u00E9ance immersion'}">Immersion</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <textarea id="contactMessage" class="form-textarea" placeholder="${t.form_placeholder}" rows="4"></textarea>
                    </div>
                    <button type="submit" class="form-submit">${t.form_send}</button>
                </form>
            </div>
        </div>`;
}

/* ─── PORTFOLIO CLASS ────────────────────────────────── */
class Portfolio {
    constructor() {
        this.currentLang      = 'en';
        this.galleries        = this.buildGalleries();
        this.currentGallery   = null;
        this.currentGalleryId = null;
        this.currentPageId    = null;
        this.currentIndex     = 0;
        this.slideshowTimer   = null;
        this.autoplaying      = true;
        this.SLIDESHOW_MS     = 3000;
        this.currentAudio     = null;
        this.gridMode         = false;
        this.init();
    }

    buildGalleries() {
        const galleries = {};
        for (const [id, config] of Object.entries(GALLERIES_CONFIG)) {
            const items = [];
            if (config.featured) {
                config.featured.forEach(f => items.push({ type: 'featured', ...f }));
            }

            /* Legacy description carton (front) */
            if (config.description) {
                items.push({ type: 'description', configId: id });
            }

            const imgs = (typeof GALLERY_IMAGES !== 'undefined' && GALLERY_IMAGES[id])
                ? GALLERY_IMAGES[id]
                : (config.images || []);

            /* Cartons sorted by position for interleaving */
            const cartons = (config.cartons || []).slice().sort((a,b) => a.position - b.position);
            let ci = 0;

            /* Insert cartons at position 0 (before all images) */
            while (ci < cartons.length && cartons[ci].position === 0) {
                items.push({ type: 'carton', ...cartons[ci] });
                ci++;
            }

            imgs.forEach((img, imgIdx) => {
                const type    = img.link_gallery ? 'accueil-image' : 'image';
                const caption = img.caption || (config.captions?.[img.filename]) || null;
                const button  = img.button  || (config.buttons?.[img.filename])  || null;
                items.push({ type, src: `${config.path}/${img.filename}`, caption, button, ...img });

                /* Insert cartons positioned after this image (position = imgIdx+1) */
                while (ci < cartons.length && cartons[ci].position === imgIdx + 1) {
                    items.push({ type: 'carton', ...cartons[ci] });
                    ci++;
                }
            });

            /* Any remaining cartons past the last image */
            while (ci < cartons.length) {
                items.push({ type: 'carton', ...cartons[ci] });
                ci++;
            }

            /* Legacy CTA carton (back) */
            if (config.cta) {
                items.push({ type: 'cta', configId: id });
            }

            galleries[id] = { ...config, items, configId: id };
        }
        return galleries;
    }

    t(obj) {
        if (!obj) return '';
        if (typeof obj === 'string') return obj;
        return obj[this.currentLang] || obj.en || obj.fr || '';
    }

    init() {
        this.currentLang = SITE_CONFIG.defaultLang || 'en';
        const landingImg = document.querySelector('.landing-image img');
        if (landingImg && SITE_CONFIG.landingImage) landingImg.src = SITE_CONFIG.landingImage;
        if (SITE_CONFIG.showLanding === false) {
            document.getElementById('landing')?.classList.add('hidden');
            document.getElementById('site')?.classList.add('active');
        }
        this.buildMenu();
        this.bindEvents();
        this.initCursor();
        this.applyLangUI(this.currentLang);
        if (SITE_CONFIG.showLanding === false) this.openHomeGallery();
    }

    buildMenu() {
        const nav = document.getElementById('mainNav');
        if (!nav) return;
        /* Hidden groups — used to suppress orphan children */
        const hiddenGroups = new Set(MENU_CONFIG.filter(i => i.type === 'group' && i.hidden).map(i => i.id));
        const visible = MENU_CONFIG.filter(i => !i.hidden && !(i.parent && hiddenGroups.has(i.parent)));

        /* Build children map so ordering in config doesn't matter */
        const childrenOf = {};
        visible.filter(i => i.parent).forEach(i => {
            if (!childrenOf[i.parent]) childrenOf[i.parent] = [];
            childrenOf[i.parent].push(i);
        });

        const itemHtml = (item, isSub) => {
            const cls = isSub ? 'nav-item nav-sub-item' : 'nav-item';
            if (item.type === 'gallery')  return `<div class="${cls}"><a href="#" class="nav-link" data-gallery="${item.galleryId}">${item.name}</a></div>`;
            if (item.type === 'page')     return `<div class="${cls}"><a href="#" class="nav-link" data-page="${item.pageId}">${item.name}</a></div>`;
            if (item.type === 'external') return `<div class="${cls}"><a href="${item.url}" class="nav-link" target="_blank">${item.name}</a></div>`;
            return '';
        };

        let html = '';
        for (const item of visible) {
            if (item.parent) continue; /* children rendered inside their group */
            if (item.type === 'group') {
                const children = childrenOf[item.id] || [];
                html += `<div class="nav-group">`;
                html += `<div class="nav-group-header">${item.name}</div>`;
                if (children.length > 0) {
                    html += `<div class="nav-group-children">`;
                    children.forEach(c => { html += itemHtml(c, true); });
                    html += `</div>`;
                }
                html += `</div>`;
            } else {
                html += itemHtml(item, false);
            }
        }
        nav.innerHTML = html;
        /* Re-bind nav click events after rebuild */
        this.bindNavEvents();
    }

    bindEvents() {
        document.getElementById('enterBtn')?.addEventListener('click', () => this.enterSite());
        document.getElementById('homeLink')?.addEventListener('click', e => {
            e.preventDefault();
            this.openHomeGallery();
            this.setActiveLink(null);
            this.closeMenu();
        });
        document.getElementById('menuToggle')?.addEventListener('click', () => this.toggleMenu());
        document.getElementById('prevBtn')?.addEventListener('click',  e => { e.preventDefault(); this.prev(); });
        document.getElementById('nextBtn')?.addEventListener('click',  e => { e.preventDefault(); this.next(); });
        document.getElementById('autoplayToggle')?.addEventListener('click', () => this.toggleAutoplay());
        document.getElementById('gridToggle')?.addEventListener('click', () => this.toggleGridMode());
        document.querySelectorAll('[data-lang]').forEach(el => {
            el.addEventListener('click', e => { e.preventDefault(); this.setLang(el.dataset.lang); });
        });
        this.bindNavEvents();
        document.getElementById('galleryContainer')?.addEventListener('click', e => {
            if (e.target.closest('a,button,select,textarea,form')) return;
            const rect = e.currentTarget.getBoundingClientRect();
            (e.clientX - rect.left) < rect.width / 2 ? this.prev() : this.next();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft')  this.prev();
            if (e.key === 'ArrowRight') this.next();
        });
        /* Touch swipe for mobile */
        const gcEl = document.getElementById('galleryContainer');
        if (gcEl) {
            let _tx = 0;
            gcEl.addEventListener('touchstart', e => { _tx = e.touches[0].clientX; }, { passive: true });
            gcEl.addEventListener('touchend', e => {
                const dx = e.changedTouches[0].clientX - _tx;
                if (Math.abs(dx) > 40) { dx < 0 ? this.next() : this.prev(); }
            }, { passive: true });
        }
    }

    setLang(lang) {
        if (!T[lang]) return;
        this.currentLang = lang;
        document.documentElement.lang = lang;
        this.applyLangUI(lang);
        if (this.currentGalleryId) {
            const idx = this.currentIndex;
            this.openGallery(this.currentGalleryId);
            this.currentIndex = Math.min(idx, this.currentGallery.items.length - 1);
            this.showItem(this.currentIndex);
        } else if (this.currentPageId) {
            this.showPage(this.currentPageId);
        }
    }

    applyLangUI(lang) {
        const t = T[lang];
        document.querySelectorAll('[data-lang]').forEach(el => {
            el.classList.toggle('active', el.dataset.lang === lang);
        });
        const ids = { prevBtn: t.prev, nextBtn: t.next, enterBtn: t.enter };
        for (const [id, text] of Object.entries(ids)) {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
        }
        const autoBtn = document.getElementById('autoplayToggle');
        if (autoBtn) autoBtn.textContent = t.autoplay_btn;
        const subtitle = document.querySelector('.brand-subtitle');
        if (subtitle) subtitle.textContent = t.subtitle;
    }

    bindNavEvents() {
        document.querySelectorAll('[data-gallery]').forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                this.openGallery(link.dataset.gallery);
                this.setActiveLink(link);
                this.closeMenu();
            });
        });
        document.querySelectorAll('[data-page]').forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                this.showPage(link.dataset.page);
                this.setActiveLink(link);
                this.closeMenu();
            });
        });
    }

    toggleMenu() {
        document.getElementById('menuToggle')?.classList.toggle('open');
        document.getElementById('mobileMenuBtn')?.classList.toggle('open');
        document.getElementById('mainNav')?.classList.toggle('open');
    }
    closeMenu() {
        document.getElementById('menuToggle')?.classList.remove('open');
        document.getElementById('mobileMenuBtn')?.classList.remove('open');
        document.getElementById('mainNav')?.classList.remove('open');
    }
    setActiveLink(el) {
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.querySelectorAll('.nav-group').forEach(g => g.classList.remove('has-active-child'));
        if (el) {
            el.classList.add('active');
            const group = el.closest('.nav-group');
            if (group) group.classList.add('has-active-child');
        }
    }

    enterSite() {
        document.getElementById('landing')?.classList.add('hidden');
        document.getElementById('site')?.classList.add('active');
        this.openHomeGallery();
    }

    openHomeGallery() {
        this.openGallery('portrait');
    }

    toggleAutoplay() {
        this.autoplaying = !this.autoplaying;
        document.getElementById('autoplayToggle')?.classList.toggle('active', this.autoplaying);
        if (this.autoplaying && this.currentGallery?.autoplay) {
            this.startSlideshow();
        } else {
            this.stopSlideshow();
        }
    }

    openGallery(id) {
        const g = this.galleries[id];
        if (!g?.items?.length) return;
        this.currentGallery   = g;
        this.currentGalleryId = id;
        this.currentPageId    = null;
        this.currentIndex     = 0;
        this.stopSlideshow();
        this.stopAudio();
        this.gridMode = false;
        document.getElementById('galleryContainer')?.classList.remove('page-mode', 'grid-mode');
        document.getElementById('gridToggle')?.classList.remove('active');
        document.getElementById('site')?.classList.remove('grid-active');
        this.showItem(0);
        if (g.autoplay && this.autoplaying) this.startSlideshow();
    }

    openGalleryFromAccueil(galleryId) {
        this.openGallery(galleryId);
        const navLink = document.querySelector(`[data-gallery="${galleryId}"]`);
        this.setActiveLink(navLink || null);
    }

    showImageInfo(caption, button) {
        /* Use #footerCaption (new layout) or fall back to #galleryDesc (old layout) */
        const el = document.getElementById('footerCaption') || document.getElementById('galleryDesc');
        if (!el) return;
        let html = '';
        if (caption) {
            const text = typeof caption === 'string'
                ? caption
                : (caption[this.currentLang] || caption.en || caption.fr || '');
            if (text) {
                const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
                const name  = lines[0] || '';
                const desc  = lines.slice(1).join('\n');
                html += `<div class="gallery-caption-block">`;
                if (name) html += `<p class="gallery-caption-name">${name}</p>`;
                if (desc) html += `<p class="gallery-caption-desc">${desc.replace(/\n/g, '<br>')}</p>`;
                html += `</div>`;
            }
        }
        if (button?.url) {
            const label = button.label || 'En savoir plus';
            html += `<a href="${button.url}" target="_blank" class="gallery-desc-btn">${label} \u2192</a>`;
        }
        el.innerHTML = html;
    }

    showCaption(caption) { this.showImageInfo(caption, null); }

    showItem(index) {
        if (!this.currentGallery) return;
        const items = this.currentGallery.items;
        if (index < 0 || index >= items.length) return;

        this.currentIndex = index;
        const item        = items[index];
        const container   = document.getElementById('galleryContainer');
        const galleryDesc = document.getElementById('galleryDesc');
        const footerCap   = document.getElementById('footerCaption');
        const lang        = this.currentLang;

        // Always clear footer caption first (showImageInfo fills it for image types)
        if (footerCap) footerCap.innerHTML = '';

        if (item.type !== 'image' && item.type !== 'accueil-image') {
            this.stopSlideshow();
            this.stopAudio();
        }

        if (item.type === 'featured') {
            const text      = this.t(item.text);
            const seeMore   = T[lang].see_more;
            const galleryId = item.link_gallery;
            const eyebrow   = galleryId === 'cinema' ? (lang === 'fr' ? 'Cin\u00E9ma' : 'Cinema') : '';
            if (galleryDesc) {
                galleryDesc.innerHTML = `<div class="gallery-desc-content">
                    <div class="sidebar-featured">
                        ${eyebrow ? `<p class="sidebar-featured-eyebrow">${eyebrow}</p>` : ''}
                        <h2 class="sidebar-featured-title">${item.title}</h2>
                        <p class="sidebar-featured-text">${text}</p>
                        ${galleryId ? `<button class="sidebar-featured-btn" onclick="portfolio.openGalleryFromAccueil('${galleryId}')">${seeMore} \u2192</button>` : ''}
                    </div></div>`;
            }
            const accueilG = this.galleries['accueil'];
            const matchImg = accueilG?.items.find(i => i.type === 'accueil-image' && i.link_gallery === galleryId);
            if (matchImg) {
                const img = new Image();
                img.className = 'gallery-image';
                img.alt = matchImg.label || '';
                img.onload = () => {
                    container.innerHTML = '';
                    const wrapper = document.createElement('div');
                    wrapper.className = 'image-wrapper';
                    wrapper.appendChild(img);
                    container.appendChild(wrapper);
                    requestAnimationFrame(() => img.classList.add('loaded'));
                };
                img.onerror = () => { container.innerHTML = '<div class="img-missing-placeholder">🖼</div>'; };
                container.innerHTML = '';
                img.src = encodeURI(matchImg.src);
            } else {
                container.innerHTML = '<div class="featured-blank loaded"></div>';
            }

        } else if (item.type === 'description') {
            if (galleryDesc) galleryDesc.innerHTML = '';
            const text = this.t(GALLERIES_CONFIG[item.configId].description);
            container.innerHTML = `
                <div class="description-slide loaded">
                    <div class="description-content">
                        <p class="description-text">${text.replace(/\n/g, '<br>')}</p>
                    </div>
                </div>`;

        } else if (item.type === 'cta') {
            if (galleryDesc) galleryDesc.innerHTML = '';
            const text    = this.t(GALLERIES_CONFIG[item.configId].cta);
            const btnText = T[lang].contact_btn;
            container.innerHTML = `
                <div class="cta-slide loaded">
                    <div class="cta-content">
                        <p class="cta-text">${text}</p>
                        <button class="cta-btn" onclick="portfolio.showContactPage()">
                            ${btnText}
                        </button>
                    </div>
                </div>`;

        } else if (item.type === 'carton') {
            const en         = lang === 'en';
            const title      = en ? (item.titleEn    || item.titleFr    || '') : (item.titleFr    || item.titleEn    || '');
            const subtitle   = en ? (item.subtitleEn || item.subtitleFr || '') : (item.subtitleFr || item.subtitleEn || '');
            const category   = en ? (item.categoryEn || item.categoryFr || '') : (item.categoryFr || item.categoryEn || '');
            const sidebarTxt = en ? (item.sidebarEn  || item.sidebarFr  || '') : (item.sidebarFr  || item.sidebarEn  || '');
            const desc       = en ? (item.descEn     || item.descFr     || '') : (item.descFr     || item.descEn     || '');
            const ctaUrl     = item.ctaUrl   || '';
            const ctaLbl     = item.ctaLabel || (en ? 'See more' : 'En savoir plus');

            /* ── SIDEBAR: sous-titre + titre + texte — bouton dans footerCaption ── */
            if (galleryDesc) {
                let h = '';
                if (category)   h += `<p class="sidebar-item-subtitle">${category}</p>`;
                if (title)      h += `<h2 class="sidebar-item-title">${title}</h2>`;
                if (sidebarTxt) h += `<p class="sidebar-main-desc">${sidebarTxt.replace(/\n/g,'<br>')}</p>`;
                galleryDesc.innerHTML = h ? `<div class="gallery-desc-content">${h}</div>` : '';
            }
            if (footerCap) {
                footerCap.innerHTML = ctaUrl
                    ? `<a class="accueil-sidebar-link" href="${ctaUrl}" target="_blank" rel="noopener">${ctaLbl} \u2192</a>`
                    : '';
            }

            /* ── CARTON CENTRAL: titre + sous-titre + texte + bouton ── */
            const ctaBtn = ctaUrl
                ? `<a href="${ctaUrl}" target="_blank" rel="noopener" class="carton-cta-btn">${ctaLbl} \u2192</a>`
                : '';
            container.innerHTML = `
                <div class="carton-slide loaded">
                    <div class="carton-slide-inner">
                        ${title    ? `<h2 class="carton-slide-title">${title}</h2>` : ''}
                        ${subtitle ? `<p class="carton-slide-subtitle">${subtitle}</p>` : ''}
                        ${desc     ? `<p class="carton-slide-desc">${desc.replace(/\n/g,'<br>')}</p>` : ''}
                        ${ctaBtn}
                    </div>
                </div>`;

        } else if (item.type === 'accueil-image') {
            const linkGallery = item.link_gallery;
            /* ── SIDEBAR: empty galleryDesc; Portrait → link in footerCaption ── */
            if (galleryDesc) galleryDesc.innerHTML = '';
            if (footerCap) {
                if (linkGallery && item.label) {
                    footerCap.innerHTML = `<a class="accueil-sidebar-link" href="#"
                        onclick="portfolio.openGalleryFromAccueil('${linkGallery}');return false;">
                        ${item.label} \u2192</a>`;
                } else {
                    footerCap.innerHTML = '';
                }
            }
            const img = new Image();
            img.className = 'gallery-image';
            img.alt = item.label || '';
            img.onload = () => {
                container.innerHTML = '';
                const wrapper = document.createElement('div');
                wrapper.className = 'image-wrapper';
                wrapper.appendChild(img);
                container.appendChild(wrapper);
                requestAnimationFrame(() => img.classList.add('loaded'));
            };
            img.onerror = () => { container.innerHTML = '<div class="img-missing-placeholder">🖼</div>'; };
            container.innerHTML = '';
            img.src = encodeURI(item.src);

        } else {
            /* Sidebar galleryDesc:
             * — si title présent : subtitle + title (ex: GEM "Jean-François / SERIE GEM")
             * — si pas de title : caption format Davodeau (nom + métier en bas via margin-top:auto)
             */
            if (galleryDesc) {
                const t = item.title || '';
                const s = item.subtitle || '';
                const d = !t && item.caption
                    ? (typeof item.caption==='string' ? item.caption : (item.caption[lang]||item.caption.fr||item.caption.en||''))
                    : '';
                let h = '';
                if (t) {
                    /* Image nommée (ex: GEM) — subtitle + title */
                    if (s) h += `<p class="sidebar-item-subtitle">${s}</p>`;
                    h += `<h2 class="sidebar-item-title">${t}</h2>`;
                } else if (d) {
                    /* Image avec légende seulement (ex: Portrait Davodeau) */
                    const lines = d.split('\n').map(l => l.trim()).filter(Boolean);
                    const name = lines[0] || '';
                    const rest = lines.slice(1).join('\n');
                    h += `<div class="gallery-caption-block">`;
                    if (name) h += `<p class="gallery-caption-name">${name}</p>`;
                    if (rest)  h += `<p class="gallery-caption-desc">${rest.replace(/\n/g,'<br>')}</p>`;
                    h += `</div>`;
                }
                /* gallery-desc-content : margin-top:auto ancre l'info en bas */
                galleryDesc.innerHTML = h ? `<div class="gallery-desc-content">${h}</div>` : '';
            }
            /* footerCaption: bouton uniquement — pas de caption (déjà dans galleryDesc) */
            if (footerCap) {
                if (item.button?.url) {
                    const lbl = item.button.label || (lang === 'en' ? 'See more' : 'En savoir plus');
                    footerCap.innerHTML = `<a class="accueil-sidebar-link" href="${item.button.url}" target="_blank" rel="noopener">${lbl} \u2192</a>`;
                } else {
                    footerCap.innerHTML = '';
                }
            }
            /* audioAutoplay per-image: true=force on, false=force off, undefined=use gallery setting */
            const shouldAutoplayAudio = item.audio && (
                item.audioAutoplay === true ||
                (item.audioAutoplay !== false && this.currentGallery?.autoplayAudio)
            );
            /* Always show audio player if image has audio; autostart depends on settings */
            if (item.audio) {
                const audioSrc = item.audio.startsWith('images/')
                    ? item.audio
                    : `${this.currentGallery.path}/${item.audio}`;
                this.playAudio(audioSrc, shouldAutoplayAudio);
            } else {
                this.stopAudio();
            }
            const img = new Image();
            img.className = 'gallery-image';
            img.alt = '';
            img.onload = () => {
                container.innerHTML = '';
                const wrapper = document.createElement('div');
                wrapper.className = 'image-wrapper';
                wrapper.appendChild(img);
                container.appendChild(wrapper);
                requestAnimationFrame(() => img.classList.add('loaded'));
            };
            img.onerror = () => { container.innerHTML = '<div class="img-missing-placeholder">🖼</div>'; };
            container.innerHTML = '';
            img.src = encodeURI(item.src);
        }

        /* Mobile breadcrumb : GALLERY / ROLE / NOM — au-dessus du liseret */
        const mobileBreadcrumb = document.getElementById('mobileBreadcrumb');
        if (mobileBreadcrumb) {
            let breadcrumb = '';
            if (item.type === 'image') {
                const menuItem = MENU_CONFIG.find(i => i.galleryId === this.currentGalleryId && !i.hidden && i.type !== 'group');
                const galleryName = (menuItem?.name || this.currentGalleryId).toUpperCase();
                const parts = [galleryName];
                if (item.title) {
                    parts.push(item.title.toUpperCase());
                } else if (item.caption) {
                    const cap = typeof item.caption === 'string' ? item.caption : (item.caption[lang] || item.caption.fr || item.caption.en || '');
                    const lines = cap.split('\n').map(l => l.trim()).filter(Boolean);
                    if (lines.length >= 2) {
                        parts.push(lines[1].toUpperCase());
                        parts.push(lines[0].toUpperCase());
                    } else if (lines.length === 1) {
                        parts.push(lines[0].toUpperCase());
                    }
                }
                breadcrumb = parts.join(' / ');
            }
            mobileBreadcrumb.textContent = breadcrumb;
        }

        const counter = document.querySelector('.gallery-counter');
        if (counter) counter.textContent = `${index + 1} / ${items.length}`;
        const footerNav = document.querySelector('.gallery-footer-nav');
        if (footerNav) footerNav.style.visibility = items.length <= 1 ? 'hidden' : '';
    }

    prev() {
        if (!this.currentGallery) return;
        const items    = this.currentGallery.items;
        const newIndex = this.currentIndex > 0 ? this.currentIndex - 1 : items.length - 1;
        this.stopSlideshow();
        this.showItem(newIndex);
        const isImage = items[newIndex].type === 'image' || items[newIndex].type === 'accueil-image';
        if (isImage && this.currentGallery.autoplay && this.autoplaying) this.startSlideshow();
    }

    next() {
        if (!this.currentGallery) return;
        const items    = this.currentGallery.items;
        const newIndex = this.currentIndex < items.length - 1 ? this.currentIndex + 1 : 0;
        this.stopSlideshow();
        this.showItem(newIndex);
        const isImage = items[newIndex].type === 'image' || items[newIndex].type === 'accueil-image';
        if (isImage && this.currentGallery.autoplay && this.autoplaying) this.startSlideshow();
    }

    startSlideshow() {
        this.stopSlideshow();
        const ms = ((this.currentGallery?.autoplayDelay) || 4) * 1000;
        this.slideshowTimer = setInterval(() => {
            if (!this.currentGallery) return;
            const items = this.currentGallery.items;
            const next  = this.currentIndex < items.length - 1 ? this.currentIndex + 1 : 0;
            this.showItem(next);
        }, ms);
    }

    stopSlideshow() {
        if (this.slideshowTimer) { clearInterval(this.slideshowTimer); this.slideshowTimer = null; }
    }

    /* ── GRID MODE ─────────────────────────────────────── */
    toggleGridMode() {
        this.gridMode = !this.gridMode;
        const container = document.getElementById('galleryContainer');
        const btn  = document.getElementById('gridToggle');
        const site = document.getElementById('site');
        if (this.gridMode) {
            container?.classList.add('grid-mode');
            btn?.classList.add('active');
            site?.classList.add('grid-active');
            this.stopAudio();
            this.renderGrid();
        } else {
            container?.classList.remove('grid-mode');
            btn?.classList.remove('active');
            site?.classList.remove('grid-active');
            this.showItem(this.currentIndex);
        }
    }

    renderGrid() {
        if (!this.currentGallery) return;
        const container = document.getElementById('galleryContainer');
        if (!container) return;
        const allItems = this.currentGallery.items;
        const thumbs = allItems
            .map((item, globalIdx) => ({ item, globalIdx }))
            .filter(({ item }) => item.type === 'image' || item.type === 'accueil-image');
        container.innerHTML = thumbs.map(({ item, globalIdx }) =>
            `<div class="grid-thumb" onclick="portfolio.selectFromGrid(${globalIdx})">
                <img src="${encodeURI(item.src)}" alt="" loading="lazy">
            </div>`).join('');
    }

    selectFromGrid(index) {
        this.gridMode = false;
        document.getElementById('galleryContainer')?.classList.remove('grid-mode');
        document.getElementById('gridToggle')?.classList.remove('active');
        document.getElementById('site')?.classList.remove('grid-active');
        this.showItem(index);
    }

    /* ── AUDIO PLAYER ──────────────────────────────────── */
    stopAudio() {
        if (this.currentAudio) {
            this.currentAudio.pause();
            this.currentAudio.src = '';
            this.currentAudio = null;
        }
        const zone = document.getElementById('audioPlayerZone');
        if (zone) zone.innerHTML = '';
    }

    playAudio(src, autostart = false) {
        this.stopAudio();
        const audio = new Audio(src);
        this.currentAudio = audio;
        const zone = document.getElementById('audioPlayerZone');
        if (!zone) return;
        const playerDiv = document.createElement('div');
        playerDiv.id = 'audioPlayer';
        playerDiv.className = 'audio-player';
        playerDiv.innerHTML = `
            <button class="audio-play-btn" id="audioPlayBtn" onclick="portfolio.toggleAudio()">&#9654;</button>
            <div class="audio-progress-track" id="audioTrack" onclick="portfolio.seekAudio(event)">
                <div class="audio-progress-fill" id="audioFill"></div>
            </div>
            <span class="audio-time" id="audioTime">0:00</span>`;
        zone.appendChild(playerDiv);
        audio.addEventListener('timeupdate', () => {
            const fill = document.getElementById('audioFill');
            const time = document.getElementById('audioTime');
            if (fill && audio.duration) fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
            if (time) time.textContent = this.fmtTime(audio.currentTime);
        });
        audio.addEventListener('play',  () => { const b = document.getElementById('audioPlayBtn'); if (b) b.innerHTML = '&#9646;&#9646;'; });
        audio.addEventListener('pause', () => { const b = document.getElementById('audioPlayBtn'); if (b) b.innerHTML = '&#9654;'; });
        audio.addEventListener('ended', () => { const b = document.getElementById('audioPlayBtn'); if (b) b.innerHTML = '&#9654;'; });
        if (autostart) audio.play().catch(() => {});
    }

    toggleAudio() {
        if (!this.currentAudio) return;
        if (this.currentAudio.paused) this.currentAudio.play().catch(() => {});
        else this.currentAudio.pause();
    }

    seekAudio(e) {
        if (!this.currentAudio || !this.currentAudio.duration) return;
        const track = document.getElementById('audioTrack');
        if (!track) return;
        const rect = track.getBoundingClientRect();
        this.currentAudio.currentTime = ((e.clientX - rect.left) / rect.width) * this.currentAudio.duration;
    }

    fmtTime(s) {
        return `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}`;
    }

    showPage(id) {
        this.currentGallery   = null;
        this.currentGalleryId = null;
        this.currentPageId    = id;
        this.stopSlideshow();
        const container = document.getElementById('galleryContainer');
        container.classList.add('page-mode');
        let html = '';
        if (id === 'infos')   html = buildInfosPage(this.currentLang);
        if (id === 'contact') html = buildContactPage(this.currentLang);
        container.innerHTML = `<div class="page-content">${html}</div>`;
        const counter = document.querySelector('.gallery-counter');
        if (counter) counter.textContent = '';
        const descEl = document.getElementById('galleryDesc');
        if (descEl) descEl.innerHTML = '';
        const footerCap = document.getElementById('footerCaption');
        if (footerCap) footerCap.innerHTML = '';
        this.stopAudio();
    }

    showContactPage() {
        this.showPage('contact');
        this.setActiveLink(null);
    }

    submitContact(e) {
        if (e) e.preventDefault();
        const type    = document.getElementById('contactType')?.value   || 'Portrait';
        const message = document.getElementById('contactMessage')?.value || '';
        const t       = T[this.currentLang];
        window.location.href = `mailto:bertrand.basset@gmail.com?subject=${encodeURIComponent(`${t.mailto_prefix} \u2014 ${type}`)}&body=${encodeURIComponent(message)}`;
    }

    initCursor() {
        const cursor    = document.getElementById('customCursor');
        const container = document.getElementById('galleryContainer');
        if (!cursor || !container) return;
        container.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top  = e.clientY + 'px';
            cursor.classList.add('visible');
            const rect = container.getBoundingClientRect();
            cursor.classList.toggle('left', e.clientX - rect.left < rect.width / 2);
        });
        container.addEventListener('mouseleave', () => cursor.classList.remove('visible'));
    }
}

document.addEventListener('DOMContentLoaded', () => window.portfolio = new Portfolio());
</script>

let state;
function loadState() {
    try {
        const saved = localStorage.getItem('bertrandAdminV4');
        if (saved) {
            const parsed = JSON.parse(saved);
            const def    = JSON.parse(JSON.stringify(DEFAULT_STATE));
            /* Deep merge: saved wins for existing keys, DEFAULT fills missing keys */
            state = {
                ...def,
                ...parsed,
                settings:        { ...def.settings,       ...(parsed.settings||{}) },
                galleriesConfig: { ...def.galleriesConfig, ...(parsed.galleriesConfig||{}) },
                menuConfig:      parsed.menuConfig         || def.menuConfig,
                pagesConfig:     { ...def.pagesConfig,     ...(parsed.pagesConfig||{}) }
            };

            /* ── MIGRATION: convert legacy desc/cta fields → cartons ── */
            Object.keys(state.galleriesConfig).forEach(id => {
                const g = state.galleriesConfig[id];
                if (!g.cartons) g.cartons = [];
                /* Old descFr/descEn → carton at position 0 */
                if ((g.descFr || g.descEn) && !g.cartons.find(c =>
                        c._migratedDesc ||
                        (c.descFr === (g.descFr||'') && c.descEn === (g.descEn||'') && c.position === 0))) {
                    g.cartons.unshift({
                        cid: genCid(), position: 0,
                        titleFr: '', titleEn: '',
                        descFr: g.descFr || '', descEn: g.descEn || '',
                        credits: '', ctaLabel: '', ctaUrl: '',
                        _migratedDesc: true
                    });
                }
                /* Always clean up legacy fields — even if carton already existed */
                delete g.descFr; delete g.descEn;
                /* Old ctaFr/ctaEn → carton at position = images.length (end) */
                if ((g.ctaFr || g.ctaEn) && !g.cartons.find(c =>
                        c._migratedCta ||
                        (c.descFr === (g.ctaFr||'') && c.descEn === (g.ctaEn||'')))) {
                    const pos = (g.images || []).length;
                    g.cartons.push({
                        cid: genCid(), position: pos,
                        titleFr: '', titleEn: '',
                        descFr: g.ctaFr || '', descEn: g.ctaEn || '',
                        credits: '', ctaLabel: '', ctaUrl: '',
                        _migratedCta: true
                    });
                }
                /* Always clean up legacy fields — even if carton already existed */
                delete g.ctaFr; delete g.ctaEn;
            });

            /* ── Patch broken menu items ── */
            state.menuConfig = state.menuConfig.map(item => {
                /* Fix: immersion must always be type:gallery pointing to 'studio' */
                if (item.id === 'immersion') {
                    return { ...item, type: 'gallery', galleryId: 'studio' };
                }
                return item;
            });

            /* ── Patch portrait: ensure all images are present ── */
            {
                const pCfg = state.galleriesConfig.portrait;
                const defP = JSON.parse(JSON.stringify(DEFAULT_STATE)).galleriesConfig.portrait;
                if (pCfg && defP) {
                    const existing = new Set((pCfg.images||[]).map(i => i.filename));
                    defP.images.forEach(img => {
                        if (!existing.has(img.filename)) pCfg.images.push(img);
                    });
                }
            }

            /* ── Patch dustin-kolor: inject if missing ── */
            if (!state.galleriesConfig['dustin-kolor']) {
                state.galleriesConfig['dustin-kolor'] = JSON.parse(JSON.stringify(DEFAULT_STATE)).galleriesConfig['dustin-kolor'];
            }

            /* ── Patch accueil: ensure Immersion image is present ── */
            const accueilImgs = state.galleriesConfig.accueil?.images || [];
            const hasImmersion = accueilImgs.some(img => img.link_gallery === 'studio');
            if (!hasImmersion) {
                const accueil = state.galleriesConfig.accueil;
                if (accueil) {
                    /* Insert Immersion between Portrait and Cinema */
                    const portrIdx = accueilImgs.findIndex(img => img.link_gallery === 'portrait');
                    const newImg = { filename: 'Atelier_Plougasnou.jpg', label: 'Immersion', link_gallery: 'studio', captionEn: '', captionFr: '' };
                    if (portrIdx >= 0) accueilImgs.splice(portrIdx + 1, 0, newImg);
                    else accueilImgs.push(newImg);
                    accueil.images = accueilImgs;
                }
            }

            /* Restore custom GALLERY_META entries */
            const builtIn = ['portrait','conversation-s-','studio','cinema','television','accueil','dustin-kolor'];
            Object.keys(state.galleriesConfig).forEach(id => {
                if (!builtIn.includes(id) && !GALLERY_META[id]) {
                    const g = state.galleriesConfig[id];
                    GALLERY_META[id] = {
                        icon: '\uD83D\uDDBC', label: g.title || id,
                        autoScan: !!(g.autoScan), custom: true
                    };
                }
            });
        } else {
            state = JSON.parse(JSON.stringify(DEFAULT_STATE));
        }
    } catch(e) {
        state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
}

let _autoPushTimer = null;
function markDirty() {
    const btn = document.getElementById('publishBtn');

    if (btn) btn.classList.remove('dirty');
