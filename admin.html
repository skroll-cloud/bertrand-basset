<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Bertrand Basset</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0a0a0a;
  --white: #fafafa;
  --gray:  #666;
  --dim:   #999;
  --light: #e0e0e0;
  --red:   #c41e1e;
  --green: #27ae60;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 300; font-size: 13px;
  color: var(--black); background: var(--white);
  -webkit-font-smoothing: antialiased;
}

/* ── Auth ─────────────────────────────────── */
.auth-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; }
.auth-box  { display:flex; flex-direction:column; align-items:center; gap:16px; width:260px; }
.auth-logo { font-size:28px; font-weight:400; letter-spacing:.08em; }
.auth-label { font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--gray); }
.auth-input {
  width:100%; padding:8px 12px; border:1px solid var(--light);
  font-family:inherit; font-size:13px; font-weight:300;
  background:transparent; color:var(--black); outline:none;
}
.auth-input:focus { border-color:var(--black); }
.auth-btn {
  width:100%; padding:8px; border:1px solid var(--black); background:transparent;
  font-family:inherit; font-size:9px; font-weight:400;
  letter-spacing:.15em; text-transform:uppercase; color:var(--black); cursor:pointer;
}
.auth-btn:hover { background:var(--black); color:var(--white); }
.auth-error { font-size:10px; color:var(--red); min-height:14px; text-align:center; }

/* ── Layout ───────────────────────────────── */
.admin-wrap { max-width:760px; margin:0 auto; padding:32px 24px 100px; }

.admin-header {
  display:flex; align-items:center; justify-content:space-between;
  padding-bottom:20px; border-bottom:1px solid var(--light); margin-bottom:28px;
}
.admin-site { font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); }
.status-line { display:flex; align-items:center; gap:7px; font-size:10px; color:var(--dim); }
.status-dot { width:6px; height:6px; border-radius:50%; background:var(--light); transition:background .3s; }
.status-dot.ok      { background:var(--green); }
.status-dot.err     { background:var(--red); }
.status-dot.loading { background:#f0b429; animation:blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── Tabs ─────────────────────────────────── */
.tabs { display:flex; border-bottom:1px solid var(--light); margin-bottom:28px; }
.tab-btn {
  padding:8px 20px; border:none; border-bottom:2px solid transparent;
  background:none; font-family:inherit; font-size:9px; font-weight:400;
  letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
  cursor:pointer; margin-bottom:-1px; transition:color .15s, border-color .15s;
}
.tab-btn:hover { color:var(--black); }
.tab-btn.active { color:var(--black); border-bottom-color:var(--black); }

.tab-hint { font-size:10px; color:var(--dim); margin-bottom:24px; line-height:1.6; }
.tab-hint strong { font-weight:400; color:var(--gray); }

/* ── Tree ─────────────────────────────────── */
.tree { display:flex; flex-direction:column; }

.tree-level0 { border-top:1px solid var(--light); }
.tree-level0:last-of-type { border-bottom:1px solid var(--light); }

/* Row */
.tree-row {
  display:flex; align-items:center; gap:8px;
  padding:9px 0; cursor:default; min-height:42px;
}

/* Indentation */
.tree-level0 > .tree-row     { padding-left:0; }
.tree-level1 > .tree-row     { padding-left:16px; border-top:1px solid #f0f0f0; }
.tree-level2 > .tree-row     { padding-left:32px; border-top:1px solid #f5f5f5; }

/* Drag handle */
.drag-handle {
  cursor:grab; color:var(--dim); font-size:14px; flex-shrink:0;
  width:18px; text-align:center; opacity:0; transition:opacity .15s;
  user-select:none;
}
.tree-row:hover .drag-handle { opacity:1; }
.drag-handle:active { cursor:grabbing; }

/* Expand button */
.expand-btn {
  background:none; border:none; cursor:pointer; padding:0;
  font-size:11px; color:var(--dim); flex-shrink:0; width:14px; text-align:center;
  transition:transform .2s, color .15s; line-height:1; user-select:none;
}
.expand-btn:hover  { color:var(--black); }
.expand-btn.open   { transform:rotate(90deg); }
.expand-ph { width:14px; flex-shrink:0; }

/* Thumbnail */
.tree-thumb { width:42px; height:28px; object-fit:cover; flex-shrink:0; background:#eee; }
.tree-thumb-empty { width:42px; height:28px; background:#f0f0f0; flex-shrink:0; }

/* Name */
.tree-name {
  flex:1; font-size:12px; font-weight:300;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  outline:none;
}
.tree-level0 > .tree-row .tree-name {
  font-size:10px; font-weight:400; letter-spacing:.1em; text-transform:uppercase;
}
.tree-level1 > .tree-row .tree-name { font-size:11px; color:var(--gray); }
.tree-name[contenteditable="true"]:hover {
  text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--dim);
  cursor:text;
}
.tree-name[contenteditable="true"]:focus {
  background:rgba(0,0,0,.04); padding:2px 5px; text-decoration:none; outline:none;
}

/* Type / count badge */
.type-tag {
  font-size:8px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--dim); flex-shrink:0; white-space:nowrap;
}

/* Visibility button */
.vis-btn {
  flex-shrink:0; padding:3px 9px; border:1px solid var(--light);
  background:transparent; font-family:inherit; font-size:8px; font-weight:400;
  letter-spacing:.12em; text-transform:uppercase; color:var(--dim);
  cursor:pointer; white-space:nowrap; transition:border-color .15s, color .15s;
}
.vis-btn:hover      { border-color:var(--black); color:var(--black); }
.vis-btn.hidden     { border-color:var(--red); color:var(--red); }
.vis-btn.saving     { opacity:.4; pointer-events:none; }
.vis-btn.code-only  { opacity:.3; cursor:default; pointer-events:none; border-style:dashed; }

/* Code-hidden items */
.tree-level0.code-hidden { opacity:.4; }
.tree-level0.code-hidden .tree-name { font-style:italic; }

/* Children container */
.tree-children { display:none; }
.tree-children.open { display:block; }

/* Empty note */
.empty-note {
  padding:6px 0 6px 60px; font-size:10px; color:var(--dim);
  border-top:1px solid #f5f5f5; font-style:italic;
}

/* Separator between visible / code-hidden groups */
.tree-sep {
  display:flex; align-items:center; gap:12px;
  padding:20px 0 6px; font-size:9px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--dim);
}
.tree-sep::after { content:''; flex:1; height:1px; background:var(--light); }

/* Sortable states */
.sortable-ghost { opacity:.2; }
.sortable-drag  { background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.1); }

/* Feedback */
.feedback { margin-top:16px; font-size:10px; color:var(--dim); min-height:16px; }
.feedback.ok  { color:var(--green); }
.feedback.err { color:var(--red); }

/* Placeholder tab */
.tab-placeholder {
  text-align:center; padding:80px 0;
  font-size:12px; color:var(--dim); font-style:italic;
}
</style>
</head>
<body>

<!-- ══════════════════════════ AUTH ══════════════════════════ -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">B</div>
    <div class="auth-label">Bertrand Basset · Admin</div>
    <input type="password" id="pwdInput" class="auth-input" placeholder="Mot de passe"
      autofocus onkeydown="if(event.key==='Enter')checkPwd()">
    <button class="auth-btn" onclick="checkPwd()">Entrer</button>
    <div id="authError" class="auth-error"></div>
  </div>
</div>

<!-- ══════════════════════════ ADMIN ══════════════════════════ -->
<div id="adminWrap" class="admin-wrap" style="display:none">

  <header class="admin-header">
    <div class="admin-site">Administration &middot; bertrandbasset.com</div>
    <div class="status-line">
      <div id="statusDot" class="status-dot loading"></div>
      <span id="statusLabel">Chargement&hellip;</span>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('nav',this)">Navigation</button>
    <button class="tab-btn" onclick="switchTab('galleries',this)">Galeries</button>
  </div>

  <!-- ── Tab Navigation ── -->
  <div id="tab-nav">
    <p class="tab-hint">
      <strong>&rsaquo;</strong> pour d&eacute;plier une section &middot;
      <strong>Visible / Masqu&eacute;</strong> pour changer la visibilit&eacute; (sauvegard&eacute; automatiquement) &middot;
      <strong>&#10783;</strong> pour r&eacute;ordonner les cartes &middot; Cliquer un nom de carte pour l&rsquo;&eacute;diter
    </p>
    <div id="navTree" class="tree"></div>
    <div id="navFeedback" class="feedback"></div>
  </div>

  <!-- ── Tab Galeries ── -->
  <div id="tab-galleries" style="display:none">
    <div class="tab-placeholder">Gestion d&eacute;taill&eacute;e des galeries &mdash; prochainement</div>
  </div>

</div>

<!-- SortableJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<!-- Site data -->
<script src="js/gallery-data.js?v=20260608a"></script>

<script>
/* ====================================================
   CONSTANTS
   ==================================================== */
var SUPA_URL = 'https://suecslynruuputmujudg.supabase.co/rest/v1';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1ZWNzbHlucnV1cHV0bXVqdWRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MTYyODcsImV4cCI6MjA5MjA5MjI4N30.c9Pa_x6MEcJdqVekBodSYpu3it-riVU1hYhC-m5iCsU';
var PWD_HASH = 'fd8faf112b549a3c0ace23b2b0c25171195a07494895830426b5cece2ba3796b';

var PREFIX = {
  photographe:    'ph',
  'ph-portrait':  'ph',
  'ph-reportage': 'ph',
  'ph-series':    'ph',
  'ph-exposition':'ph',
  'ph-clients':   'ph',
  realisateur:    'real',
  boutique:       'shop'
};

var DB = { cards: {}, menuVis: {} };

/* ====================================================
   AUTH
   ==================================================== */
async function sha256(s) {
  var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,'0'); }).join('');
}

async function checkPwd() {
  var h = await sha256(document.getElementById('pwdInput').value);
  if (h === PWD_HASH) {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('adminWrap').style.display  = '';
    loadDB();
  } else {
    document.getElementById('authError').textContent = 'Mot de passe incorrect';
  }
}

/* ====================================================
   SUPABASE
   ==================================================== */
function sbHeaders(extra) {
  var h = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' };
  if (extra) Object.assign(h, extra);
  return h;
}

async function sbGet(path) {
  var r = await fetch(SUPA_URL + '/' + path, { headers: sbHeaders() });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function sbUpsert(table, body) {
  var payload = Array.isArray(body) ? body : [body];
  var r = await fetch(SUPA_URL + '/' + table, {
    method: 'POST',
    headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify(payload)
  });
  if (!r.ok) throw new Error(await r.text());
}

/* ====================================================
   LOAD DB
   ==================================================== */
async function loadDB() {
  setStatus('loading', 'Chargement…');
  try {
    var results = await Promise.all([
      sbGet('gallery_cards?select=id,visible,sort_order,title_fr,cover_img&order=sort_order.asc'),
      sbGet('section_visibility?select=id,visible')
    ]);
    results[0].forEach(function(r){ DB.cards[r.id] = r; });
    results[1].forEach(function(r){ DB.menuVis[r.id] = r.visible; });
    setStatus('ok', 'Synchronisé');
  } catch(e) {
    setStatus('err', 'Erreur Supabase');
    console.error(e);
  }
  renderTree();
}

function setStatus(state, label) {
  document.getElementById('statusDot').className = 'status-dot ' + state;
  document.getElementById('statusLabel').textContent = label;
}

/* ====================================================
   TABS
   ==================================================== */
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('tab-nav').style.display       = name === 'nav'       ? '' : 'none';
  document.getElementById('tab-galleries').style.display = name === 'galleries' ? '' : 'none';
}

/* ====================================================
   FEEDBACK
   ==================================================== */
var feedTimer;
function showFeedback(msg, cls) {
  cls = cls || 'ok';
  var el = document.getElementById('navFeedback');
  el.textContent = msg;
  el.className = 'feedback ' + cls;
  clearTimeout(feedTimer);
  feedTimer = setTimeout(function(){ el.textContent = ''; el.className = 'feedback'; }, 3000);
}

/* ====================================================
   VISIBILITY STATE
   ==================================================== */
function menuIsVisible(id) {
  return id in DB.menuVis ? DB.menuVis[id] !== false : true;
}

function cardIsVisible(dbId, card) {
  var row = DB.cards[dbId];
  if (row && row.visible !== null && row.visible !== undefined) return row.visible;
  return !card._hiddenByAdmin;
}

/* ====================================================
   HTML ESCAPE
   ==================================================== */
function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ====================================================
   RENDER TREE
   ==================================================== */
function renderTree() {
  var tree = document.getElementById('navTree');
  tree.innerHTML = '';

  var visible = MENU_CONFIG.filter(function(i){ return !i.parent && !i.hidden; });
  var hidden  = MENU_CONFIG.filter(function(i){ return !i.parent &&  i.hidden; });

  visible.forEach(function(item){ tree.appendChild(buildMenuEl(item, false)); });

  if (hidden.length) {
    var sep = document.createElement('div');
    sep.className = 'tree-sep';
    sep.textContent = 'Masqués dans le code';
    tree.appendChild(sep);
    hidden.forEach(function(item){ tree.appendChild(buildMenuEl(item, true)); });
  }
}

/* ── Level 0 : top-level menu item ── */
function buildMenuEl(item, codeLocked) {
  var el = document.createElement('div');
  el.className = 'tree-level0' + (codeLocked ? ' code-hidden' : '');
  el.dataset.menuId = item.id;

  var subItems  = MENU_CONFIG.filter(function(i){ return i.parent === item.id; });
  var hasSubs   = subItems.length > 0;
  var hasSec    = item.type === 'section' && !!SECTIONS_CONFIG[item.sectionId];
  var expandable = hasSubs || hasSec;
  var isVis = menuIsVisible(item.id);

  var row = document.createElement('div');
  row.className = 'tree-row';
  row.innerHTML =
    '<span class="drag-handle" title="Glisser">⠇</span>' +
    (expandable
      ? '<button class="expand-btn" onclick="toggleExpand(this)">›</button>'
      : '<span class="expand-ph"></span>') +
    '<span class="tree-name">' + esc(item.name) + '</span>' +
    '<span class="type-tag">' + esc(item.type) + '</span>' +
    '<button class="vis-btn' + (isVis ? '' : ' hidden') + (codeLocked ? ' code-only' : '') + '"' +
      ' onclick="toggleMenuVis(\'' + item.id + '\',this)">' +
      (isVis ? 'Visible' : 'Masqué') +
    '</button>';
  el.appendChild(row);

  if (expandable) {
    var children = document.createElement('div');
    children.className = 'tree-children';
    if (hasSubs) {
      subItems.forEach(function(sub){ children.appendChild(buildSubSectionEl(sub)); });
    } else {
      buildCardsInto(children, item.sectionId);
    }
    el.appendChild(children);
  }

  return el;
}

/* ── Level 1 : sub-section (Portrait, Reportage…) ── */
function buildSubSectionEl(sub) {
  var el = document.createElement('div');
  el.className = 'tree-level1';
  el.dataset.menuId = sub.id;

  var sec       = SECTIONS_CONFIG[sub.sectionId];
  var cardCount = sec ? sec.cards.length : 0;
  var expandable = cardCount > 0;
  var isVis     = menuIsVisible(sub.id);

  var row = document.createElement('div');
  row.className = 'tree-row';
  row.innerHTML =
    '<span class="expand-ph"></span>' +
    (expandable
      ? '<button class="expand-btn" onclick="toggleExpand(this)">›</button>'
      : '<span class="expand-ph"></span>') +
    '<span class="tree-name">' + esc(sub.name) + '</span>' +
    '<span class="type-tag">' + cardCount + ' carte' + (cardCount !== 1 ? 's' : '') + '</span>' +
    '<button class="vis-btn' + (isVis ? '' : ' hidden') + '"' +
      ' onclick="toggleMenuVis(\'' + sub.id + '\',this)">' +
      (isVis ? 'Visible' : 'Masqué') +
    '</button>';
  el.appendChild(row);

  if (expandable) {
    var children = document.createElement('div');
    children.className = 'tree-children';
    buildCardsInto(children, sub.sectionId);
    el.appendChild(children);
  }

  return el;
}

/* ── Level 2 : gallery cards ── */
function buildCardsInto(container, sectionId) {
  var sec = SECTIONS_CONFIG[sectionId];
  if (!sec || !sec.cards.length) {
    container.innerHTML = '<div class="empty-note">— section vide —</div>';
    return;
  }

  var prefix = PREFIX[sectionId] || sectionId;

  var sorted = sec.cards.slice().sort(function(a, b){
    var oA = (DB.cards[prefix + '-' + a.id] || {}).sort_order;
    var oB = (DB.cards[prefix + '-' + b.id] || {}).sort_order;
    if (oA === undefined || oA === null) oA = 9999;
    if (oB === undefined || oB === null) oB = 9999;
    return oA - oB;
  });

  sorted.forEach(function(card){
    var dbId  = prefix + '-' + card.id;
    var dbRow = DB.cards[dbId] || {};
    var isVis = cardIsVisible(dbId, card);
    var name  = dbRow.title_fr || card.titleFr || card.titleEn || card.id;
    var img   = dbRow.cover_img || card.img || '';

    var el = document.createElement('div');
    el.className = 'tree-level2';
    el.dataset.cardId    = dbId;
    el.dataset.sectionId = sectionId;

    var thumb = img
      ? '<img class="tree-thumb" src="' + esc(img) + '" loading="lazy"' +
          ' onerror="this.outerHTML=\'<div class=tree-thumb-empty></div>\'">'
      : '<div class="tree-thumb-empty"></div>';

    el.innerHTML =
      '<div class="tree-row">' +
        '<span class="drag-handle" title="Glisser pour réordonner">⠇</span>' +
        '<span class="expand-ph"></span>' +
        thumb +
        '<span class="tree-name" contenteditable="true"' +
          ' title="Cliquer pour éditer"' +
          ' onblur="saveCardName(this,\'' + dbId + '\',\'' + sectionId + '\')"' +
          ' onkeydown="if(event.key===\'Enter\'){this.blur();event.preventDefault()}">' +
          esc(name) +
        '</span>' +
        '<button class="vis-btn' + (isVis ? '' : ' hidden') + '"' +
          ' onclick="toggleCardVis(\'' + dbId + '\',\'' + sectionId + '\',this)">' +
          (isVis ? 'Visible' : 'Masqué') +
        '</button>' +
      '</div>';

    container.appendChild(el);
  });

  /* Drag-and-drop */
  Sortable.create(container, {
    handle: '.drag-handle',
    animation: 150,
    ghostClass: 'sortable-ghost',
    dragClass:  'sortable-drag',
    onEnd: function(){ saveCardOrder(container, sectionId); }
  });
}

/* ====================================================
   EXPAND / COLLAPSE
   ==================================================== */
function toggleExpand(btn) {
  btn.classList.toggle('open');
  var parent   = btn.closest('.tree-level0, .tree-level1');
  var children = parent.querySelector(':scope > .tree-children');
  if (children) children.classList.toggle('open');
}

/* ====================================================
   SAVE — Menu visibility
   ==================================================== */
async function toggleMenuVis(id, btn) {
  var nowVis = btn.classList.contains('hidden'); /* currently hidden → make visible */
  btn.classList.add('saving');
  try {
    await sbUpsert('section_visibility', { id: id, visible: nowVis, updated_at: new Date().toISOString() });
    DB.menuVis[id] = nowVis;
    btn.classList.toggle('hidden', !nowVis);
    btn.textContent = nowVis ? 'Visible' : 'Masqué';
    showFeedback('"' + id + '" → ' + (nowVis ? 'Visible' : 'Masqué'));
  } catch(e) {
    showFeedback('Erreur : ' + e.message, 'err');
  }
  btn.classList.remove('saving');
}

/* ====================================================
   SAVE — Card visibility
   ==================================================== */
async function toggleCardVis(dbId, sectionId, btn) {
  var nowVis = btn.classList.contains('hidden');
  btn.classList.add('saving');
  try {
    await sbUpsert('gallery_cards', { id: dbId, section_id: sectionId, visible: nowVis, updated_at: new Date().toISOString() });
    if (!DB.cards[dbId]) DB.cards[dbId] = {};
    DB.cards[dbId].visible = nowVis;
    btn.classList.toggle('hidden', !nowVis);
    btn.textContent = nowVis ? 'Visible' : 'Masqué';
    showFeedback(nowVis ? 'Carte affichée' : 'Carte masquée');
  } catch(e) {
    showFeedback('Erreur : ' + e.message, 'err');
  }
  btn.classList.remove('saving');
}

/* ====================================================
   SAVE — Card name
   ==================================================== */
async function saveCardName(el, dbId, sectionId) {
  var name = el.textContent.trim();
  var prev = (DB.cards[dbId] || {}).title_fr || '';
  if (!name || name === prev) return;
  try {
    await sbUpsert('gallery_cards', { id: dbId, section_id: sectionId, title_fr: name, updated_at: new Date().toISOString() });
    if (!DB.cards[dbId]) DB.cards[dbId] = {};
    DB.cards[dbId].title_fr = name;
    showFeedback('Nom sauvegardé : "' + name + '"');
  } catch(e) {
    el.textContent = prev || el.textContent;
    showFeedback('Erreur : ' + e.message, 'err');
  }
}

/* ====================================================
   SAVE — Card order
   ==================================================== */
async function saveCardOrder(container, sectionId) {
  var rows = Array.from(container.querySelectorAll(':scope > .tree-level2'));
  var updates = rows.map(function(el, i){
    return { id: el.dataset.cardId, section_id: sectionId, sort_order: i, updated_at: new Date().toISOString() };
  });
  try {
    await sbUpsert('gallery_cards', updates);
    updates.forEach(function(u){
      if (!DB.cards[u.id]) DB.cards[u.id] = {};
      DB.cards[u.id].sort_order = u.sort_order;
    });
    showFeedback('Ordre sauvegardé');
  } catch(e) {
    showFeedback('Erreur : ' + e.message, 'err');
  }
}
</script>
</body>
</html>
