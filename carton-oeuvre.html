<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartons d'œuvres — Bertrand Basset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font: 'IBM Plex Sans', Arial, sans-serif;
      --black: #111; --gray: #444; --dim: #888; --line: #ddd;
    }
    html { font-family: var(--font); -webkit-font-smoothing: antialiased; }

    /* ── SCREEN ── */
    body { background: #e8e8e8; padding: 24px; }

    .screen-bar {
      max-width: 220mm; margin: 0 auto 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .screen-bar-title {
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #888;
    }
    .btn-print {
      font-family: var(--font);
      padding: 8px 20px; background: #111; color: #fff;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px;
    }
    .btn-print:hover { background: #333; }

    /* ── PAGE A4 ── */
    .page {
      width: 210mm; min-height: 297mm;
      background: white;
      margin: 0 auto 20px;
      padding: 10mm;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 5mm;
      box-shadow: 0 2px 16px rgba(0,0,0,0.12);
    }

    /* ── CARTON ── */
    .carton {
      border: 0.5pt solid var(--line);
      padding: 6mm 6mm 5mm 7mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* Top section */
    .c-kicker {
      font-size: 6.5pt; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 2.5mm;
    }
    .c-title {
      font-size: 20pt; font-weight: 300; letter-spacing: -0.02em;
      line-height: 1.05; color: var(--black); margin-bottom: 1mm;
    }
    .c-code {
      font-size: 6pt; letter-spacing: 0.06em; color: var(--dim);
      margin-bottom: 3.5mm;
    }

    .c-sep { height: 0.3pt; background: var(--line); margin-bottom: 3.5mm; }

    /* Description */
    .c-desc {
      font-size: 7pt; color: var(--gray); line-height: 1.55;
      font-weight: 300; margin-bottom: 2.5mm;
    }
    .c-desc em { font-style: italic; color: var(--dim); }

    /* Specs */
    .c-specs {
      font-size: 6.5pt; color: var(--gray); line-height: 1.6;
      font-weight: 300; margin-bottom: 3mm;
    }
    .c-specs strong { font-weight: 500; color: var(--black); }

    /* Bottom: price + QR */
    .c-bottom {
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .c-price-block {}
    .c-price {
      font-size: 16pt; font-weight: 300; letter-spacing: -0.02em;
      color: var(--black); line-height: 1;
    }
    .c-price-note {
      font-size: 5.5pt; letter-spacing: 0.06em; color: var(--dim);
      margin-top: 1mm; line-height: 1.4; text-transform: uppercase;
    }
    .c-qr {
      width: 18mm; height: 18mm; flex-shrink: 0;
    }
    .c-qr canvas, .c-qr img {
      width: 100% !important; height: 100% !important;
    }

    /* ── CARTON CARTE POSTALE ── */
    .carton-carte {
      border: 0.5pt solid var(--line);
      padding: 6mm 6mm 5mm 7mm;
      display: flex; flex-direction: column;
      justify-content: space-between;
    }
    .cc-kicker {
      font-size: 6.5pt; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 2mm;
    }
    .cc-title {
      font-size: 16pt; font-weight: 300; letter-spacing: -0.02em;
      line-height: 1.05; color: var(--black); margin-bottom: 1mm;
    }
    .cc-sub {
      font-size: 7pt; color: var(--dim); margin-bottom: 3.5mm;
    }
    .cc-sep { height: 0.3pt; background: var(--line); margin-bottom: 3.5mm; }
    .cc-produits { display: flex; flex-direction: column; gap: 2.5mm; margin-bottom: 4mm; }
    .cc-produit {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 8pt; color: var(--black);
    }
    .cc-produit-name { font-weight: 300; }
    .cc-produit-price { font-weight: 500; }
    .cc-produit-note { font-size: 6pt; color: var(--dim); font-style: italic; }
    .cc-bottom {
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .cc-note { font-size: 5.5pt; color: var(--dim); line-height: 1.5; text-transform: uppercase; letter-spacing: 0.06em; }
    .cc-qr { width: 18mm; height: 18mm; flex-shrink: 0; }
    .cc-qr canvas, .cc-qr img { width: 100% !important; height: 100% !important; }

    /* ── PRINT ── */
    @media print {
      body { background: none; padding: 0; }
      .screen-bar { display: none; }
      .page {
        width: 210mm; min-height: 297mm;
        padding: 10mm;
        margin: 0;
        box-shadow: none;
        page-break-after: always;
      }
      .carton, .carton-carte {
        border: 0.3pt solid #bbb;
      }
      @page { size: A4 portrait; margin: 0; }
    }
  </style>
</head>
<body>

<div class="screen-bar">
  <span class="screen-bar-title">Cartons d'œuvres + cartes postales — 2 pages A4</span>
  <button class="btn-print" onclick="window.print()">Imprimer</button>
</div>

<div id="page1" class="page"></div>
<div id="page2" class="page"></div>

<script>
const BASE_URL  = 'https://bertrandbasset.com/boutique.html?id=';
const PAYER_URL = 'https://bertrandbasset.com/payer.html';

const EDITIONS = [
  { slug:'sandstorm-feu',
    serie:"Dust'in Kolor", num:'01',
    titre:'Sandstorm', code:'6090_Feu',
    format:'60 × 90 cm',
    papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm',
    total:10, vendus:1, prix:[950, 1100, 1250] },

  { slug:'flying-car-orange',
    serie:"Dust'in Kolor", num:'02',
    titre:'Flying Car', code:'70124_Orange',
    format:'70 × 124 cm',
    papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm',
    total:10, vendus:1, prix:[1290, 1490, 1690] },

  { slug:'after-the-storm-vert',
    serie:"Dust'in Kolor", num:'03',
    titre:'After the Storm', code:'70124_Vert',
    format:'70 × 124 cm',
    papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm',
    total:10, vendus:2, prix:[1290, 1490, 1690] },

  { slug:'lost-in-the-dust-rouge',
    serie:"Dust'in Kolor", num:'04',
    titre:'Lost in the Dust', code:'6080_Rouge',
    format:'60 × 80 cm',
    papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm',
    total:10, vendus:1, prix:[890, 1020, 1150] },

  { slug:'camp-lighters-jaune',
    serie:"Dust'in Kolor", num:'05',
    titre:'Camp Lighters', code:'40100_Jaune',
    format:'40 × 100 cm',
    papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm',
    total:10, vendus:1, prix:[790, 910, 1030] },

  { slug:'im-here-bleu',
    serie:"Dust'in Kolor", num:'06',
    titre:"I'm Here", code:'6080_Bleu',
    format:'60 × 80 cm',
    papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm',
    total:10, vendus:1, prix:[890, 1020, 1150] },

  { slug:'umbrellas-way-rose',
    serie:"Dust'in Kolor", num:'08',
    titre:'Umbrellas Way', code:'6080_Rose',
    format:'60 × 80 cm',
    papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm',
    total:10, vendus:1, prix:[890, 1020, 1150] },
];

function palierIdx(ed) { return ed.vendus < 3 ? 0 : ed.vendus < 7 ? 1 : 2; }
function prixAct(ed)   { return ed.prix[palierIdx(ed)]; }
const restants = ed => [3,7,10][palierIdx(ed)] - ed.vendus;

function makeCarton(ed) {
  const div = document.createElement('div');
  div.className = 'carton';
  div.innerHTML = `
    <div>
      <div class="c-kicker">${ed.serie} — № ${ed.num}</div>
      <div class="c-title">${ed.titre}</div>
      <div class="c-code">${ed.code}</div>
      <div class="c-sep"></div>
      <div class="c-desc">
        Série limitée à ${ed.total} exemplaires numérotée et signée par l'artiste,
        avec certificat d'authenticité.
      </div>
      <div class="c-specs">
        <strong>${ed.format}</strong> · ${ed.papier}<br>
        Tirage d'art : Pix in the City, Auray
      </div>
    </div>
    <div class="c-bottom">
      <div class="c-price-block">
        <div class="c-price">${prixAct(ed).toLocaleString('fr-FR')} €</div>
        <div class="c-price-note">
          ${restants(ed)} premier${restants(ed)>1?'s':''} exemplaire${restants(ed)>1?'s':''} à ce prix<br>
          Prix progressif ensuite
        </div>
      </div>
      <div class="c-qr" id="qr-${ed.slug}"></div>
    </div>`;
  return div;
}

function makeCartePostale() {
  const div = document.createElement('div');
  div.className = 'carton-carte';
  div.innerHTML = `
    <div>
      <div class="cc-kicker">Exposition Dust'in Kolor · Bertrand Basset</div>
      <div class="cc-title">Cartes postales</div>
      <div class="cc-sub">Format 10 × 15 cm · Impression haute définition</div>
      <div class="cc-sep"></div>
      <div class="cc-produits">
        <div>
          <div class="cc-produit">
            <span class="cc-produit-name">1 carte postale</span>
            <span class="cc-produit-price">6 €</span>
          </div>
        </div>
        <div>
          <div class="cc-produit">
            <span class="cc-produit-name">Pack 3 cartes postales</span>
            <span class="cc-produit-price">15 €</span>
          </div>
          <div class="cc-produit-note">5 € la carte · économisez 17 %</div>
        </div>
      </div>
    </div>
    <div class="cc-bottom">
      <div class="cc-note">Scannez pour payer<br>par carte bancaire</div>
      <div class="cc-qr" id="qr-carte-postale"></div>
    </div>`;
  return div;
}

// Distribute 8 items across 2 pages (4 + 4)
const page1 = document.getElementById('page1');
const page2 = document.getElementById('page2');

EDITIONS.forEach((ed, i) => {
  const carton = makeCarton(ed);
  (i < 4 ? page1 : page2).appendChild(carton);
});
page2.appendChild(makeCartePostale());

// Generate all QR codes
EDITIONS.forEach(ed => {
  new QRCode(document.getElementById('qr-' + ed.slug), {
    text: BASE_URL + ed.slug,
    width: 150, height: 150,
    colorDark: '#111', colorLight: '#fff',
    correctLevel: QRCode.CorrectLevel.M
  });
});

new QRCode(document.getElementById('qr-carte-postale'), {
  text: PAYER_URL,
  width: 150, height: 150,
  colorDark: '#111', colorLight: '#fff',
  correctLevel: QRCode.CorrectLevel.M
});
</script>
</body>
</html>
