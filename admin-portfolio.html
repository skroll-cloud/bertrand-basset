// Scanner state
window._scanData    = null;  // { folderName: [filenames], ... }
window._scanFilter  = 'all'; // 'all' | 'published' | 'unpublished'

/* Scan images/ and cache in _scanData */
async function doScanImages() {
    if (!window._siteRootHandle) return null;
    let imagesDir;
    try { imagesDir = await window._siteRootHandle.getDirectoryHandle('images'); }
    catch(e) { return null; }

    const IMAGE_EXTS = new Set(['jpg','jpeg','png','gif','webp','avif']);
    const result = {};

    // Sub-directories
    for await (const [name, handle] of imagesDir.entries()) {
        if (handle.kind !== 'directory') continue;
        const files = [];
        for await (const [fname, fh] of handle.entries()) {
            if (fh.kind !== 'file') continue;
            if (IMAGE_EXTS.has(fname.split('.').pop().toLowerCase())) files.push(fname);
        }
        if (files.length > 0) {
            files.sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
            result[name] = files;
        }
    }
    // Root-level images
    const rootFiles = [];
    for await (const [fname, fh] of imagesDir.entries()) {
        if (fh.kind !== 'file') continue;
        if (IMAGE_EXTS.has(fname.split('.').pop().toLowerCase())) rootFiles.push(fname);
    }
    if (rootFiles.length > 0) {
        rootFiles.sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
        result['(racine)'] = rootFiles;
    }
    return result;
}

/* Move a file between two gallery sub-folders */
/* Copy a file to another gallery sub-folder (original kept in place) */
async function scannerCopyImage(srcFolder, filename, destFolder) {
    if (srcFolder === destFolder) return;
    try {
        const imagesDir = await window._siteRootHandle.getDirectoryHandle('images');
        const srcDir    = srcFolder === '(racine)' ? imagesDir : await imagesDir.getDirectoryHandle(srcFolder);
        const destDir   = await imagesDir.getDirectoryHandle(destFolder, {create: true});
        // Read source
        const srcFile  = await srcDir.getFileHandle(filename);
        const fileObj  = await srcFile.getFile();
        const buf      = await fileObj.arrayBuffer();
        // Write copy to dest (don't overwrite silently)
        let destName = filename;
        try { await destDir.getFileHandle(destName); /* exists — add suffix */
            const parts = filename.split('.');
            const ext = parts.pop();
            destName = `${parts.join('.')}-copie.${ext}`;
        } catch(e) { /* doesn't exist — good */ }
        const destFile = await destDir.getFileHandle(destName, {create: true});
        const writable = await destFile.createWritable();
        await writable.write(buf);
        await writable.close();
        // Update admin state: add to dest gallery config (manual galleries only)
        const newGId = Object.keys(state.galleriesConfig).find(id => state.galleriesConfig[id].path === `images/${destFolder}`);
        if (newGId && !getGalleryMeta(newGId).autoScan && newGId !== 'accueil') {
            const imgs = state.galleriesConfig[newGId].images || [];
            if (!imgs.find(img => img.filename === destName)) {
                imgs.push({filename: destName, title:'', captionFr:'', captionEn:'', btnLabel:'En savoir plus', btnUrl:''});
                state.galleriesConfig[newGId].images = imgs;
            }
        }
        saveState();
        await refreshScanner();
    } catch(err) {
        alert(`Erreur copie : ${err.message}`);
    }
}

/* Set an image as the landing (accueil) representative for its gallery */
function scannerSetAsLanding(folder, filename) {
    const gId = Object.keys(state.galleriesConfig).find(id =>
        state.galleriesConfig[id].path === `images/${folder}` && id !== 'accueil'
    );
    if (!gId) { alert('Impossible de déterminer la galerie pour ce dossier.'); return; }
    const accueil = state.galleriesConfig['accueil'];
    if (!accueil) { alert('Galerie accueil introuvable.'); return; }
    const imgs = accueil.images || [];
    const existing = imgs.find(img => img.link_gallery === gId);
    const galleryLabel = getGalleryMeta(gId).label || gId;
    const newSrc = `images/${folder}/${filename}`;
    if (existing) {
        existing.filename = filename;
        existing.src      = newSrc;
    } else {
        imgs.push({ filename, src: newSrc, label: galleryLabel, link_gallery: gId, captionFr:'', captionEn:'' });
    }
    accueil.images = imgs;
    saveState();
    // Visual feedback: briefly highlight the card
    const indicator = document.getElementById(`landing_${folder}_${filename.replace(/[^a-z0-9]/gi,'_')}`);
    if (indicator) { indicator.textContent = '🏠 ✓'; setTimeout(() => { indicator.textContent = '🏠 Landing'; }, 2000); }
    drawScannerContent(); // re-draw to update landing badges
}

/* Rename a file in its gallery sub-folder */
async function scannerRenameImage(folder, oldName) {
    const newName = prompt(`Renommer "${oldName}" en :`, oldName);
    if (!newName || newName === oldName) return;
    // Keep extension if user didn't type one
    const srcExt  = oldName.split('.').pop().toLowerCase();
    const destName = newName.includes('.') ? newName : `${newName}.${srcExt}`;
    try {
        const imagesDir = folder === '(racine)'
            ? await window._siteRootHandle.getDirectoryHandle('images')
            : await (await window._siteRootHandle.getDirectoryHandle('images')).getDirectoryHandle(folder);
        const srcFile  = await imagesDir.getFileHandle(oldName);
        const fileObj  = await srcFile.getFile();
        const buf      = await fileObj.arrayBuffer();
        const destFile = await imagesDir.getFileHandle(destName, {create: true});
        const writable = await destFile.createWritable();
        await writable.write(buf);
        await writable.close();
        await imagesDir.removeEntry(oldName);
        // Update admin state references
        for (const gId of Object.keys(state.galleriesConfig)) {
            const imgs = state.galleriesConfig[gId].images || [];
            imgs.forEach(img => { if (img.filename === oldName) img.filename = destName; });
        }
        saveState();
        await refreshScanner();
    } catch(err) {
        alert(`Erreur renommage : ${err.message}`);
    }
}

/* ── RELINK: pick a file from Finder and copy to gallery folder ──
   Works for both gallery editor (galleryId + idx) and scanner (folder + filename).
   Opens the native file picker, copies the chosen file to the expected location,
   and updates the admin config reference. ──────────────────────────────────── */

async function _relinkPickAndCopy(destFolder, expectedFilename) {
    // Open Finder file picker
    let fileHandle;
    try {
        [fileHandle] = await window.showOpenFilePicker({
            types: [{ description: 'Images', accept: { 'image/*': ['.jpg','.jpeg','.png','.gif','.webp','.avif'] } }],
            multiple: false,
            // Open inside the linked site folder (or images/ subfolder) if available
            ...(window._siteRootHandle ? { startIn: window._siteRootHandle } : {})
        });
    } catch(e) {
        if (e.name === 'AbortError') return null; // user cancelled
        throw e;
    }
    const file    = await fileHandle.getFile();
    const newName = expectedFilename || file.name;

    if (!window._siteRootHandle) {
        // No folder linked — return just the filename so caller can update config
        return { newName: file.name, copied: false };
    }

    // Copy the chosen file into images/{destFolder}/{newName}
    const imagesDir  = await window._siteRootHandle.getDirectoryHandle('images');
    const galleryDir = await imagesDir.getDirectoryHandle(destFolder, { create: true });
    const buf        = await file.arrayBuffer();
    const destFile   = await galleryDir.getFileHandle(newName, { create: true });
    const writable   = await destFile.createWritable();
    await writable.write(buf);
    await writable.close();
    return { newName, copied: true };
}

/* Relink an image in the gallery editor */
async function relinkImage(galleryId, idx) {
    const g = state.galleriesConfig[galleryId];
    if (!g || !g.images || !g.images[idx]) return;
    const img       = g.images[idx];
    const folder    = g.path.replace('images/','');
    try {
        const result = await _relinkPickAndCopy(folder, img.filename);
        if (!result) return;
        img.filename = result.newName;
        saveState();
        renderGalleryEditor(galleryId);
    } catch(e) { alert(`Erreur relink : ${e.message}`); }
}

/* Relink a broken image in the scanner */
async function relinkScannerImage(folder, filename) {
    try {
        const result = await _relinkPickAndCopy(folder, filename);
        if (!result) return;
        await refreshScanner();
    } catch(e) { alert(`Erreur relink : ${e.message}`); }
}

/* Re-scan and redraw scanner */
async function refreshScanner() {
    window._scanData = await doScanImages();
    drawScannerContent();
}

/* Draw scanner HTML from cached _scanData */
function drawScannerContent() {
    const el = document.getElementById('scannerContent');
    if (!el) return;
    const data = window._scanData;
    if (!data) {
        el.innerHTML = `<p style="color:#e65100;font-size:0.75rem;">⚠ Aucune donnée.</p>`;
        return;
    }

    // Published gallery lookup
    const publishedIds = new Set(
        Object.keys(state.galleriesConfig)
            .filter(id => !getGalleryMeta(id).hidden)
            .map(id => state.galleriesConfig[id].path.replace('images/',''))
    );

    // Current landing images: folder → filename
    const landingMap = {};
    const accueilImgs = state.galleriesConfig['accueil']?.images || [];
    accueilImgs.forEach(img => {
        if (img.link_gallery && img.filename) {
            const gPath = state.galleriesConfig[img.link_gallery]?.path || '';
            const folder = gPath.replace('images/','');
            if (folder) landingMap[folder] = img.filename;
        }
    });

    // Sort EXACTLY like Finder: pure natural alphabetical (no published-first)
    const allFolders = Object.keys(data).sort((a,b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'}));

    const filter = window._scanFilter || 'all';
    const folders = allFolders.filter(f => {
        if (filter === 'published')   return publishedIds.has(f);
        if (filter === 'unpublished') return !publishedIds.has(f);
        return true;
    });

    if (folders.length === 0) {
        el.innerHTML = `<p style="color:var(--dim);font-size:0.75rem;margin-top:1rem;">Aucune galerie pour ce filtre.</p>`;
        return;
    }

    // Copy-to options (all known folders)
    const folderOpts = allFolders
        .filter(f => f !== '(racine)')
        .map(f => `<option value="${escHtml(f)}">${escHtml(f)}${publishedIds.has(f)?' ✓':''}</option>`)
        .join('');

    // ── Landing summary section ───────────────────────────
    let landingHtml = '';
    if (Object.keys(landingMap).length > 0) {
        landingHtml = `<div style="margin-bottom:1.5rem;padding:0.75rem;background:var(--surface);border:1px solid var(--border);border-radius:4px;">
            <div style="font-size:0.6rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);margin-bottom:0.5rem;">🏠 Images landing actuelles</div>
            <div style="display:flex;flex-wrap:wrap;gap:0.4rem;">`;
        Object.entries(landingMap).forEach(([folder, fname]) => {
            const src = `images/${folder}/${fname}`;
            const gId = Object.keys(state.galleriesConfig).find(id => state.galleriesConfig[id].path === `images/${folder}`);
            const label = gId ? (getGalleryMeta(gId).label || gId) : folder;
            landingHtml += `<div style="display:flex;align-items:center;gap:0.3rem;background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:0.2rem 0.4rem;font-size:0.6rem;color:var(--dim);">
                <img src="${escHtml(src)}" style="width:22px;height:22px;object-fit:cover;border-radius:2px;" onerror="this.style.display='none'">
                <span>${escHtml(label)}</span>
                <span style="color:#777;">/ ${escHtml(fname)}</span>
            </div>`;
        });
        landingHtml += `</div></div>`;
    }

    // ── Per-folder image grids ────────────────────────────
    let html = landingHtml;
    for (const folder of folders) {
        const files   = data[folder];
        const path    = folder === '(racine)' ? 'images' : `images/${folder}`;
        const isPub   = publishedIds.has(folder);
        const gId     = Object.keys(state.galleriesConfig).find(id => state.galleriesConfig[id].path === `images/${folder}`);
        const canLand = !!gId && gId !== 'accueil';
        const badge   = isPub
            ? `<span class="gallery-badge" style="background:#1a3a1a;color:#6dbf6d;">publié</span>`
            : `<span class="gallery-badge" style="background:#333;color:#888;">non publié</span>`;

        html += `<div style="margin-bottom:2rem;">
            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.6rem;padding-bottom:0.35rem;border-bottom:1px solid var(--border);">
                <span style="font-size:0.72rem;font-weight:600;color:var(--text);">${escHtml(folder)}</span>
                ${badge}
                <span style="font-size:0.6rem;color:var(--dim);margin-left:auto;">${files.length} image${files.length!==1?'s':''}</span>
            </div>
            <div class="scanner-grid">`;

        for (const fname of files) {
            const src        = `${path}/${fname}`;
            const fSafe      = escHtml(fname).replace(/'/g,'&#39;');
            const folderSafe = escHtml(folder).replace(/'/g,'&#39;');
            const isLanding  = landingMap[folder] === fname;
            const landId     = ('landing_' + folder + '_' + fname).replace(/[^a-z0-9_]/gi,'_');

            html += `<div class="scanner-card${isLanding?' scanner-card-landing':''}">
                <div class="scanner-thumb-wrap">
                    <img src="${escHtml(src)}" loading="lazy" class="scanner-thumb"
                         onerror="this.closest('.scanner-card').classList.add('scanner-card-broken')">
                    <div class="scanner-actions">
                        <button class="scanner-btn" onclick="scannerRenameImage('${folderSafe}','${fSafe}')">✏ Renommer</button>
                        <select class="scanner-move-select"
                            onchange="if(this.value){scannerCopyImage('${folderSafe}','${fSafe}',this.value);this.value=''}"
                            title="Copier vers une autre galerie">
                            <option value="">📋 Copier vers…</option>
                            ${folderOpts}
                        </select>
                        <button class="scanner-btn" style="background:rgba(255,150,0,0.2);border-color:rgba(255,150,0,0.4);"
                            onclick="relinkScannerImage('${folderSafe}','${fSafe}')" title="Choisir le fichier dans le Finder">🔗 Relink</button>
                    </div>
                </div>
                <div class="scanner-fname" title="${escHtml(fname)}">${isLanding ? '🏠 ' : ''}${escHtml(fname)}</div>
                ${canLand ? `<button class="scanner-landing-btn" id="${landId}"
                    onclick="scannerSetAsLanding('${folderSafe}','${fSafe}')"
                    ${isLanding ? 'style="color:#6dbf6d;"' : ''}>
                    ${isLanding ? '🏠 Landing ✓' : '🏠 Définir landing'}
                </button>` : ''}
            </div>`;
        }
        html += `</div></div>`;
    }
    el.innerHTML = html;
}


async function renderImageScanner() {
    const editor = document.getElementById('editor');
    if (!editor) return;

    const filterBtns = (active) => ['all','published','unpublished'].map(v => {
        const labels = {all:'Tout', published:'Publiés', unpublished:'Non publiés'};
        return `<button onclick="window._scanFilter='${v}';drawScannerContent();document.querySelectorAll('.scan-filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.f==='${v}'))"
            class="scan-filter-btn btn btn-ghost btn-sm${v===active?' active':''}" data-f="${v}">${labels[v]}</button>`;
    }).join('');

    editor.innerHTML = `
        <div class="ed-header" style="margin-bottom:0.75rem;">
            <div>
                <div class="ed-title">📁 Toutes les images</div>
                <div class="ed-subtitle">Clic sur ✏ pour renommer · "→ déplacer" pour changer de galerie</div>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="refreshScanner()" title="Rescanner">↺ Rescanner</button>
        </div>
        <div style="display:flex;gap:0.4rem;margin-bottom:1rem;">
            ${filterBtns(window._scanFilter||'all')}
        </div>
        <div id="scannerContent">
            <p style="color:var(--dim);font-size:0.75rem;">Chargement…</p>
        </div>`;

    if (!window._siteRootHandle) {
        document.getElementById('scannerContent').innerHTML =
            `<p style="color:#e65100;font-size:0.75rem;">⚠ Aucun dossier lié. Liez d'abord le dossier site (🔴 Lier site/).</p>`;
        return;
    }

    try {
        window._scanData = await doScanImages();
        if (!window._scanData) {
            document.getElementById('scannerContent').innerHTML =
                `<p style="color:#e65100;font-size:0.75rem;">⚠ Dossier <code>images/</code> introuvable.</p>`;
            return;
        }
        drawScannerContent();
    } catch(err) {
        document.getElementById('scannerContent').innerHTML =
            `<p style="color:#e65100;font-size:0.75rem;">⚠ Erreur scan: ${escHtml(err.message)}</p>`;
    }
}

function renderGalleryEditor(id) {
    if (!id) return;
    if (id === '_scanner') { renderImageScanner(); return; }
    const editor = document.getElementById('editor');
    const g = state.galleriesConfig[id];
    const m = getGalleryMeta(id);
    if (!g) { editor.innerHTML = '<p style="color:#555;padding:2rem;">Galerie introuvable.</p>'; return; }

    const deleteBtn = m.custom
        ? `<button class="btn btn-red btn-sm" onclick="deleteGallery('${id}')" style="margin-left:auto;">\uD83D\uDDD1 Supprimer</button>`
        : '';

    let html = `<div class="ed-header" style="display:flex;align-items:flex-start;gap:1rem;">
        <div style="flex:1;">
            <div class="ed-title">${m.icon} ${m.label}</div>
            <div class="ed-subtitle">Chemin\u00A0: ${g.path}${m.hidden?' \u2014 galerie cach\u00E9e':''}</div>
        </div>
        ${deleteBtn}
    </div>`;

    /* Autoplay controls for all galleries except accueil */
    if (!m.special) {
        const delay = g.autoplayDelay || 4;
        html += `<div style="display:flex;gap:1rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center;">`;
        if (m.custom) {
            html += `<label style="font-size:0.68rem;color:var(--dim);display:flex;align-items:center;gap:0.4rem;cursor:pointer;">
                <input type="checkbox" ${m.autoScan?'checked':''} style="width:13px;height:13px;accent-color:#fff;"
                    onchange="GALLERY_META['${id}'].autoScan=this.checked;renderGalleryEditor('${id}')"> Auto-scan</label>`;
        }
        html += `<label style="font-size:0.68rem;color:var(--dim);display:flex;align-items:center;gap:0.4rem;cursor:pointer;">
                <input type="checkbox" id="ap_${id}" ${g.autoplay?'checked':''} style="width:13px;height:13px;accent-color:#fff;"
                    onchange="state.galleriesConfig['${id}'].autoplay=this.checked;saveState();document.getElementById('apd_${id}').style.opacity=this.checked?'1':'0.35'">
                Défilement auto</label>
            <label style="font-size:0.68rem;color:var(--dim);display:flex;align-items:center;gap:0.4rem;" id="apd_${id}" style="opacity:${g.autoplay?'1':'0.35'}">
                <span style="white-space:nowrap;">Dur\u00e9e\u00a0:</span>
                <input type="number" min="1" max="30" value="${delay}" style="width:48px;padding:0.2rem 0.35rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:0.72rem;border-radius:3px;text-align:center;"
                    onchange="state.galleriesConfig['${id}'].autoplayDelay=Math.max(1,Math.min(30,parseInt(this.value)||4));saveState()">
                <span>sec</span>
            </label>
            <label style="font-size:0.68rem;color:var(--dim);display:flex;align-items:center;gap:0.4rem;cursor:pointer;">
                <input type="checkbox" ${g.autoplayAudio?'checked':''} style="width:13px;height:13px;accent-color:#fff;"
                    onchange="state.galleriesConfig['${id}'].autoplayAudio=this.checked;saveState()">
                \uD83C\uDFB5 Audio auto</label>`;
        html += `</div><hr class="sep">`;
    }

    if (m.special && id === 'accueil') {
        html += renderAccueilFeatured(g);
    }

    const imgs = g.images || [];
    const cartons = g.cartons || [];
    const totalImgs = imgs.length;
    const totalCartons = cartons.length;

    html += `<div class="section-title">
        <span>${id==='accueil'?"Images d'accueil":'Contenu du carrousel'}</span>
        <span class="count">${totalImgs} image${totalImgs!==1?'s':''}${totalCartons?' · '+totalCartons+' carton'+(totalCartons!==1?'s':''):''}</span>
    </div>`;

    /* ── Unified list: images interleaved with cartons by position ── */
    if (id !== 'accueil') {
        html += `<div class="gallery-items-list" id="grid_${id}">`;

        /* Insert-carton zone helper */
        const insertZone = (pos) => `
            <div class="insert-carton-zone" onclick="addCarton('${id}',${pos})">
                <div class="insert-carton-line"></div>
                <button class="insert-carton-btn">\uD83C\uDFAF + Insérer un carton ici</button>
                <div class="insert-carton-line"></div>
            </div>`;

        /* Cartons at this position */
        const cartonsAt = (pos) => cartons
            .filter(c => c.position === pos)
            .map(c => renderCartonCard(id, c))
            .join('');

        /* Before position 0 */
        html += insertZone(0);
        html += cartonsAt(0);

        /* Images: group consecutive images (no carton between them) into .images-subgrid */
        let subgridBuf = [];
        const flushSubgrid = () => {
            if (subgridBuf.length > 0) {
                html += `<div class="images-subgrid">` + subgridBuf.join('') + `</div>`;
                subgridBuf = [];
            }
        };
        imgs.forEach((img, i) => {
            subgridBuf.push(renderImageCard(id, img, i, m));
            const pos = i + 1;
            const hasCartonsHere = cartons.some(c => c.position === pos);
            if (hasCartonsHere) {
                flushSubgrid();
                html += insertZone(pos);
                html += cartonsAt(pos);
            }
        });
        flushSubgrid();
        html += insertZone(imgs.length);

        if (!m.autoScan) {
            html += `<div class="add-zone" onclick="addImage('${id}')">
                <span class="icon">+</span><span>Ajouter une image</span>
            </div>`;
        }
        html += `<div class="add-zone" onclick="importFolderToGallery('${id}')" title="S\u00e9lectionne un dossier \u2014 toutes les images sont copi\u00e9es dans ${g.path}/">
            <span class="icon">\uD83D\uDCC2</span><span>Importer un dossier d\u2019images</span>
        </div>`;

        html += `</div>`;
    } else {
        /* Accueil: keep the old grid layout, no cartons */
        html += `<div class="images-grid" id="grid_${id}">`;
        imgs.forEach((img, i) => { html += renderImageCard(id, img, i, m); });
        html += `<div class="add-zone" onclick="addImage('${id}')">
            <span class="icon">+</span><span>Ajouter une image</span>
        </div></div>`;
    }

    editor.innerHTML = html;
}

function deleteGallery(id) {
    const lbl = getGalleryMeta(id).label || id;
    if (!confirm('Supprimer la galerie \u00AB ' + lbl + ' \u00BB ?\nCette action est irr\u00E9versible (les images sur le disque ne sont pas supprim\u00E9es).')) return;
    delete state.galleriesConfig[id];
    delete GALLERY_META[id];
    state.menuConfig = state.menuConfig.filter(m => m.galleryId !== id);
    state.activeGallery = 'portrait';
    saveState(); renderSidebar(); renderGalleryEditor('portrait');
    showToast('Galerie \u00AB ' + lbl + ' \u00BB supprim\u00E9e.');
}

function toggleGalleryCarton(id, type, enabled) {
    /* Legacy compat — kept for imported old configs */
    const m = GALLERY_META[id];
    if (!m) return;
    if (type === 'desc') {
        m.hasDesc = enabled;
        if (!enabled) { delete state.galleriesConfig[id].descFr; delete state.galleriesConfig[id].descEn; }
        else { state.galleriesConfig[id].descFr = state.galleriesConfig[id].descFr||''; state.galleriesConfig[id].descEn = state.galleriesConfig[id].descEn||''; }
    } else {
        m.hasCta = enabled;
        if (!enabled) { delete state.galleriesConfig[id].ctaFr; delete state.galleriesConfig[id].ctaEn; }
        else { state.galleriesConfig[id].ctaFr = state.galleriesConfig[id].ctaFr||''; state.galleriesConfig[id].ctaEn = state.galleriesConfig[id].ctaEn||''; }
    }
    saveState(); renderGalleryEditor(id);
}

/* ═══════════════════════════════════════════════════════
   CARTONS
═══════════════════════════════════════════════════════ */
function genCid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

function addCarton(galleryId, position) {
    const g = state.galleriesConfig[galleryId];
    if (!g) return;
    if (!g.cartons) g.cartons = [];
    g.cartons.push({ cid: genCid(), position, titleFr:'', titleEn:'', subtitleFr:'', subtitleEn:'', descFr:'', descEn:'', ctaLabel:'', ctaUrl:'', categoryFr:'', categoryEn:'', sidebarFr:'', sidebarEn:'' });
    saveState();
    renderGalleryEditor(galleryId);
}

function removeCarton(galleryId, cid) {
    const g = state.galleriesConfig[galleryId];
    if (!g?.cartons) return;
    g.cartons = g.cartons.filter(c => c.cid !== cid);
    saveState();
    renderGalleryEditor(galleryId);
}

function updateCarton(galleryId, cid, field, value) {
    const g = state.galleriesConfig[galleryId];
    const c = g?.cartons?.find(c => c.cid === cid);
    if (!c) return;
    c[field] = value;
    /* Update the live preview title in the badge without full re-render */
    const preview = document.getElementById('ctp_' + cid);
    if (preview && (field === 'titleFr' || field === 'titleEn')) {
        preview.textContent = value || (field === 'titleFr' ? c.titleEn : c.titleFr) || 'Sans titre';
    }
    saveState();
}

        <div class="carton-card-body">

function renderImageCard(galleryId, img, idx, meta) {
    const path      = state.galleriesConfig[galleryId].path;
    const thumbSrc  = `${path}/${img.filename}`;
    const isAccueil = galleryId === 'accueil';
    const isManual  = !meta.autoScan || isAccueil;
    const draggable = isManual ? 'true' : 'false';

    let html = `<div class="image-card" id="card_${galleryId.replace(/[^a-z0-9]/gi,'_')}_${idx}"
         draggable="${draggable}"
         ondragstart="imgDragStart(event,'${galleryId}',${idx})"
         ondragover="imgDragOver(event,'${galleryId}',${idx})"
         ondrop="imgDrop(event,'${galleryId}',${idx})"
         ondragleave="imgDragLeave(event)">
        <div class="image-thumb-wrap">
            <img class="image-thumb" src="${escHtml(thumbSrc)}" loading="lazy"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="image-thumb-empty" style="display:none;flex-direction:column;align-items:center;justify-content:center;gap:0.2rem;">
                \uD83D\uDCF7
                <button class="relink-btn" onclick="relinkImage('${galleryId}',${idx})" title="Choisir le fichier dans le Finder">🔗 Relink</button>
            </div>
        </div>
        <div class="image-card-filename" title="${escHtml(img.filename)}">${escHtml(img.filename)}</div>
        <details class="image-card-fields">
        <summary>Éditer</summary>
        <div class="image-card-body">
            <div>`;

    if (!isAccueil) {
        html += `<div class="mini-field"><label class="mini-label">Titre sidebar</label>
            <input class="mini-input" type="text" value="${escHtml(img.title||'')}"
                placeholder="ex: Jean-François, Portrait…"
                oninput="updateImg('${galleryId}',${idx},'title',this.value)"></div>
        <div class="mini-field"><label class="mini-label">Sous-titre sidebar</label>
            <input class="mini-input" type="text" value="${escHtml(img.subtitle||'')}"
                placeholder="ex: SERIE GEM"
                oninput="updateImg('${galleryId}',${idx},'subtitle',this.value)"></div>`;
    }

    if (isAccueil) {
        const galleries = Object.keys(state.galleriesConfig).filter(g => g !== 'accueil');
        const galleryOptions = galleries.map(g => {
            const meta = getGalleryMeta(g);
            const label = meta.label || g;
            return `<option value="${g}" ${img.link_gallery===g?'selected':''}>${label}</option>`;
        }).join('');
        html += `
            <div class="mini-field"><label class="mini-label">Nom affiché sur l'image</label>
                <input class="mini-input" type="text" value="${escHtml(img.label||'')}"
                    placeholder="ex: Portrait, Immersion…"
                    oninput="updateImg('${galleryId}',${idx},'label',this.value)"></div>
            <div class="mini-field"><label class="mini-label">Ouvre la galerie \u2192</label>
                <select style="width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.3rem 0.4rem;font-size:0.72rem;font-family:inherit;border-radius:2px;"
                    onchange="updateImg('${galleryId}',${idx},'link_gallery',this.value)">
                    <option value="">— aucune —</option>
                    ${galleryOptions}
                </select></div>`;
    }

    html += `<div class="mini-field"><label class="mini-label">Texte sidebar FR</label>
        <textarea class="mini-textarea" rows="2"
            oninput="updateImg('${galleryId}',${idx},'captionFr',this.value)"
        >${escHtml(img.captionFr||'')}</textarea></div>
    <div class="mini-field"><label class="mini-label">Texte sidebar EN</label>
        <textarea class="mini-textarea" rows="2"
            oninput="updateImg('${galleryId}',${idx},'captionEn',this.value)"
        >${escHtml(img.captionEn||'')}</textarea></div>`;

    if (!isAccueil) {
        html += `<div class="mini-field"><label class="mini-label">Bouton \u2014 libell\u00E9 &amp; URL</label>
            <div class="mini-flex">
                <input class="mini-input" type="text" value="${escHtml(img.btnLabel||'En savoir plus')}"
                    placeholder="En savoir plus" style="flex:1"
                    oninput="updateImg('${galleryId}',${idx},'btnLabel',this.value)">
                <input class="mini-input" type="text" value="${escHtml(img.btnUrl||'')}"
                    placeholder="https://..." style="flex:2"
                    oninput="updateImg('${galleryId}',${idx},'btnUrl',this.value)">
            </div></div>`;
    }

    if (!meta.autoScan && !isAccueil) {
        html += `<div class="mini-field" style="margin-top:0.3rem"><label class="mini-label">Nom de fichier</label>
            <input class="mini-input" type="text" value="${escHtml(img.filename)}"
                oninput="updateImg('${galleryId}',${idx},'filename',this.value)"></div>`;
    }

    /* Audio field — always shown for manual galleries, or when image already has audio */
    const gConf = state.galleriesConfig[galleryId];
    const isManualGallery = !getGalleryMeta(galleryId)?.autoScan;
    if (isManualGallery || img.audio) {
        html += `<div class="mini-field" style="margin-top:0.4rem;">
            <label class="mini-label" style="display:flex;align-items:center;gap:0.4rem;">
                <span>\uD83C\uDFB5 Fichier audio</span>
                <span style="color:var(--dim);font-weight:300;">(ex\u00a0: ALain.mp3)</span>
            </label>
            <input class="mini-input" type="text" value="${escHtml(img.audio||'')}"
                placeholder="NomFichier.mp3"
                oninput="updateImg('${galleryId}',${idx},'audio',this.value);renderGalleryEditor('${galleryId}')">
        </div>`;
        if (img.audio) {
            /* Per-image autoplay override — only shown when audio is set */
            const ap = img.audioAutoplay;
            html += `<div class="mini-field" style="margin-top:0.25rem;display:flex;gap:0.75rem;align-items:center;">
                <span style="font-size:0.65rem;color:var(--dim);">Autoplay\u00a0:</span>
                <label style="font-size:0.65rem;display:flex;align-items:center;gap:0.3rem;cursor:pointer;">
                    <input type="radio" name="ap_${galleryId}_${idx}" value="auto" ${ap===undefined||ap===null?'checked':''}
                        style="accent-color:#fff;" onchange="updateImg('${galleryId}',${idx},'audioAutoplay',undefined)">
                    Galerie</label>
                <label style="font-size:0.65rem;display:flex;align-items:center;gap:0.3rem;cursor:pointer;">
                    <input type="radio" name="ap_${galleryId}_${idx}" value="on" ${ap===true?'checked':''}
                        style="accent-color:#fff;" onchange="updateImg('${galleryId}',${idx},'audioAutoplay',true)">
                    Oui</label>
                <label style="font-size:0.65rem;display:flex;align-items:center;gap:0.3rem;cursor:pointer;">
                    <input type="radio" name="ap_${galleryId}_${idx}" value="off" ${ap===false?'checked':''}
                        style="accent-color:#fff;" onchange="updateImg('${galleryId}',${idx},'audioAutoplay',false)">
                    Non</label>
            </div>`;
        }
    }

    html += `</div></div>
        </details>`;

    html += `<div class="image-card-actions">`;
    if (isManual) {
        html += `<span class="btn-icon drag-handle" title="D\u00E9placer">\u283F</span>
                 <span style="flex:1"></span>
                 <button class="btn-icon danger" onclick="removeImage('${galleryId}',${idx})" title="Supprimer">\uD83D\uDDD1</button>`;
    } else {
        html += `<span style="font-size:0.58rem;color:#444;">${idx+1} / ${(state.galleriesConfig[galleryId].images||[]).length}</span>`;
    }
    html += `</div></div>`;
    return html;
}

/* ═══════════════════════════════════════════════════════
   MENU EDITOR
═══════════════════════════════════════════════════════ */
function menuTargetField(item, i) {
    const inpStyle = `background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.25rem 0.4rem;font-size:0.7rem;font-family:inherit;border-radius:2px;width:100%;`;
    if (item.type === 'group') {
        return `<span style="font-size:0.65rem;color:var(--dim);font-style:italic;">— en-tête de section —</span>`;
    }
    /* For gallery/page/external: show cible + parent group selector */
    const groups = state.menuConfig.filter(m => m.type === 'group');
    const parentSel = groups.length ? `
        <div style="margin-top:0.3rem;">
        <select style="${inpStyle}font-size:0.62rem;" title="Groupe parent"
            onchange="state.menuConfig[${i}].parent=this.value||undefined;if(!this.value)delete state.menuConfig[${i}].parent;saveState();renderSidebar();renderMenuEditor();">
            <option value="">↳ aucun groupe</option>
            ${groups.map(g => `<option value="${g.id}" ${item.parent===g.id?'selected':''}>${g.name}</option>`).join('')}
        </select></div>` : '';
    if (item.type === 'gallery') {
        const galleries = Object.keys(state.galleriesConfig);
        /* Ensure galleryId is valid; default to first gallery if missing */
        const currentGalleryId = item.galleryId && galleries.includes(item.galleryId)
            ? item.galleryId
            : (galleries[0] || '');
        if (!item.galleryId || !galleries.includes(item.galleryId)) {
            state.menuConfig[i].galleryId = currentGalleryId;
        }
        return `<select style="${inpStyle}"
            onchange="state.menuConfig[${i}].galleryId=this.value;delete state.menuConfig[${i}].pageId;delete state.menuConfig[${i}].url;saveState();renderSidebar();">
            ${galleries.map(g => `<option value="${g}" ${currentGalleryId===g?'selected':''}>${g}</option>`).join('')}
        </select>${parentSel}`;
    }
    if (item.type === 'page') {
        return `<input style="${inpStyle}" type="text" value="${escHtml(item.pageId||'')}" placeholder="ex: infos"
            oninput="state.menuConfig[${i}].pageId=this.value;delete state.menuConfig[${i}].galleryId;delete state.menuConfig[${i}].url;saveState();">${parentSel}`;
    }
    if (item.type === 'external') {
        return `<input style="${inpStyle}" type="text" value="${escHtml(item.url||'')}" placeholder="https://..."
            oninput="state.menuConfig[${i}].url=this.value;delete state.menuConfig[${i}].galleryId;delete state.menuConfig[${i}].pageId;saveState();">${parentSel}`;
    }
    return '';
}

function renderMenuEditor() {
    const thStyle = `padding:0.45rem 0.6rem;text-align:left;font-weight:600;font-size:0.58rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--dim);border-bottom:1px solid var(--border);`;
    document.getElementById('editor').innerHTML = `
    <div class="ed-header">
        <div class="ed-title">Menu de navigation</div>
        <div class="ed-subtitle">Ajoutez, supprimez ou réorganisez les entrées du menu. Glissez-déposez pour réordonner.</div>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:0.72rem;margin-bottom:1rem;">
        <thead><tr>
            <th style="${thStyle}width:2rem;"></th>
            <th style="${thStyle}">Nom affiché</th>
            <th style="${thStyle}width:8rem;">Type</th>
            <th style="${thStyle}">Cible</th>
            <th style="${thStyle}width:5.5rem;text-align:center;">Visible</th>
            <th style="${thStyle}width:2rem;"></th>
        </tr></thead>
        <tbody id="menuTableBody">
        ${state.menuConfig.map((item,i) => {
            const isGroup = item.type === 'group';
            const rowBg = isGroup ? 'background:rgba(255,255,255,0.03);' : '';
            const inpStyle = `background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.28rem 0.5rem;font-size:${isGroup?'0.75rem':'0.72rem'};font-family:inherit;border-radius:2px;width:100%;${isGroup?'font-weight:500;letter-spacing:0.06em;':''}`;
            const indent = item.parent ? 'padding-left:1.2rem;' : '';
            return `
            <tr style="border-bottom:1px solid var(--border);${item.hidden?'opacity:0.5;':''}${rowBg}"
                draggable="true" ondragstart="menuDragStart(${i})" ondragover="menuDragOver(event,${i})" ondrop="menuDrop(${i})">
                <td style="padding:0.45rem 0.5rem;text-align:center;color:var(--dim);cursor:grab;">${isGroup?'≡':'⠿'}</td>
                <td style="padding:0.35rem 0.5rem;${indent}">
                    <input style="${inpStyle}" type="text" value="${escHtml(item.name)}"
                        oninput="state.menuConfig[${i}].name=this.value;saveState();renderSidebar();">
                </td>
                <td style="padding:0.35rem 0.5rem;">
                    <select style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.25rem 0.4rem;font-size:0.7rem;font-family:inherit;border-radius:2px;width:100%;"
                        onchange="(function(el,idx){
                            const cfg=state.menuConfig[idx];
                            const t=el.value;
                            cfg.type=t;
                            if(t==='gallery'){
                                if(!cfg.galleryId) cfg.galleryId=Object.keys(state.galleriesConfig)[0]||'';
                                delete cfg.pageId; delete cfg.url;
                            } else if(t==='group'){
                                delete cfg.galleryId; delete cfg.pageId; delete cfg.url; delete cfg.parent;
                            } else if(t==='page'){
                                if(!cfg.pageId) cfg.pageId='infos';
                                delete cfg.galleryId; delete cfg.url;
                            } else if(t==='external'){
                                if(!cfg.url) cfg.url='https://';
                                delete cfg.galleryId; delete cfg.pageId;
                            }
                            saveState();renderMenuEditor();renderSidebar();
                        })(this,${i});">
                        <option value="gallery"  ${item.type==='gallery' ?'selected':''}>galerie</option>
                        <option value="page"     ${item.type==='page'    ?'selected':''}>page</option>
                        <option value="external" ${item.type==='external'?'selected':''}>lien ext.</option>
                        <option value="group"    ${isGroup               ?'selected':''}>📂 groupe</option>
                    </select>
                </td>
                <td style="padding:0.35rem 0.5rem;">${menuTargetField(item,i)}</td>
                <td style="padding:0.35rem 0.5rem;text-align:center;">
                    <label style="display:inline-flex;align-items:center;gap:0.35rem;cursor:pointer;font-size:0.63rem;color:var(--dim);">
                        <input type="checkbox" ${!item.hidden?'checked':''} style="width:13px;height:13px;cursor:pointer;accent-color:#fff;"
                            onchange="toggleMenuVisible(${i},this.checked)">
                        <span style="color:${item.hidden?'#555':'#6a6'}">${item.hidden?'caché':'visible'}</span>
                    </label>
                </td>
                <td style="padding:0.35rem 0.5rem;text-align:center;">
                    <button class="btn btn-ghost btn-sm" style="color:#c55;padding:0.15rem 0.4rem;"
                        onclick="removeMenuItem(${i})" title="Supprimer">✕</button>
                </td>
            </tr>`;
        }).join('')}
        </tbody>
    </table>
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
        <button class="btn btn-ghost" onclick="addMenuItem()" style="font-size:0.68rem;">+ Ajouter un item</button>
        <button class="btn btn-ghost" onclick="addMenuGroup()" style="font-size:0.68rem;">+ Ajouter un groupe</button>
    </div>`;
}

function addMenuItem() {
    state.menuConfig.push({ id: 'item-' + Date.now(), name: 'NOUVEAU', type: 'gallery', galleryId: Object.keys(state.galleriesConfig)[0] || '' });
    saveState(); renderSidebar(); renderMenuEditor();
}
function addMenuGroup() {
    state.menuConfig.push({ id: 'group-' + Date.now(), name: 'SECTION', type: 'group' });
    saveState(); renderSidebar(); renderMenuEditor();
}
function removeMenuItem(i) {
    if (!confirm('Supprimer cet item du menu ?')) return;
    state.menuConfig.splice(i, 1);
    saveState(); renderSidebar(); renderMenuEditor();
}

function renderPageEditor(pageId) {
    const page = state.pagesConfig?.[pageId];
    if (!page) { document.getElementById('editor').innerHTML = '<div class="ed-header"><div class="ed-title">Page introuvable</div></div>'; return; }
    const sections = page.sections || [];
    const labels = { infos: 'Infos' };
    const inp = `background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:0.3rem 0.5rem;font-size:0.72rem;font-family:inherit;border-radius:2px;width:100%;`;
    const ta  = `${inp}resize:vertical;min-height:80px;line-height:1.55;`;

    let html = `
    <div class="ed-header">
        <div class="ed-title">\uD83D\uDCCB Page — ${labels[pageId]||pageId}</div>
        <div class="ed-subtitle">Sections de contenu affich\u00E9es dans la page. Chaque section = un bloc titre + texte + image optionnelle.</div>
    </div>`;

    sections.forEach((sec, i) => {
        html += `
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:4px;margin-bottom:1rem;overflow:hidden;">
            <div style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0.75rem;background:var(--surface2);border-bottom:1px solid var(--border);">
                <span style="font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--dim);">Section ${i+1}</span>
                <span style="flex:1;font-size:0.7rem;color:var(--text);">${escHtml(sec.titleFr||sec.titleEn||'Sans titre')}</span>
                <button class="btn btn-ghost btn-sm" onclick="movePageSection('${pageId}',${i},-1)" title="Monter" ${i===0?'disabled':''} style="padding:0.1rem 0.35rem;">↑</button>
                <button class="btn btn-ghost btn-sm" onclick="movePageSection('${pageId}',${i},1)"  title="Descendre" ${i===sections.length-1?'disabled':''} style="padding:0.1rem 0.35rem;">↓</button>
                <button class="btn btn-ghost btn-sm" style="color:#c55;padding:0.1rem 0.4rem;" onclick="removePageSection('${pageId}',${i})" title="Supprimer">✕</button>
            </div>
            <div style="padding:0.75rem;display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
                <div class="field-group"><label class="field-label">Titre FR</label>
                    <input style="${inp}" type="text" value="${escHtml(sec.titleFr||'')}"
                        oninput="updatePageSection('${pageId}',${i},'titleFr',this.value)"></div>
                <div class="field-group"><label class="field-label">Titre EN</label>
                    <input style="${inp}" type="text" value="${escHtml(sec.titleEn||'')}"
                        oninput="updatePageSection('${pageId}',${i},'titleEn',this.value)"></div>
                <div class="field-group"><label class="field-label">Texte FR</label>
                    <textarea style="${ta}" oninput="updatePageSection('${pageId}',${i},'bodyFr',this.value)">${escHtml(sec.bodyFr||'')}</textarea></div>
                <div class="field-group"><label class="field-label">Texte EN</label>
                    <textarea style="${ta}" oninput="updatePageSection('${pageId}',${i},'bodyEn',this.value)">${escHtml(sec.bodyEn||'')}</textarea></div>
                <div class="field-group" style="grid-column:1/-1;">
                    <label class="field-label">Image (chemin relatif, ex : images/portrait/portrait-01.jpg)</label>
                    <div style="display:flex;gap:0.5rem;align-items:center;">
                        <input style="${inp}" type="text" value="${escHtml(sec.image||'')}" placeholder="Laisser vide si pas d'image"
                            oninput="updatePageSection('${pageId}',${i},'image',this.value)">
                        ${sec.image ? `<img src="${escHtml(sec.image)}" style="height:48px;width:72px;object-fit:cover;border-radius:2px;border:1px solid var(--border);flex-shrink:0;" onerror="this.style.display='none'">` : ''}
                    </div>
                </div>
                <div class="field-group" style="grid-column:1/-1;">
                    <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.7rem;color:var(--dim);">
                        <input type="checkbox" ${sec.showContact?'checked':''} style="width:13px;height:13px;cursor:pointer;accent-color:#fff;"
                            onchange="updatePageSection('${pageId}',${i},'showContact',this.checked)">
                        Afficher le bloc contact (email + réseaux sociaux) à la fin de cette section
                    </label>
                </div>
            </div>
        </div>`;
    });

    html += `<button class="btn btn-ghost" onclick="addPageSection('${pageId}')" style="font-size:0.68rem;margin-top:0.25rem;">+ Ajouter une section</button>`;
    document.getElementById('editor').innerHTML = html;
}

function updatePageSection(pageId, i, field, value) {
    if (!state.pagesConfig[pageId]?.sections?.[i]) return;
    state.pagesConfig[pageId].sections[i][field] = value;
    saveState();
    // Refresh thumbnail preview if image changed
    if (field === 'image') renderPageEditor(pageId);
}
function addPageSection(pageId) {
    if (!state.pagesConfig[pageId]) return;
    state.pagesConfig[pageId].sections.push({ titleEn: '', titleFr: '', bodyEn: '', bodyFr: '', image: '', showContact: false });
    saveState(); renderSidebar(); renderPageEditor(pageId);
}
function removePageSection(pageId, i) {
    if (!confirm('Supprimer cette section ?')) return;
    state.pagesConfig[pageId].sections.splice(i, 1);
    saveState(); renderSidebar(); renderPageEditor(pageId);
}
function movePageSection(pageId, i, dir) {
    const sections = state.pagesConfig[pageId]?.sections;
    if (!sections) return;
    const j = i + dir;
    if (j < 0 || j >= sections.length) return;
    [sections[i], sections[j]] = [sections[j], sections[i]];
    saveState(); renderPageEditor(pageId);
}

/* ── Import an entire folder into a gallery ── */
async function importFolderToGallery(id) {
    if (!window._siteRootHandle) {
        showToast('\u26a0\ufe0f Lie d\u2019abord le dossier site/ (bouton \uD83D\uDD34)', true);
        return;
    }
    const g = state.galleriesConfig[id];
    if (!g) return;

    /* Open folder picker */
    let sourceDir;
    try {
        sourceDir = await window.showDirectoryPicker({ mode: 'read' });
    } catch(e) {
        if (e.name !== 'AbortError') showToast('\u26a0\ufe0f ' + e.message, true);
        return;
    }

    const IMG_EXTS = new Set(['jpg','jpeg','png','gif','webp','avif']);

    /* Read all image files from source folder */
    const files = [];
    for await (const [fname, fh] of sourceDir.entries()) {
        if (fh.kind !== 'file') continue;
        if (IMG_EXTS.has(fname.split('.').pop().toLowerCase())) files.push({ name: fname, handle: fh });
    }
    if (files.length === 0) {
        showToast('\u26a0\ufe0f Aucune image (jpg, png, webp\u2026) dans ce dossier.', true);
        return;
    }
    files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

    showToast('\u23f3 Import de ' + files.length + ' image(s)\u2026');

    /* Get / create destination directory inside site-v1 */
    /* g.path example: "images/portrait" */
    const pathParts = g.path.replace(/\/+$/, '').split('/').filter(Boolean);
    let destDir;
    try {
        let dir = window._siteRootHandle;
        for (const part of pathParts) dir = await dir.getDirectoryHandle(part, { create: true });
        destDir = dir;
    } catch(e) {
        showToast('\u26a0\ufe0f Impossible de cr\u00e9er le dossier destination\u00a0: ' + e.message, true);
        return;
    }

    /* Copy files */
    let copied = 0, skipped = 0;
    const toAdd = [];
    for (const { name, handle } of files) {
        try {
            /* Check if already exists at destination */
            try { await destDir.getFileHandle(name); skipped++; toAdd.push(name); continue; }
            catch(e) { /* doesn't exist — copy it */ }
            const fileObj = await handle.getFile();
            const buf     = await fileObj.arrayBuffer();
            const destFile = await destDir.getFileHandle(name, { create: true });
            const writable = await destFile.createWritable();
            await writable.write(buf);
            await writable.close();
            copied++;
            toAdd.push(name);
        } catch(e) { console.warn('Import error:', name, e); }
    }

    /* Update admin state: add new filenames to images list */
    const existing    = state.galleriesConfig[id].images || [];
    const existingSet = new Set(existing.map(img => img.filename));
    let added = 0;
    for (const fname of toAdd) {
        if (!existingSet.has(fname)) {
            existing.push({ filename: fname, title: '', subtitle: '', captionFr: '', captionEn: '', btnLabel: 'En savoir plus', btnUrl: '' });
            added++;
        }
    }
    state.galleriesConfig[id].images = existing;

    saveState();
    renderGalleryEditor(id);
    autoSync(true);
    showToast('\u2705 ' + copied + ' copi\u00e9e(s) \u00b7 ' + skipped + ' d\u00e9j\u00e0 pr\u00e9sentes \u00b7 ' + added + ' ajout\u00e9e(s) \u00e0 la liste');
}

/* ═══════════════════════════════════════════════════════

═══════════════════════════════════════════════════════ */
let dragGallery = null, dragIdx = null;

function imgDragStart(e, galleryId, idx) {
    dragGallery = galleryId; dragIdx = idx;
    setTimeout(() => {
        const id2 = galleryId.replace(/[^a-z0-9]/gi,'_');
        document.getElementById(`card_${id2}_${idx}`)?.classList.add('dragging');
    }, 0);
}
function imgDragOver(e, galleryId, idx) {
    e.preventDefault();
    if (galleryId !== dragGallery) return;
    const id2 = galleryId.replace(/[^a-z0-9]/gi,'_');
    document.getElementById(`card_${id2}_${idx}`)?.classList.add('drag-over');
}
function imgDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function imgDrop(e, galleryId, idx) {
    e.preventDefault();
    if (dragGallery !== galleryId || dragIdx === null || dragIdx === idx) {
        dragGallery = null; dragIdx = null; return;
    }
    const imgs = state.galleriesConfig[galleryId].images;
    const [moved] = imgs.splice(dragIdx, 1);
    imgs.splice(idx, 0, moved);
    saveState();
    renderGalleryEditor(galleryId);
    dragGallery = null; dragIdx = null;
    showToast('Ordre mis \u00E0 jour');
}

let menuDragFrom = null;
function menuDragStart(i) { menuDragFrom = i; }
function menuDragOver(e, i) { e.preventDefault(); }
function menuDrop(i) {
    if (menuDragFrom === null || menuDragFrom === i) return;
    const [item] = state.menuConfig.splice(menuDragFrom, 1);
    state.menuConfig.splice(i, 0, item);
    saveState(); renderSidebar(); renderMenuEditor(); menuDragFrom = null;
}
function toggleMenuVisible(i, visible) {
    if (visible) {
        delete state.menuConfig[i].hidden;
    } else {
        state.menuConfig[i].hidden = true;
    }
    saveState();
    renderSidebar();
    if (state.activeTab === 'menu') renderMenuEditor();
}

/* ═══════════════════════════════════════════════════════
   IMPORT
═══════════════════════════════════════════════════════ */
function importConfig() {
    const input = document.createElement('input');
    input.type  = 'file';
    input.accept = '.js,.txt';
    input.onchange = async e => {
        const file = e.target.files[0];
        if (!file) return;
        const text = await file.text();
        try {
            parseAndLoadJS(text);
            saveState();
            renderSidebar();
            renderGalleryEditor(state.activeGallery);
            showToast('gallery.js import\u00E9 !');
        } catch(err) {
            showToast('Erreur\u00A0: ' + err.message, true);
        }
    };
    input.click();
}

function parseAndLoadJS(text) {
    /* GALLERIES_CONFIG */
    const gcMatch = text.match(/const GALLERIES_CONFIG\s*=\s*\{([\s\S]*?)\n\};/);
    if (gcMatch) {
        try {
            const fn = new Function('return {' + gcMatch[1] + '\n}');
            const imported = fn();
            for (const [id, cfg] of Object.entries(imported)) {
                if (!state.galleriesConfig[id]) {
                    /* Galerie présente dans gallery.js mais inconnue de l'admin —
                       on la crée pour que l'admin reflète le vrai site. */
                    state.galleriesConfig[id] = {
                        images: [], hidden: !!(cfg.hidden), autoplay: !!(cfg.autoplay),
                        autoplayDelay: cfg.autoplayDelay || 4,
                        path: cfg.path || ('images/' + id),
                        cartons: [], custom: true
                    };
                }
                const sg = state.galleriesConfig[id];
                /* Legacy description/cta → preserved as-is for migration in loadState() */
                if (cfg.description) { sg.descFr = cfg.description.fr||sg.descFr||''; sg.descEn = cfg.description.en||sg.descEn||''; }
                if (cfg.cta)         { sg.ctaFr  = cfg.cta.fr ||sg.ctaFr ||''; sg.ctaEn  = cfg.cta.en ||sg.ctaEn ||''; }
                /* New cartons array */
                if (cfg.cartons && Array.isArray(cfg.cartons)) { sg.cartons = cfg.cartons; }
                if (cfg.featured)    { sg.featured = cfg.featured; }
                if (cfg.captions) {
                    (sg.images||[]).forEach(img => {
                        const cap = cfg.captions[img.filename];
                        if (cap) { img.captionFr = cap.fr||img.captionFr||''; img.captionEn = cap.en||img.captionEn||''; }
                    });
                }
                if (cfg.buttons) {
                    (sg.images||[]).forEach(img => {
                        const btn = cfg.buttons[img.filename];
                        if (btn) { img.btnLabel = btn.label||img.btnLabel||'En savoir plus'; img.btnUrl = btn.url||img.btnUrl||''; }
                    });
                }
                if (id === 'accueil' && cfg.images) {
                    sg.images = cfg.images.map(img => ({
                        filename: img.filename||'', label: img.label||'', link_gallery: img.link_gallery||'',
                        captionFr: (img.caption&&img.caption.fr)||'', captionEn: (img.caption&&img.caption.en)||''
                    }));
                }
                if (cfg.images && id !== 'accueil' && !GALLERY_META[id]?.autoScan) {
                    /* Non-destructive merge: fill empty admin fields from file,
                       never overwrite data the admin already has.
                       Also add images present in file but missing from admin. */
                    const adminMap = {};
                    (sg.images||[]).forEach(img => { adminMap[img.filename] = img; });
                    cfg.images.forEach(fileImg => {
                        const fFr  = (fileImg.caption&&fileImg.caption.fr) || fileImg.captionFr || '';
                        const fEn  = (fileImg.caption&&fileImg.caption.en) || fileImg.captionEn || '';
                        const fBtnUrl   = (fileImg.button&&fileImg.button.url)   || fileImg.btnUrl   || '';
                        const fBtnLabel = (fileImg.button&&fileImg.button.label) || fileImg.btnLabel || 'En savoir plus';
                        const adminImg = adminMap[fileImg.filename];
                        if (adminImg) {
                            /* Only fill fields that admin left blank */
                            if (!adminImg.captionFr && fFr) adminImg.captionFr = fFr;
                            if (!adminImg.captionEn && fEn) adminImg.captionEn = fEn;
                            if (!adminImg.title    && fileImg.title)    adminImg.title    = fileImg.title;
                            if (!adminImg.subtitle && fileImg.subtitle) adminImg.subtitle = fileImg.subtitle;
                            if (!adminImg.btnUrl   && fBtnUrl)          { adminImg.btnUrl = fBtnUrl; adminImg.btnLabel = fBtnLabel; }
                            if (!adminImg.audio    && fileImg.audio)    adminImg.audio    = fileImg.audio;
                            if (adminImg.audio && fileImg.audioAutoplay !== undefined && adminImg.audioAutoplay === undefined)
                                adminImg.audioAutoplay = fileImg.audioAutoplay;
                        } else {
                            /* Image in file not yet in admin — add it */
                            sg.images = sg.images || [];
                            sg.images.push({
                                filename: fileImg.filename||'', title: fileImg.title||'', subtitle: fileImg.subtitle||'',
                                captionFr: fFr, captionEn: fEn,
                                btnLabel: fBtnLabel, btnUrl: fBtnUrl,
                                ...(fileImg.audio ? { audio: fileImg.audio } : {}),
                                ...(fileImg.audio && fileImg.audioAutoplay !== undefined ? { audioAutoplay: fileImg.audioAutoplay } : {})
                            });
                        }
                    });
                }
            }
        } catch(e) { console.warn('GALLERIES_CONFIG parse error:', e); }
    }
    /* GALLERY_IMAGES */
    const giMatch = text.match(/const GALLERY_IMAGES\s*=\s*\{([\s\S]*?)\n\};/);
    if (giMatch) {
        try {
            const fn = new Function('return {' + giMatch[1] + '\n}');
            const gi = fn();
            for (const [id, imgs] of Object.entries(gi)) {
                if (!state.galleriesConfig[id] || !GALLERY_META[id]?.autoScan) continue;
                const existing = state.galleriesConfig[id].images || [];
                const existingMap = {};
                existing.forEach(img => { existingMap[img.filename] = img; });
                state.galleriesConfig[id].images = imgs.map(img => {
                    return existingMap[img.filename] || { filename: img.filename, captionEn: '', captionFr: '', btnLabel: 'En savoir plus', btnUrl: '' };
                });
            }
        } catch(e) { console.warn('GALLERY_IMAGES parse error:', e); }
    }
    /* MENU_CONFIG */
    const mcMatch = text.match(/const MENU_CONFIG\s*=\s*(\[[\s\S]*?\]);/);
    if (mcMatch) {
        try { state.menuConfig = new Function('return ' + mcMatch[1])(); }
        catch(e) { console.warn('MENU_CONFIG parse error:', e); }
    }
    /* PAGES_CONFIG */
    const pcMatch = text.match(/const PAGES_CONFIG\s*=\s*(\{[\s\S]*?\n\});/);
    if (pcMatch) {
        try {
            const pc = new Function('return ' + pcMatch[1])();
            state.pagesConfig = { ...DEFAULT_STATE.pagesConfig, ...pc };
        } catch(e) { console.warn('PAGES_CONFIG parse error:', e); }
    }
    /* SITE_CONFIG */
    const scMatch = text.match(/const SITE_CONFIG\s*=\s*\{([\s\S]*?)\n\};/);
    if (scMatch) {
        try {
            const sc = new Function('return {' + scMatch[1] + '\n}')();
            if (sc.name)        state.settings.siteName    = sc.name;
            if (sc.defaultLang) state.settings.defaultLang = sc.defaultLang;
            if (sc.showLanding !== undefined) state.settings.showLanding = sc.showLanding;
            if (sc.landingImage) state.settings.landingImage = sc.landingImage;
            if (sc.social) {
                if (sc.social.instagram) state.settings.instagram = sc.social.instagram;
                if (sc.social.facebook)  state.settings.facebook  = sc.social.facebook;
                if (sc.social.linkedin)  state.settings.linkedin  = sc.social.linkedin;
            }
        } catch(e) { console.warn('SITE_CONFIG parse error:', e); }
    }
}

        return;
    }
    showToast('📂 Sélectionne la RACINE du site : le dossier site-v1/ (celui qui contient index.html et le dossier js/)');
    try {
        const picked = await window.showDirectoryPicker({
            mode: 'readwrite',
            // If already linked, re-open starting inside that folder's parent
            ...(window._siteRootHandle ? { startIn: window._siteRootHandle } : {})
        });
        /* Validate: must contain BOTH index.html AND a js/ subfolder */
        let jsDir = null;
        try {
            await picked.getFileHandle('index.html');
        } catch(e) {
            showToast('⚠️ Ce dossier ne contient pas index.html — sélectionne la RACINE site-v1/, pas un sous-dossier.');

        try {

            return;
        }
        window._siteRootHandle = picked;
        window._jsDirHandle = jsDir;
        updateSyncBtn(true);
        /* Persist handle in IDB so it survives page reload */
        await idbSet('siteRootHandle', picked);
        /* ── IMPORTANT: import existing gallery.js BEFORE overwriting it ──
           This preserves captions/data that exist only in the file (not yet
           in admin localStorage state), so they aren't wiped by autoSync.  */
        try {
            const existingH    = await jsDir.getFileHandle('gallery.js');
            const existingFile = await existingH.getFile();
            const existingText = await existingFile.text();
            parseAndLoadJS(existingText);
            /* Sauvegarde localStorage UNIQUEMENT — on n'appelle PAS autoSync ici
               pour ne pas réécrire le gallery.js qu'on vient de lire depuis le disque.
               L'utilisateur voit le vrai état du site. autoSync se déclenchera
               seulement lors de la prochaine modification dans l'admin. */
            localStorage.setItem('bertrandAdminV4', JSON.stringify(state));
            renderSidebar();
            renderGalleryEditor(state.activeGallery);
            showToast('✅ Racine liée — galeries chargées depuis le site !');
        } catch(e) { /* gallery.js introuvable — skip import */
            showToast('✅ Racine liée ! Mémorisée pour les prochaines fois.');
        }
    } catch(e) {
        if (e.name !== 'AbortError') showToast('Erreur : ' + e.message);
    }
}

/* ═══════════════════════════════════════════════════════
   INDEXEDDB — persistance dossier + config GitHub
   (plus fiable que localStorage pour file:// dans Safari)
═══════════════════════════════════════════════════════ */
const IDB_NAME  = 'bertrandAdminDB';
const IDB_STORE = 'kv';

function idbOpen() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
        req.onsuccess  = e => resolve(e.target.result);
        req.onerror    = () => reject(req.error);
    });
}
async function idbSet(key, value) {
    try {
        const db = await idbOpen();
        await new Promise((res, rej) => {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put(value, key);
            tx.oncomplete = res;
            tx.onerror = () => rej(tx.error);
        });
    } catch(e) { /* silently ignore — fallback to localStorage */ }
}
async function idbGet(key) {
    try {
        const db = await idbOpen();
        return await new Promise((res, rej) => {
            const tx  = db.transaction(IDB_STORE, 'readonly');
            const req = tx.objectStore(IDB_STORE).get(key);
            req.onsuccess = () => res(req.result);
            req.onerror   = () => rej(req.error);
        });
    } catch(e) { return null; }
}

/* Restore saved directory handle (called at page load) */
async function tryRestoreSiteRoot() {
    try {
        const handle = await idbGet('siteRootHandle');
        if (!handle) return;
        const perm = await handle.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') return;
        window._siteRootHandle = handle;
        window._jsDirHandle    = await handle.getDirectoryHandle('js').catch(() => null);
        /* Import existing gallery.js to recover any data not in admin state
           (same protection as linkJsFolder — prevents silent caption loss) */
        if (window._jsDirHandle) {
            try {
                const existingH    = await window._jsDirHandle.getFileHandle('gallery.js');
                const existingFile = await existingH.getFile();
                const existingText = await existingFile.text();
                parseAndLoadJS(existingText);
                /* localStorage uniquement — pas d'autoSync pour ne pas
                   réécrire gallery.js avec l'état admin au lieu du vrai fichier */
                localStorage.setItem('bertrandAdminV4', JSON.stringify(state));
                renderSidebar();
                renderGalleryEditor(state.activeGallery);
            } catch(e) { /* gallery.js missing or unreadable — skip */ }
        }
        updateSyncBtn(true);
        showToast('\uD83D\uDCC2 Dossier site/ restaur\u00e9 — galeries synchronis\u00e9es');
    } catch(e) { /* ignore — user will link manually */ }
}

const GH_STORAGE_KEY = 'bertrandGithubV1';

function loadGhConfig() {
    /* Try localStorage → sessionStorage fallback */
    try {
        const ls = JSON.parse(localStorage.getItem(GH_STORAGE_KEY));
        if (ls?.token) return ls;
    } catch(e) {}
    try {
        const ss = JSON.parse(sessionStorage.getItem(GH_STORAGE_KEY));
        if (ss?.token) return ss;
    } catch(e) {}
    return {};
}
async function saveGhConfig(cfg) {
    const json = JSON.stringify(cfg);
    localStorage.setItem(GH_STORAGE_KEY, json);
    sessionStorage.setItem(GH_STORAGE_KEY, json);  /* survit aux rechargements de page */
    await idbSet('ghConfig', cfg);   /* persist en IDB = survit aux fermetures Chrome */
    updateGhStatus();
}

/* Met à jour l'icône 🔑 selon que le token est configuré ou non */

}

async function ghGetSha(cfg, filePath) {
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${filePath}?ref=${cfg.branch}`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${cfg.token}`, 'X-GitHub-Api-Version': '2022-11-28' } });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`GitHub ${res.status}`);
    return (await res.json()).sha;
}

async function ghPutFile(cfg, filePath, content, sha, message) {
    const body = { message, branch: cfg.branch, content: btoa(unescape(encodeURIComponent(content))) };
    if (sha) body.sha = sha;
    const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${filePath}`, {
        method: 'PUT',
        headers: { Authorization: `Bearer ${cfg.token}`, 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
        body: JSON.stringify(body)
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(`GitHub ${res.status}: ${err.message || res.statusText}`);
    }
    return await res.json();
}

/* Read a text file from a FileSystemDirectoryHandle */
async function readFileFromDir(dirHandle, filename) {
    try {
        const fh = await dirHandle.getFileHandle(filename);
        const file = await fh.getFile();
        return await file.text();
    } catch(e) { return null; }
}

async function readFileFromSubDir(dirHandle, subdir, filename) {
    try {
        const sub = await dirHandle.getDirectoryHandle(subdir);
        const fh  = await sub.getFileHandle(filename);
        const file = await fh.getFile();
        return await file.text();
    } catch(e) { return null; }
}

/* Try to read a static file: File System API first, fetch() fallback */
async function readStaticFile(relPath) {
    /* 1. Try from linked root handle */
    if (window._siteRootHandle) {
        const parts = relPath.split('/');
        if (parts.length === 1) {
            const c = await readFileFromDir(window._siteRootHandle, parts[0]);
            if (c) return c;
        } else {
            const c = await readFileFromSubDir(window._siteRootHandle, parts[0], parts[1]);
            if (c) return c;
        }
    }
    /* 2. Try via fetch() — works when served over http(s), not file:// */
    try {
        const r = await fetch('./' + relPath);
        if (r.ok) return await r.text();
    } catch(e) { /* ignore */ }
    return null;
}

/* Link root folder on demand (called when no root handle available at publish time) */
