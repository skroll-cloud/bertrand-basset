<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ange Marine — Sélection · Bertrand Basset</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo-b.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --noir: #111; --blanc: #fff; --gris: #888; --ligne: #e0e0e0;
      --ocre: #c8913a; --font: 'IBM Plex Sans', system-ui, sans-serif;
    }
    html, body { font-family: var(--font); background: var(--noir); color: var(--blanc); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    .app-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(17,17,17,0.96); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex; align-items: center; gap: 1.5rem; padding: 0.9rem 2rem;
    }
    .header-brand { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; text-decoration: none; opacity: 0.55; transition: opacity 0.15s; }
    .header-brand:hover { opacity: 1; }
    .header-brand img { width: 14px; height: 14px; filter: invert(1); }
    .header-sep { width: 1px; height: 1.4rem; background: rgba(255,255,255,0.12); flex-shrink: 0; }
    .header-left { display: flex; flex-direction: column; gap: 0.12rem; flex: 1; }
    .header-shooting { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gris); }
    .header-right { display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
    .sel-count { font-size: 0.62rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gris); transition: color 0.2s; }
    .sel-count.active { color: var(--ocre); }
    .btn-envoyer { padding: 0.6rem 1.2rem; background: var(--ocre); color: var(--noir); font-family: var(--font); font-size: 0.6rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; border: none; cursor: pointer; opacity: 0.4; pointer-events: none; transition: opacity 0.2s; }
    .btn-envoyer.active { opacity: 1; pointer-events: auto; }

    .galerie { padding: 2rem; }
    .section { margin-bottom: 3rem; }
    .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1rem; padding-bottom: 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .section-nom { font-size: 0.62rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gris); }
    .section-titre { font-size: 1rem; font-weight: 300; }
    .section-actions { display: flex; gap: 1rem; }
    .btn-tout { font-size: 0.52rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gris); background: none; border: none; cursor: pointer; font-family: var(--font); transition: color 0.15s; }
    .btn-tout:hover { color: var(--blanc); }

    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 3px; }
    .photo-item { position: relative; aspect-ratio: 3/2; overflow: hidden; cursor: pointer; background: #1a1a1a; }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease; }
    .photo-item:hover img { transform: scale(1.03); }
    .photo-item .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0); transition: background 0.2s; display: flex; align-items: flex-end; justify-content: space-between; padding: 0.5rem; }
    .photo-item:hover .overlay { background: rgba(0,0,0,0.15); }
    .photo-item.selected .overlay { background: rgba(200,145,58,0.25); }
    .photo-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.6); background: transparent; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
    .photo-check svg { display: none; }
    .photo-item.selected .photo-check { background: var(--ocre); border-color: var(--ocre); }
    .photo-item.selected .photo-check svg { display: block; }
    .photo-num { font-size: 0.52rem; letter-spacing: 0.08em; color: rgba(255,255,255,0.5); background: rgba(0,0,0,0.4); padding: 0.2rem 0.4rem; border-radius: 2px; }

    .empty-section { padding: 3rem 0; text-align: center; color: rgba(255,255,255,0.2); font-size: 0.78rem; font-weight: 300; letter-spacing: 0.06em; }

    #panel { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.7); display: none; align-items: stretch; justify-content: flex-end; }
    #panel.open { display: flex; }
    .panel-inner { width: min(420px, 100vw); background: #1a1a1a; display: flex; flex-direction: column; animation: slideIn 0.25s ease; }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .panel-head { padding: 1.5rem 1.5rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: space-between; }
    .panel-titre { font-size: 0.88rem; font-weight: 400; }
    .panel-close { background: none; border: none; color: var(--gris); cursor: pointer; font-size: 1.2rem; font-family: var(--font); line-height: 1; }
    .panel-body { flex: 1; overflow-y: auto; padding: 1.2rem 1.5rem; }
    .panel-sel-count { font-size: 0.62rem; color: var(--gris); margin-bottom: 1.2rem; }
    .panel-sel-list { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 1.5rem; }
    .panel-sel-section { font-size: 0.52rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ocre); margin-top: 0.8rem; margin-bottom: 0.3rem; }
    .panel-sel-item { font-size: 0.75rem; font-weight: 300; color: rgba(255,255,255,0.7); }
    .panel-form { display: flex; flex-direction: column; gap: 0.8rem; border-top: 1px solid rgba(255,255,255,0.07); padding-top: 1.2rem; }
    .panel-label { font-size: 0.52rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gris); margin-bottom: 0.3rem; display: block; }
    .panel-input, .panel-textarea { width: 100%; padding: 0.75rem 0.9rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--blanc); font-family: var(--font); font-size: 0.8rem; font-weight: 300; outline: none; border-radius: 0; transition: border-color 0.2s; }
    .panel-input:focus, .panel-textarea:focus { border-color: var(--ocre); }
    .panel-textarea { resize: vertical; min-height: 80px; }
    .panel-submit { padding: 0.9rem; background: var(--ocre); color: var(--noir); font-family: var(--font); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; border: none; cursor: pointer; transition: opacity 0.2s; margin-top: 0.4rem; }
    .panel-submit:hover { opacity: 0.85; }
    .panel-note { font-size: 0.6rem; color: var(--gris); line-height: 1.6; }

    #lightbox { position: fixed; inset: 0; z-index: 300; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; }
    #lightbox.open { display: flex; }
    .lb-stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .lb-img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; user-select: none; }
    .lb-topbar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.2rem; background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%); position: absolute; top: 0; left: 0; z-index: 10; }
    .lb-title { font-size: 0.65rem; font-weight: 300; letter-spacing: 0.1em; color: rgba(255,255,255,0.6); }
    .lb-topbar-right { display: flex; align-items: center; gap: 0.8rem; }
    .lb-fs-btn { background: none; border: none; color: rgba(255,255,255,0.5); cursor: pointer; padding: 0.3rem; transition: color 0.15s; line-height: 0; }
    .lb-fs-btn:hover { color: #fff; }
    .lb-fs-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .lb-close { background: none; border: none; color: rgba(255,255,255,0.5); font-size: 1.6rem; cursor: pointer; font-family: var(--font); line-height: 1; transition: color 0.15s; padding: 0.1rem; }
    .lb-close:hover { color: #fff; }
    .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.07); border: none; color: rgba(255,255,255,0.55); font-size: 1.6rem; cursor: pointer; padding: 1.2rem 0.9rem; font-family: var(--font); transition: background 0.15s, color 0.15s; line-height: 1; z-index: 10; }
    .lb-nav:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .lb-prev { left: 0; border-radius: 0 3px 3px 0; }
    .lb-next { right: 0; border-radius: 3px 0 0 3px; }
    .lb-bottombar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.5rem; background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%); position: absolute; bottom: 0; left: 0; z-index: 10; gap: 1rem; }
    .lb-counter { font-size: 0.62rem; color: rgba(255,255,255,0.35); letter-spacing: 0.06em; flex-shrink: 0; }
    .lb-sel-btn { padding: 0.6rem 1.8rem; font-family: var(--font); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: #fff; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
    .lb-sel-btn:hover { background: rgba(255,255,255,0.1); }
    .lb-sel-btn.selected { background: var(--ocre); border-color: var(--ocre); color: var(--noir); }
    .lb-hint { font-size: 0.55rem; color: rgba(255,255,255,0.2); letter-spacing: 0.06em; text-align: center; flex: 1; }

    #success { position: fixed; inset: 0; z-index: 400; background: var(--noir); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; text-align: center; padding: 2rem; }
    #success.open { display: flex; }
    .success-check { width: 50px; height: 50px; border: 1.5px solid var(--ocre); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .success-check svg { width: 20px; height: 20px; stroke: var(--ocre); }
    .success-titre { font-size: 1.6rem; font-weight: 300; letter-spacing: -0.02em; }
    .success-msg { font-size: 0.78rem; font-weight: 300; color: var(--gris); line-height: 1.8; max-width: 320px; }

    @media (max-width: 600px) {
      .app-header { padding: 0.8rem 1rem; }
      .galerie { padding: 1rem; }
      .photo-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px; }
      .section-header { flex-direction: column; gap: 0.4rem; }
    }
  </style>
</head>
<body>

<header class="app-header">
  <a href="index.html" class="header-brand" title="Retour aux galeries">
    <img src="../assets/logo-b.svg" alt="B">
  </a>
  <div class="header-sep"></div>
  <div class="header-left">
    <span class="header-shooting">Sélection · Ange Marine</span>
  </div>
  <div class="header-right">
    <span class="sel-count" id="selCount">0 photo sélectionnée</span>
    <button class="btn-envoyer" id="btnEnvoyer" onclick="openPanel()">Envoyer ma sélection →</button>
  </div>
</header>

<main class="galerie" id="galerie"></main>

<div id="panel" onclick="panelBgClick(event)">
  <div class="panel-inner">
    <div class="panel-head">
      <span class="panel-titre">Ma sélection</span>
      <button class="panel-close" onclick="closePanel()">×</button>
    </div>
    <div class="panel-body">
      <p class="panel-sel-count" id="panelCount"></p>
      <div class="panel-sel-list" id="panelList"></div>
      <div class="panel-form">
        <div>
          <label class="panel-label">Votre prénom</label>
          <input type="text" class="panel-input" id="clientNom" placeholder="Ex. : Marie">
        </div>
        <div>
          <label class="panel-label">Message (facultatif)</label>
          <textarea class="panel-textarea" id="clientMsg" placeholder="Une précision sur votre sélection…"></textarea>
        </div>
        <button class="panel-submit" onclick="envoyer()">Envoyer ma sélection</button>
        <p class="panel-note">Votre sélection sera envoyée à Bertrand Basset par email.</p>
      </div>
    </div>
  </div>
</div>

<div id="lightbox">
  <div class="lb-topbar">
    <span class="lb-title" id="lbTitle"></span>
    <div class="lb-topbar-right">
      <button class="lb-fs-btn" id="lbFsBtn" onclick="lbToggleFs()" title="Plein écran">
        <svg id="lbFsIcon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button class="lb-close" onclick="closeLb()">×</button>
    </div>
  </div>
  <div class="lb-stage" id="lbStage">
    <button class="lb-nav lb-prev" onclick="lbNav(-1)">‹</button>
    <img class="lb-img" id="lbImg" src="" alt="">
    <button class="lb-nav lb-next" onclick="lbNav(1)">›</button>
  </div>
  <div class="lb-bottombar">
    <span class="lb-counter" id="lbCounter"></span>
    <button class="lb-sel-btn" id="lbSelBtn" onclick="lbToggleSel()">Sélectionner</button>
    <span class="lb-hint">← → naviguer · S sélectionner · Esc fermer</span>
  </div>
</div>

<div id="success">
  <div class="success-check">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,6 9,17 4,12"/></svg>
  </div>
  <h2 class="success-titre">Sélection envoyée</h2>
  <p class="success-msg">Merci ! Bertrand Basset a reçu votre sélection et reviendra vers vous très vite.</p>
</div>

<script>
const SECTIONS = [
  { id: "ange-marine", nom: "Ange Marine", titre: "", folder: "ange-marine", photos: ["L1060508.jpg"] }
];
const NOTIF_EMAIL = 'yellowshoesstudio@gmail.com';
const GALLERY_TITLE = "Ange Marine";

const selected = new Set();
let lbPhoto = 0;
const allPhotos = [];
SECTIONS.forEach((sec) => {
  sec.photos.forEach((p) => {
    allPhotos.push({ sid: sec.id, nom: sec.nom, titre: sec.titre, file: p, folder: sec.folder });
  });
});

function photoId(folder, file) { return folder + '||' + file; }
function photoLabel(filename) {
  const m = filename.match(/(\d+)[^\d]*\.jpg$/i);
  return m ? `Photo ${m[1]}` : filename.replace(/\.jpg$/i,'').substring(0,20);
}
function enc(s) { return encodeURIComponent(s); }

function buildGallery() {
  const container = document.getElementById('galerie');
  SECTIONS.forEach((sec, si) => {
    const secEl = document.createElement('div');
    secEl.className = 'section';
    const headerTitle = sec.titre ? `<span class="section-titre"> — ${sec.titre}</span>` : '';
    const actionsHtml = sec.photos.length > 0 ? `
      <div class="section-actions">
        <button class="btn-tout" onclick="selectAll(${si})">Tout sélectionner</button>
        <button class="btn-tout" onclick="deselectAll(${si})">Tout désélectionner</button>
      </div>` : '';
    secEl.innerHTML = `
      <div class="section-header">
        <div><span class="section-nom">${sec.nom}</span>${headerTitle}</div>
        ${actionsHtml}
      </div>
      <div class="photo-grid" id="grid-${si}">
        ${sec.photos.length === 0 ? '<div class="empty-section">Photos à venir</div>' : ''}
      </div>`;
    container.appendChild(secEl);
    if (sec.photos.length === 0) return;
    const grid = secEl.querySelector(`#grid-${si}`);
    sec.photos.forEach((file) => {
      const flat = allPhotos.findIndex(p => p.folder === sec.folder && p.file === file);
      const id = photoId(sec.folder, file);
      const src = `${sec.folder}/${enc(file)}`;
      const item = document.createElement('div');
      item.className = 'photo-item';
      item.dataset.id = id;
      item.innerHTML = `
        <img src="${src}" alt="${photoLabel(file)}" loading="lazy">
        <div class="overlay">
          <div class="photo-check">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><polyline points="20,6 9,17 4,12"/></svg>
          </div>
          <span class="photo-num">${photoLabel(file)}</span>
        </div>`;
      item.addEventListener('click', () => openLb(flat));
      grid.appendChild(item);
    });
  });
}

function togglePhoto(id, el) {
  if (selected.has(id)) { selected.delete(id); el?.classList.remove('selected'); }
  else { selected.add(id); el?.classList.add('selected'); }
  updateCounter();
}
function selectAll(si) {
  SECTIONS[si].photos.forEach(f => {
    const id = photoId(SECTIONS[si].folder, f);
    selected.add(id);
    document.querySelector(`[data-id="${CSS.escape(id)}"]`)?.classList.add('selected');
  }); updateCounter();
}
function deselectAll(si) {
  SECTIONS[si].photos.forEach(f => {
    const id = photoId(SECTIONS[si].folder, f);
    selected.delete(id);
    document.querySelector(`[data-id="${CSS.escape(id)}"]`)?.classList.remove('selected');
  }); updateCounter();
}
function updateCounter() {
  const n = selected.size;
  const txt = n===0?'0 photo sélectionnée':n===1?'1 photo sélectionnée':`${n} photos sélectionnées`;
  document.getElementById('selCount').textContent = txt;
  document.getElementById('selCount').classList.toggle('active', n>0);
  document.getElementById('btnEnvoyer').classList.toggle('active', n>0);
}

function openLb(flatIdx) {
  lbPhoto = flatIdx; renderLb();
  document.getElementById('lightbox').classList.add('open');
  document.addEventListener('keydown', lbKeydown);
}
function closeLb() {
  document.getElementById('lightbox').classList.remove('open');
  document.removeEventListener('keydown', lbKeydown);
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
function lbKeydown(e) {
  if (e.key==='ArrowLeft') lbNav(-1);
  else if (e.key==='ArrowRight') lbNav(1);
  else if (e.key==='Escape') closeLb();
  else if (e.key==='s'||e.key==='S') lbToggleSel();
}
function lbNav(dir) { lbPhoto=(lbPhoto+dir+allPhotos.length)%allPhotos.length; renderLb(); }
function renderLb() {
  const p = allPhotos[lbPhoto];
  document.getElementById('lbImg').src = `${p.folder}/${enc(p.file)}`;
  document.getElementById('lbTitle').textContent = p.nom + (p.titre ? ' — ' + p.titre : '');
  document.getElementById('lbCounter').textContent = `${lbPhoto+1} / ${allPhotos.length}`;
  const id = photoId(p.folder, p.file);
  const btn = document.getElementById('lbSelBtn');
  btn.textContent = selected.has(id) ? 'Désélectionner' : 'Sélectionner';
  btn.classList.toggle('selected', selected.has(id));
  updateFsIcon();
}
function lbToggleSel() {
  const p = allPhotos[lbPhoto];
  const id = photoId(p.folder, p.file);
  togglePhoto(id, document.querySelector(`[data-id="${CSS.escape(id)}"]`));
  renderLb();
}
function lbToggleFs() {
  const lb = document.getElementById('lightbox');
  if (!document.fullscreenElement) lb.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}
function updateFsIcon() {
  const icon = document.getElementById('lbFsIcon');
  if (document.fullscreenElement)
    icon.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>';
  else
    icon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>';
}
document.addEventListener('fullscreenchange', updateFsIcon);

function openPanel() { if (selected.size===0) return; buildPanelList(); document.getElementById('panel').classList.add('open'); }
function closePanel() { document.getElementById('panel').classList.remove('open'); }
function panelBgClick(e) { if (e.target===document.getElementById('panel')) closePanel(); }
function buildPanelList() {
  const n = selected.size;
  document.getElementById('panelCount').textContent = `${n} photo${n>1?'s':''} sélectionnée${n>1?'s':''}`;
  const list = document.getElementById('panelList');
  list.innerHTML = '';
  SECTIONS.forEach(sec => {
    const items = sec.photos.filter(f => selected.has(photoId(sec.folder, f)));
    if (!items.length) return;
    const lbl = document.createElement('div'); lbl.className='panel-sel-section';
    lbl.textContent = sec.nom + (sec.titre ? ' — '+sec.titre : ''); list.appendChild(lbl);
    items.forEach(f => {
      const d = document.createElement('div'); d.className='panel-sel-item';
      d.textContent = '· '+photoLabel(f); list.appendChild(d);
    });
  });
}
function envoyer() {
  const nom = document.getElementById('clientNom').value.trim() || 'Client';
  const msg = document.getElementById('clientMsg').value.trim();
  let lines = [`Bonjour Bertrand,\n\nVoici ma sélection pour la galerie ${GALLERY_TITLE} :\n`];
  SECTIONS.forEach(sec => {
    const items = sec.photos.filter(f => selected.has(photoId(sec.folder, f)));
    if (!items.length) return;
    lines.push(`\n${sec.nom}${sec.titre?' — '+sec.titre:''} :`);
    items.forEach(f => lines.push(`  · ${photoLabel(f)}`));
  });
  if (msg) lines.push(`\n\nMessage : ${msg}`);
  lines.push(`\n\n— ${nom}`);
  const subject = `Sélection ${GALLERY_TITLE} — ${nom} (${selected.size} photo${selected.size>1?'s':''})`;
  window.location.href = `mailto:${NOTIF_EMAIL}?subject=${enc(subject)}&body=${enc(lines.join('\n'))}`;
  setTimeout(() => { closePanel(); document.getElementById('success').classList.add('open'); }, 800);
}

buildGallery();
</script>
</body>
</html>
