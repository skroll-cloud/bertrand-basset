<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imène — Bertrand Basset</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo-b.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--noir:#111;--blanc:#fff;--gris:#888;--ocre:#c8913a;--font:'IBM Plex Sans',system-ui,sans-serif;}
    html,body{font-family:var(--font);background:var(--noir);color:var(--blanc);min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
    .app-header{position:sticky;top:0;z-index:50;background:rgba(17,17,17,0.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:1.5rem;padding:0.9rem 2rem;}
    .header-brand{display:flex;align-items:center;gap:0.5rem;flex-shrink:0;text-decoration:none;opacity:0.55;transition:opacity 0.15s;}
    .header-brand:hover{opacity:1;}
    .header-brand img{width:14px;height:14px;filter:invert(1);}
    .header-sep{width:1px;height:1.4rem;background:rgba(255,255,255,0.12);flex-shrink:0;}
    .header-shooting{font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gris);}
    .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:3rem;text-align:center;}
    .coming-icon{width:48px;height:48px;border:1px solid rgba(255,255,255,0.12);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;}
    .coming-icon svg{width:20px;height:20px;stroke:rgba(255,255,255,0.3);fill:none;stroke-width:1.5;stroke-linecap:round;}
    .coming-titre{font-size:1.4rem;font-weight:300;letter-spacing:-0.01em;}
    .coming-msg{font-size:0.72rem;font-weight:300;color:var(--gris);line-height:1.7;max-width:280px;}
    .coming-back{margin-top:1rem;font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.25);text-decoration:none;transition:color 0.15s;}
    .coming-back:hover{color:rgba(255,255,255,0.6);}
  </style>
</head>
<body>
<header class="app-header">
  <a href="index.html" class="header-brand"><img src="../assets/logo-b.svg" alt="B"></a>
  <div class="header-sep"></div>
  <span class="header-shooting">Imène</span>
</header>
<main class="main">
  <div class="coming-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg></div>
  <h1 class="coming-titre">Imène</h1>
  <p class="coming-msg">Cette galerie sera disponible prochainement.</p>
  <a href="index.html" class="coming-back">← Retour aux galeries</a>
</main>
</body>
</html>
