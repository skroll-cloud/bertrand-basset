<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bertrand Basset — Photographer & Filmmaker</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/logo-b.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css?v=20260526d">

    <!-- Open Graph -->
    <meta property="og:title" content="Bertrand Basset — Photographer & Filmmaker">
    <meta property="og:description" content="Portrait — Immersion — Conversation. Photographer and filmmaker based in Brittany.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bertrandbasset.com">
</head>
<body>
    <!-- GLOBAL LANG TOGGLE — fixed top-left on all pages -->
    <div id="globalLangToggle" class="global-lang-toggle">
        <a href="#" data-lang="fr" class="active">FR</a>
        <span>/</span>
        <a href="#" data-lang="en">EN</a>
    </div>

    <!-- LANDING PAGE -->
    <div class="landing" id="landing">
        <div class="landing-image">
            <img src="images/accueil/accueil-01.jpg" alt="Photography by Bertrand Basset">
        </div>
        <div class="landing-content">
            <div class="brand-wrapper">
                <div class="brand-block">
                    <div class="logo-b">
                        <img src="assets/logo-b.svg" alt="B">
                    </div>
                    <div class="brand-text">
                        <span class="brand-name">Bertrand Basset</span>
                        <span class="brand-subtitle">Photographer & Filmmaker</span>
                    </div>
                </div>
                <button class="enter-btn" id="enterBtn">Enter</button>
            </div>
        </div>
    </div>

    <!-- Flèche hint — visible sous le logo B quand sidebar réduite (desktop) -->
    <div id="sidebarHint" class="sidebar-hint">›</div>

    <!-- MAIN SITE -->
    <div class="site" id="site">
        <aside class="sidebar" id="sidebar">
            <!-- Rail (conservé pour structure) -->
            <div class="sidebar-rail" id="sidebarRail"></div>

            <div class="sidebar-inner">
                <header class="sidebar-header">
                    <a href="#" class="sidebar-brand" id="homeLink">
                        <img src="assets/logo-b.svg" alt="B" class="sidebar-logo">
                        <span class="sidebar-brand-name">Bertrand Basset</span>
                    </a>
                </header>

                <!-- Mobile menu toggle -->
                <button class="menu-toggle" id="menuToggle" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <!-- Nav principale (menu global) -->
                <nav class="main-nav" id="mainNav"></nav>

                <!-- Nav univers (remplace mainNav quand on entre dans une galerie) -->
                <nav class="universe-nav" id="universeNav" style="display:none"></nav>

                <!-- Gallery description zone -->
                <div id="galleryDesc" class="gallery-desc"></div>

            <footer class="sidebar-footer" id="sidebarFooter">
                <!-- Breadcrumb mobile : GALLERY / RÔLE / NOM — masqué sur desktop -->
                <div class="mobile-breadcrumb" id="mobileBreadcrumb"></div>

                <!-- Caption block: filled by JS showImageInfo() -->
                <div id="footerCaption" class="footer-caption-zone"></div>

                <!-- Separator line (always visible) -->
                <div class="footer-sep-line"></div>

                <!-- Audio player zone: always reserves fixed space -->
                <div id="audioPlayerZone" class="audio-player-zone"></div>

                <!-- Separator line (always visible) -->
                <div class="footer-sep-line"></div>

                <!-- Navigation -->
                <div class="gallery-footer-nav">
                    <div class="gallery-counter"></div>
                    <div class="gallery-nav">
                        <a href="#" id="prevBtn">prev</a>
                        <span>/</span>
                        <a href="#" id="nextBtn">next</a>
                    </div>
                    <button id="gridToggle" class="grid-toggle-btn" title="Voir toutes les photos">⊞</button>
                    <!-- Hamburger mobile — masqué sur desktop, EN/FR reste en haut à droite -->
                    <div id="mobileNavControls" class="mobile-nav-controls">
                        <a href="panier.html" class="mobile-cart-btn" id="mobileCartBtn" aria-label="Panier">
                            <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
                            <span class="cart-badge" id="mobileCartBadge"></span>
                        </a>
                        <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Menu" onclick="window.portfolio?.toggleMenu()">
                            <span></span><span></span><span></span>
                        </button>
                    </div>
                </div>
            </footer>
            </div><!-- /.sidebar-inner -->
        </aside>

        <main class="site-main">
            <div class="gallery-container" id="galleryContainer">
                <img src="images/accueil/accueil-01.jpg" alt="Portfolio" class="gallery-image loaded">
            </div>
        </main>

        <!-- Thumbnails Panel -->
        <div class="thumbnails-panel" id="thumbnailsPanel">
            <button class="thumbnails-close" id="thumbnailsClose">&times;</button>
            <div class="thumbnails-grid" id="thumbnailsGrid"></div>
        </div>
    </div>

    <!-- Boutique panel (slide from right, Dust'in Kolor) -->
    <div class="boutique-panel" id="boutiquePanel">
        <button class="boutique-close" id="boutiqueClose" onclick="window.portfolio?.closeBoutiquePanel()">&times;</button>
        <div class="boutique-panel-content" id="boutiquePanelContent"></div>
    </div>
    <div class="boutique-overlay" id="boutiqueOverlay" onclick="window.portfolio?.closeBoutiquePanel()"></div>

    <!-- Custom cursor -->
    <div class="custom-cursor" id="customCursor">
        <svg viewBox="0 0 24 24">
            <polyline points="9,6 15,12 9,18"></polyline>
        </svg>
    </div>

    <!-- Auto-generated image lists — run: node scan-galleries.js to refresh -->
    <script src="js/gallery-images.js?v=20260606b"></script>
    <!-- Données du site (config, galeries, textes) — géré via admin ou sur demande -->
    <script src="js/gallery-data.js?v=20260606c"></script>
    <!-- Moteur du site (Portfolio class) — géré par Claude -->
    <script src="js/gallery-engine.js?v=20260606b"></script>


</body>
</html>
