<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dust'in Kolor — Bertrand Basset</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo-b.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:      #0a0a0a;
      --white:      #fafafa;
      --gray:       #666;
      --dim:        #999;
      --border:     #e0e0e0;
      --red:        #c41e1e;
      --font:       'IBM Plex Sans', sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font);
      background: var(--white);
      color: var(--black);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font); cursor: pointer; border: none; background: none; }

    /* ── LAYOUT ── */
    .site {
      display: grid;
      grid-template-columns: 220px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      background: var(--white);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--black);
      margin-bottom: 2rem;
    }

    .sidebar-logo { width: 24px; height: 24px; }

    .sidebar-brand-name {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Série title */
    .serie-label {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 0.5rem;
    }

    .serie-title {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 1.8rem;
      font-style: italic;
    }

    /* Nav — liste des photos */
    .photo-nav {
      flex: 1;
      overflow-y: auto;
    }

    .photo-nav-item {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 0.3rem 0;
      cursor: pointer;
      transition: color 0.15s;
    }

    .photo-nav-item:hover { color: var(--red); }
    .photo-nav-item.active { color: var(--red); }

    .photo-nav-num {
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      color: var(--dim);
      flex-shrink: 0;
      width: 1.4rem;
    }
    .photo-nav-item.active .photo-nav-num { color: var(--red); }

    .photo-nav-title {
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    /* Sidebar footer */
    .sidebar-footer {
      margin-top: auto;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .photo-caption {
      font-size: 0.68rem;
      color: var(--gray);
      line-height: 1.5;
      margin-bottom: 1.2rem;
    }

    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-counter {
      font-size: 0.68rem;
      color: var(--dim);
    }

    .nav-arrows {
      display: flex;
      gap: 1rem;
      font-size: 0.72rem;
      color: var(--gray);
    }

    .nav-arrows a {
      transition: color 0.15s;
      letter-spacing: 0.05em;
    }
    .nav-arrows a:hover { color: var(--black); }

    .back-link {
      display: block;
      margin-top: 1.2rem;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--black); }

    /* ── MAIN PHOTO ── */
    .site-main {
      position: relative;
      overflow: hidden;
      background: #111;
    }

    .gallery-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .gallery-image.active {
      opacity: 1;
    }

    /* Lang toggle */
    .lang-toggle {
      position: fixed;
      top: 1.2rem;
      right: 1.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--dim);
      z-index: 50;
    }
    .lang-toggle a { color: var(--dim); transition: color 0.15s; }
    .lang-toggle a:hover, .lang-toggle a.active { color: var(--white); }
    .lang-toggle span { margin: 0 0.2rem; }
  </style>
</head>
<body>

  <div class="lang-toggle">
    <a href="#" class="active">FR</a><span>/</span><a href="#">EN</a>
  </div>

  <div class="site">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <a href="../" class="sidebar-brand">
        <img src="../assets/logo-b.svg" alt="B" class="sidebar-logo">
        <span class="sidebar-brand-name">Bertrand Basset</span>
      </a>

      <div class="serie-label">Série — 2016</div>
      <div class="serie-title">Dust'in Kolor</div>

      <nav class="photo-nav" id="photoNav">
        <div class="photo-nav-item active" data-index="0" onclick="showPhoto(0)">
          <span class="photo-nav-num">01</span>
          <span class="photo-nav-title">Sandstorm</span>
        </div>
        <div class="photo-nav-item" data-index="1" onclick="showPhoto(1)">
          <span class="photo-nav-num">02</span>
          <span class="photo-nav-title">Flying Car</span>
        </div>
        <div class="photo-nav-item" data-index="2" onclick="showPhoto(2)">
          <span class="photo-nav-num">03</span>
          <span class="photo-nav-title">After the Storm</span>
        </div>
        <div class="photo-nav-item" data-index="3" onclick="showPhoto(3)">
          <span class="photo-nav-num">04</span>
          <span class="photo-nav-title">Lost in the Dust</span>
        </div>
        <div class="photo-nav-item" data-index="4" onclick="showPhoto(4)">
          <span class="photo-nav-num">05</span>
          <span class="photo-nav-title">Camp Lighters</span>
        </div>
        <div class="photo-nav-item" data-index="5" onclick="showPhoto(5)">
          <span class="photo-nav-num">06</span>
          <span class="photo-nav-title">I'm Here</span>
        </div>
        <div class="photo-nav-item" data-index="6" onclick="showPhoto(6)">
          <span class="photo-nav-num">08</span>
          <span class="photo-nav-title">Umbrellas Way</span>
        </div>
      </nav>

      <footer class="sidebar-footer">
        <div class="photo-caption" id="caption">Désert du Nevada — Août 2016</div>
        <div class="nav-controls">
          <span class="nav-counter" id="counter">1 / 7</span>
          <div class="nav-arrows">
            <a href="#" id="prevBtn" onclick="prev(); return false;">prev</a>
            <span>/</span>
            <a href="#" id="nextBtn" onclick="next(); return false;">next</a>
          </div>
        </div>
        <a href="../" class="back-link">← Retour au site</a>
      </footer>

    </aside>

    <!-- MAIN PHOTO -->
    <main class="site-main" id="siteMain">
      <img class="gallery-image active" src="../images/dustin-kolor/01.jpg" alt="Sandstorm" data-index="0">
      <img class="gallery-image" src="../images/dustin-kolor/02.jpg" alt="Flying Car" data-index="1">
      <img class="gallery-image" src="../images/dustin-kolor/03.jpg" alt="After the Storm" data-index="2">
      <img class="gallery-image" src="../images/dustin-kolor/04.jpg" alt="Lost in the Dust" data-index="3">
      <img class="gallery-image" src="../images/dustin-kolor/05.jpg" alt="Camp Lighters" data-index="4">
      <img class="gallery-image" src="../images/dustin-kolor/06.jpg" alt="I'm Here" data-index="5">
      <img class="gallery-image" src="../images/dustin-kolor/08.jpg" alt="Umbrellas Way" data-index="6">
    </main>

  </div>

  <script>
    const TOTAL = 7;
    let current = 0;

    function showPhoto(i) {
      current = i;

      // Images
      document.querySelectorAll('.gallery-image').forEach(img => {
        img.classList.toggle('active', +img.dataset.index === i);
      });

      // Nav items
      document.querySelectorAll('.photo-nav-item').forEach(item => {
        item.classList.toggle('active', +item.dataset.index === i);
      });

      // Counter
      document.getElementById('counter').textContent = (i + 1) + ' / ' + TOTAL;
    }

    function prev() { showPhoto((current - 1 + TOTAL) % TOTAL); }
    function next() { showPhoto((current + 1) % TOTAL); }

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp')   prev();
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
    });
  </script>
</body>
</html>
