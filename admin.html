<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Bertrand Basset</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0a0a0a;
  --white: #fafafa;
  --gray:  #666;
  --dim:   #999;
  --light: #e0e0e0;
  --red:   #c41e1e;
  --green: #27ae60;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 300; font-size: 13px;
  color: var(--black); background: var(--white);
  -webkit-font-smoothing: antialiased;
}

/* ── Auth ─────────────────────────────────── */
.auth-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; }
.auth-box  { display:flex; flex-direction:column; align-items:center; gap:16px; width:260px; }
.auth-logo { font-size:28px; font-weight:400; letter-spacing:.08em; }
.auth-label { font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--gray); }
.auth-input {
  width:100%; padding:8px 12px; border:1px solid var(--light);
  font-family:inherit; font-size:13px; font-weight:300;
  background:transparent; color:var(--black); outline:none;
}
.auth-input:focus { border-color:var(--black); }
.auth-btn {
  width:100%; padding:8px; border:1px solid var(--black); background:transparent;
  font-family:inherit; font-size:9px; font-weight:400;
  letter-spacing:.15em; text-transform:uppercase; color:var(--black); cursor:pointer;
}
.auth-btn:hover { background:var(--black); color:var(--white); }
.auth-error { font-size:10px; color:var(--red); min-height:14px; text-align:center; }

/* ── Layout ───────────────────────────────── */
.admin-wrap { max-width:740px; margin:0 auto; padding:32px 24px 100px; }

.admin-header {
  display:flex; align-items:center; justify-content:space-between;
  padding-bottom:20px; border-bottom:1px solid var(--light); margin-bottom:28px;
}
.admin-site { font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); }
.status-line { display:flex; align-items:center; gap:7px; font-size:10px; color:var(--dim); }
.status-dot { width:6px; height:6px; border-radius:50%; background:var(--light); transition:background .3s; }
.status-dot.ok      { background:var(--green); }
.status-dot.err     { background:var(--red); }
.status-dot.loading { background:#f0b429; animation:blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── Tabs ─────────────────────────────────── */
.tabs { display:flex; border-bottom:1px solid var(--light); margin-bottom:28px; }
.tab-btn {
  padding:8px 20px; border:none; border-bottom:2px solid transparent;
  background:none; font-family:inherit; font-size:9px; font-weight:400;
  letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
  cursor:pointer; margin-bottom:-1px; transition:color .15s, border-color .15s;
}
.tab-btn:hover { color:var(--black); }
.tab-btn.active { color:var(--black); border-bottom-color:var(--black); }

.tab-hint { font-size:10px; color:var(--dim); margin-bottom:24px; line-height:1.6; }
.tab-hint strong { font-weight:400; color:var(--gray); }

/* ── Menu Tree ────────────────────────────── */
.nav-tree { display:flex; flex-direction:column; }

/* Level 0 — top menu items */
.nav-item0 { border-top:1px solid var(--light); }
.nav-item0:last-of-type { border-bottom:1px solid var(--light); }

/* Level 1 — sub-sections */
.nav-item1 { border-top:1px solid #f0f0f0; background:#fdfdfd; }

/* Row shared */
.nav-row {
  display:flex; align-items:center; gap:10px;
  padding:10px 0; min-height:44px;
}
.nav-item0 > .nav-row { padding-left:0; }
.nav-item1 > .nav-row { padding-left:20px; }

/* Expand arrow */
.expand-btn {
  background:none; border:none; cursor:pointer; padding:0;
  font-size:11px; color:var(--dim); flex-shrink:0; width:14px; text-align:center;
  transition:transform .2s, color .15s; line-height:1; user-select:none;
}
.expand-btn:hover { color:var(--black); }
.expand-btn.open  { transform:rotate(90deg); }
.expand-ph { width:14px; flex-shrink:0; }

/* Name — editable */
.nav-name {
  flex:1; font-size:12px; font-weight:300;
  min-width:0; cursor:text;
  border-bottom:1px solid transparent; transition:border-color .15s;
  outline:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.nav-item0 > .nav-row .nav-name {
  font-size:10px; font-weight:400; letter-spacing:.1em; text-transform:uppercase;
}
.nav-item1 > .nav-row .nav-name { color:var(--gray); }

.nav-name[contenteditable="true"]:hover { border-bottom-color:var(--dim); }
.nav-name[contenteditable="true"]:focus {
  border-bottom-color:var(--black); outline:none;
  text-overflow:clip; white-space:normal;
}

/* Type badge */
.nav-type {
  font-size:8px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--dim); flex-shrink:0; white-space:nowrap;
}

/* Card count */
.nav-count {
  font-size:9px; color:var(--dim); flex-shrink:0; white-space:nowrap;
}

/* Accéder link */
.nav-link {
  font-size:9px; color:var(--dim); text-decoration:none; flex-shrink:0;
  letter-spacing:.06em; transition:color .15s;
}
.nav-link:hover { color:var(--black); }

/* Vis button */
.vis-btn {
  flex-shrink:0; padding:3px 9px; border:1px solid var(--light);
  background:transparent; font-family:inherit; font-size:8px; font-weight:400;
  letter-spacing:.12em; text-transform:uppercase; color:var(--dim);
  cursor:pointer; white-space:nowrap; transition:border-color .15s, color .15s;
}
.vis-btn:hover   { border-color:var(--black); color:var(--black); }
.vis-btn.hidden  { border-color:var(--red); color:var(--red); }
.vis-btn.saving  { opacity:.4; pointer-events:none; }
.vis-btn.locked  { opacity:.3; cursor:default; pointer-events:none; border-style:dashed; }

/* Code-hidden items */
.nav-item0.code-hidden { opacity:.4; }
.nav-item0.code-hidden .nav-name { font-style:italic; }

/* Children container */
.nav-children { display:none; }
.nav-children.open { display:block; }

/* Name-save pending indicator */
.nav-name.pending { color:var(--gray); }

/* Separator */
.nav-sep {
  display:flex; align-items:center; gap:12px;
  padding:20px 0 6px; font-size:9px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--dim);
}
.nav-sep::after { content:''; flex:1; height:1px; background:var(--light); }

/* Feedback */
.feedback { margin-top:16px; font-size:10px; color:var(--dim); min-height:16px; }
.feedback.ok  { color:var(--green); }
.feedback.err { color:var(--red); }

/* Placeholder tab */
.tab-placeholder {
  text-align:center; padding:80px 0;
  font-size:12px; color:var(--dim); font-style:italic;
}
</style>
</head>
<body>

<!-- ══════════════════════════ AUTH ══════════════════════════ -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">B</div>
    <div class="auth-label">Bertrand Basset &middot; Admin</div>
    <input type="password" id="pwdInput" class="auth-input" placeholder="Mot de passe"
      autofocus onkeydown="if(event.key==='Enter')checkPwd()">
    <button class="auth-btn" onclick="checkPwd()">Entrer</button>
    <div id="authError" class="auth-error"></div>
  </div>
</div>

<!-- ══════════════════════════ ADMIN ══════════════════════════ -->
<div id="adminWrap" class="admin-wrap" style="display:none">

  <header class="admin-header">
    <div class="admin-site">Administration &middot; bertrandbasset.com</div>
    <div class="status-line">
      <div id="statusDot" class="status-dot loading"></div>
      <span id="statusLabel">Chargement&hellip;</span>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('nav',this)">Navigation</button>
    <button class="tab-btn" onclick="switchTab('galleries',this)">Galeries</button>
  </div>

  <!-- ── Tab Navigation ── -->
  <div id="tab-nav">
    <p class="tab-hint">
      Cliquer le <strong>nom</strong> pour l&rsquo;&eacute;diter &mdash; Entr&eacute;e ou clic ext&eacute;rieur pour sauvegarder &middot;
      <strong>Visible / Masqu&eacute;</strong> sauvegard&eacute; automatiquement &middot;
      <strong>&rsaquo;</strong> pour voir les sous-sections
    </p>
    <div id="navTree" class="nav-tree"></div>
    <div id="navFeedback" class="feedback"></div>
  </div>

  <!-- ── Tab Galeries ── -->
  <div id="tab-galleries" style="display:none">
    <div class="tab-placeholder">Gestion d&eacute;taill&eacute;e des galeries &mdash; prochainement</div>
  </div>

</div>

<!-- Site data -->
<script src="js/gallery-data.js?v=20260608a"></script>

<script>
/* ====================================================
   CONSTANTS
   ==================================================== */
var SUPA_URL = 'https://suecslynruuputmujudg.supabase.co/rest/v1';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1ZWNzbHlucnV1cHV0bXVqdWRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MTYyODcsImV4cCI6MjA5MjA5MjI4N30.c9Pa_x6MEcJdqVekBodSYpu3it-riVU1hYhC-m5iCsU';
var PWD_HASH = 'fd8faf112b549a3c0ace23b2b0c25171195a07494895830426b5cece2ba3796b';

var DB = { menuVis: {}, menuLabel: {} };

/* ====================================================
   AUTH
   ==================================================== */
async function sha256(s) {
  var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,'0'); }).join('');
}
async function checkPwd() {
  var h = await sha256(document.getElementById('pwdInput').value);
  if (h === PWD_HASH) {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('adminWrap').style.display  = '';
    loadDB();
  } else {
    document.getElementById('authError').textContent = 'Mot de passe incorrect';
  }
}

/* ====================================================
   SUPABASE
   ==================================================== */
function sbH(extra) {
  var h = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' };
  if (extra) Object.assign(h, extra);
  return h;
}
async function sbGet(path) {
  var r = await fetch(SUPA_URL + '/' + path, { headers: sbH() });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbUpsert(table, body) {
  var r = await fetch(SUPA_URL + '/' + table, {
    method: 'POST',
    headers: sbH({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify(Array.isArray(body) ? body : [body])
  });
  if (!r.ok) throw new Error(await r.text());
}

/* ====================================================
   LOAD DB
   ==================================================== */
async function loadDB() {
  setStatus('loading', 'Chargement…');
  try {
    var rows = await sbGet('section_visibility?select=id,visible,label');
    rows.forEach(function(r){
      DB.menuVis[r.id]   = r.visible;
      DB.menuLabel[r.id] = r.label || '';
    });
    setStatus('ok', 'Synchronisé');
  } catch(e) {
    setStatus('err', 'Erreur Supabase');
    console.error(e);
  }
  renderTree();
}
function setStatus(state, label) {
  document.getElementById('statusDot').className = 'status-dot ' + state;
  document.getElementById('statusLabel').textContent = label;
}

/* ====================================================
   TABS
   ==================================================== */
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('tab-nav').style.display       = name === 'nav'       ? '' : 'none';
  document.getElementById('tab-galleries').style.display = name === 'galleries' ? '' : 'none';
}

/* ====================================================
   FEEDBACK
   ==================================================== */
var feedTimer;
function showFeedback(msg, cls) {
  cls = cls || 'ok';
  var el = document.getElementById('navFeedback');
  el.textContent = msg;
  el.className = 'feedback ' + cls;
  clearTimeout(feedTimer);
  feedTimer = setTimeout(function(){ el.textContent = ''; el.className = 'feedback'; }, 3000);
}

/* ====================================================
   VISIBILITY HELPERS
   ==================================================== */
function menuIsVisible(id) {
  return id in DB.menuVis ? DB.menuVis[id] !== false : true;
}
function displayName(item) {
  return DB.menuLabel[item.id] || item.name;
}

/* ====================================================
   HTML ESCAPE
   ==================================================== */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ====================================================
   RENDER TREE
   ==================================================== */
function renderTree() {
  var tree = document.getElementById('navTree');
  tree.innerHTML = '';

  var visible = MENU_CONFIG.filter(function(i){ return !i.parent && !i.hidden; });
  var hidden  = MENU_CONFIG.filter(function(i){ return !i.parent &&  i.hidden; });

  visible.forEach(function(item){ tree.appendChild(buildItem0(item, false)); });

  if (hidden.length) {
    var sep = document.createElement('div');
    sep.className = 'nav-sep';
    sep.textContent = 'Masqués dans le code';
    tree.appendChild(sep);
    hidden.forEach(function(item){ tree.appendChild(buildItem0(item, true)); });
  }
}

/* ── Level 0 ── */
function buildItem0(item, codeLocked) {
  var el = document.createElement('div');
  el.className = 'nav-item0' + (codeLocked ? ' code-hidden' : '');
  el.dataset.menuId = item.id;

  var subItems  = MENU_CONFIG.filter(function(i){ return i.parent === item.id; });
  var hasSubs   = subItems.length > 0;
  var hasSec    = item.type === 'section' && !!SECTIONS_CONFIG[item.sectionId];
  var expandable = hasSubs || hasSec;

  var isVis  = menuIsVisible(item.id);
  var name   = displayName(item);

  /* Count for section items */
  var countLabel = '';
  if (item.type === 'section' && !hasSubs && SECTIONS_CONFIG[item.sectionId]) {
    var n = SECTIONS_CONFIG[item.sectionId].cards.length;
    countLabel = n + ' carte' + (n !== 1 ? 's' : '');
  }

  /* Acceder link */
  var accederHtml = makeAccederHtml(item);

  var row = document.createElement('div');
  row.className = 'nav-row';
  row.innerHTML =
    (expandable
      ? '<button class="expand-btn" onclick="toggleExpand(this)">›</button>'
      : '<span class="expand-ph"></span>') +
    '<span class="nav-name" contenteditable="' + (!codeLocked ? 'true' : 'false') + '"' +
      ' onblur="saveLabel(this,\'' + item.id + '\')"' +
      ' onkeydown="if(event.key===\'Enter\'){this.blur();event.preventDefault()}">' +
      esc(name) +
    '</span>' +
    (countLabel ? '<span class="nav-count">' + esc(countLabel) + '</span>' : '') +
    '<span class="nav-type">' + esc(item.type) + '</span>' +
    accederHtml +
    '<button class="vis-btn' + (isVis ? '' : ' hidden') + (codeLocked ? ' locked' : '') + '"' +
      ' onclick="toggleMenuVis(\'' + item.id + '\',this)">' +
      (isVis ? 'Visible' : 'Masqué') +
    '</button>';

  el.appendChild(row);

  /* Sub-sections */
  if (expandable) {
    var children = document.createElement('div');
    children.className = 'nav-children';

    if (hasSubs) {
      subItems.forEach(function(sub){ children.appendChild(buildItem1(sub)); });
    } else if (hasSec) {
      /* Show a brief summary, no cards */
      var sec = SECTIONS_CONFIG[item.sectionId];
      var n = sec ? sec.cards.length : 0;
      var note = document.createElement('div');
      note.style.cssText = 'padding:6px 0 6px 24px;font-size:10px;color:var(--dim);border-top:1px solid #f5f5f5;';
      note.textContent = n + ' galerie' + (n !== 1 ? 's' : '') + ' — gérées dans l\'onglet Galeries';
      children.appendChild(note);
    }

    el.appendChild(children);
  }

  return el;
}

/* ── Level 1 : sub-sections ── */
function buildItem1(sub) {
  var el = document.createElement('div');
  el.className = 'nav-item1';
  el.dataset.menuId = sub.id;

  var sec       = SECTIONS_CONFIG[sub.sectionId];
  var cardCount = sec ? sec.cards.length : 0;
  var isVis     = menuIsVisible(sub.id);
  var name      = displayName(sub);

  var row = document.createElement('div');
  row.className = 'nav-row';
  row.innerHTML =
    '<span class="expand-ph"></span>' +
    '<span class="nav-name" contenteditable="true"' +
      ' onblur="saveLabel(this,\'' + sub.id + '\')"' +
      ' onkeydown="if(event.key===\'Enter\'){this.blur();event.preventDefault()}">' +
      esc(name) +
    '</span>' +
    '<span class="nav-count">' + cardCount + ' carte' + (cardCount !== 1 ? 's' : '') + '</span>' +
    '<button class="vis-btn' + (isVis ? '' : ' hidden') + '"' +
      ' onclick="toggleMenuVis(\'' + sub.id + '\',this)">' +
      (isVis ? 'Visible' : 'Masqué') +
    '</button>';

  el.appendChild(row);
  return el;
}

/* Acceder HTML for an item */
function makeAccederHtml(item) {
  var url = null;
  if (item.url) {
    url = item.url;
  } else if (item.type === 'link' || item.type === 'external') {
    url = item.url;
  }
  /* For items linking to a section/page on the SPA, open the site root */
  if (!url && (item.type === 'gallery' || item.type === 'section' || item.type === 'page')) {
    url = 'index.html';
  }
  if (!url) return '';
  return '<a class="nav-link" href="' + esc(url) + '" target="_blank" rel="noopener">→</a>';
}

/* ====================================================
   EXPAND / COLLAPSE
   ==================================================== */
function toggleExpand(btn) {
  btn.classList.toggle('open');
  var parent   = btn.closest('.nav-item0');
  var children = parent.querySelector(':scope > .nav-children');
  if (children) children.classList.toggle('open');
}

/* ====================================================
   SAVE — Label (name)
   ==================================================== */
async function saveLabel(el, id) {
  var name = el.textContent.trim();
  var prev = DB.menuLabel[id] || '';
  /* Restore original MENU_CONFIG name if blank */
  var orig = (MENU_CONFIG.find(function(i){ return i.id === id; }) || {}).name || '';
  if (!name) { el.textContent = prev || orig; return; }
  if (name === prev) return;
  try {
    await sbUpsert('section_visibility', { id: id, label: name, updated_at: new Date().toISOString() });
    DB.menuLabel[id] = name;
    showFeedback('Nom sauvegardé : « ' + name + ' »');
  } catch(e) {
    el.textContent = prev || orig;
    showFeedback('Erreur : ' + e.message, 'err');
  }
}

/* ====================================================
   SAVE — Visibility
   ==================================================== */
async function toggleMenuVis(id, btn) {
  var nowVis = btn.classList.contains('hidden');
  btn.classList.add('saving');
  try {
    await sbUpsert('section_visibility', { id: id, visible: nowVis, updated_at: new Date().toISOString() });
    DB.menuVis[id] = nowVis;
    btn.classList.toggle('hidden', !nowVis);
    btn.textContent = nowVis ? 'Visible' : 'Masqué';
    showFeedback(nowVis
      ? '« ' + (DB.menuLabel[id] || id) + ' » affiché'
      : '« ' + (DB.menuLabel[id] || id) + ' » masqué');
  } catch(e) {
    showFeedback('Erreur : ' + e.message, 'err');
  }
  btn.classList.remove('saving');
}
</script>
</body>
</html>
