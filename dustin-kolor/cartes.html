<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartes postales — Dust'in Kolor — Bertrand Basset</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo-b.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font: 'IBM Plex Sans', -apple-system, Arial, sans-serif;
      --black: #111; --gray: #555; --dim: #999;
      --line: #e8e8e8; --bg: #f7f7f7;
    }
    html { font-family: var(--font); color: var(--black); background: #fff; -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font); cursor: pointer; border: none; background: none; }
    img { display: block; }

    /* ── HEADER ── */
    .site-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 2.5rem;
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; background: #fff; z-index: 100; flex-shrink: 0;
    }
    .header-back {
      font-size: 0.55rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--dim); transition: color 0.15s;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .header-back:hover { color: var(--black); }
    .header-logo { width: 22px; height: 22px; opacity: 0.7; transition: opacity 0.15s; }
    .header-logo:hover { opacity: 1; }
    .header-right { display: flex; align-items: center; gap: 1.8rem; }
    .header-series { font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
    .header-cart {
      font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--dim); transition: color 0.15s;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .header-cart:hover { color: var(--black); }
    .cart-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; background: var(--black); color: #fff;
      font-size: 0.45rem; border-radius: 50%; font-weight: 700;
    }

    /* ── PAGE ── */
    .page-wrap {
      max-width: 900px; margin: 0 auto; width: 100%;
      padding: 3rem 2.5rem 5rem;
      display: flex; flex-direction: column; gap: 2rem;
      flex: 1;
    }
    .page-kicker { font-size: 0.55rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dim); margin-bottom: 0.5rem; }
    .page-title  { font-size: 1.9rem; font-weight: 300; letter-spacing: -0.02em; }

    /* ── PLAYER AREA ── */
    .player-area {
      display: grid;
      grid-template-columns: 1fr 64px;
      gap: 0;
      align-items: stretch;
    }

    /* Player */
    .player-wrap {
      position: relative;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      min-height: 220px;
    }
    .player-img {
      width: 100%; max-height: 460px;
      object-fit: contain; display: block;
      transition: opacity 0.18s;
    }
    .player-img.fade { opacity: 0; }
    .player-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.92); border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s, border-color 0.15s; z-index: 2;
    }
    .player-nav:hover { background: #fff; border-color: #aaa; }
    .player-nav.prev { left: 0.7rem; }
    .player-nav.next { right: 0.7rem; }
    .player-nav svg { stroke: var(--black); }
    .player-num {
      position: absolute; bottom: 0.6rem; left: 50%; transform: translateX(-50%);
      font-size: 0.5rem; letter-spacing: 0.12em; color: rgba(0,0,0,0.3);
      pointer-events: none;
    }

    /* Qty panel — droite du player */
    .qty-panel {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.4rem;
      border-left: 1px solid var(--line);
      background: #fff;
      padding: 0.8rem 0;
      user-select: none;
    }
    .qty-btn {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; line-height: 1; color: var(--black);
      transition: background 0.15s, border-color 0.15s;
    }
    .qty-btn:hover { background: var(--bg); border-color: #aaa; }
    .qty-btn:active { background: var(--line); }
    .qty-btn:disabled { color: var(--line); border-color: var(--line); cursor: not-allowed; }
    .qty-val {
      font-size: 1.6rem; font-weight: 300; letter-spacing: -0.02em;
      min-width: 1.5ch; text-align: center; line-height: 1;
      transition: color 0.15s;
    }
    .qty-val.nonzero { color: var(--black); }
    .qty-val.zero    { color: var(--line); }
    .qty-card-num {
      font-size: 0.48rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--dim); text-align: center; line-height: 1.4;
    }

    /* ── STRIP ── */
    .strip-scroll {
      display: flex; gap: 0.5rem;
      overflow-x: auto; scroll-behavior: smooth;
      padding: 0.2rem 0 0.4rem;
      scrollbar-width: none;
    }
    .strip-scroll::-webkit-scrollbar { display: none; }
    .strip-thumb {
      flex-shrink: 0; cursor: pointer; position: relative;
    }
    .strip-thumb img {
      height: 64px; width: auto; display: block;
      border: 2px solid transparent; transition: border-color 0.15s;
      background: var(--bg);
    }
    .strip-thumb:hover img { border-color: #ccc; }
    .strip-thumb.active img { border-color: var(--black); }
    /* badge quantité sur la vignette */
    .strip-badge {
      position: absolute; top: 2px; right: 2px;
      min-width: 16px; height: 16px; padding: 0 3px;
      background: var(--black); color: #fff;
      font-size: 0.45rem; font-weight: 700; border-radius: 8px;
      display: none; align-items: center; justify-content: center;
    }
    .strip-thumb.has-qty .strip-badge { display: flex; }

    /* ── RÉCAP ── */
    .recap-bar {
      border-top: 1px solid var(--line); padding-top: 1.4rem;
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 1.5rem; flex-wrap: wrap;
    }
    .recap-list { display: flex; flex-direction: column; gap: 0.35rem; flex: 1; }
    .recap-item {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.75rem; color: var(--black);
      padding: 0.3rem 0; border-bottom: 1px solid var(--line);
    }
    .recap-item-label { color: var(--gray); font-size: 0.68rem; }
    .recap-empty { font-size: 0.72rem; color: var(--dim); font-style: italic; }

    .recap-total-block { display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem; flex-shrink: 0; }
    .recap-total-label { font-size: 0.55rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
    .recap-total-prix { font-size: 2.2rem; font-weight: 300; letter-spacing: -0.03em; line-height: 1; }
    .recap-total-prix sup { font-size: 1.1rem; vertical-align: super; font-weight: 300; }
    .recap-pack-note { font-size: 0.58rem; color: var(--gray); }

    /* ── ACTIONS ── */
    .actions-row { display: flex; gap: 0.7rem; flex-wrap: wrap; align-items: center; }
    .btn-add-cart {
      padding: 0.9rem 2rem;
      background: var(--black); color: #fff;
      font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 400;
      border-radius: 2px; transition: background 0.2s;
    }
    .btn-add-cart:hover:not(:disabled) { background: #333; }
    .btn-add-cart:disabled { background: #ccc; cursor: not-allowed; }
    .btn-voir-panier {
      padding: 0.9rem 1.4rem;
      background: none; color: var(--gray);
      font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
      border: 1px solid var(--line); border-radius: 2px; transition: border-color 0.2s, color 0.2s;
    }
    .btn-voir-panier:hover { border-color: var(--gray); color: var(--black); }

    /* ── INFOS ── */
    .infos-row {
      display: flex; gap: 2rem; flex-wrap: wrap;
      border-top: 1px solid var(--line); padding-top: 1.4rem;
    }
    .info-col { flex: 1; min-width: 140px; }
    .info-label { font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin-bottom: 0.25rem; }
    .info-val { font-size: 0.75rem; color: var(--black); font-weight: 300; line-height: 1.5; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 999;
      background: var(--black); color: #fff;
      padding: 0.9rem 1.4rem; border-radius: 3px;
      font-size: 0.7rem; letter-spacing: 0.05em;
      transform: translateY(150%); opacity: 0;
      transition: transform 0.3s, opacity 0.3s; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <a class="header-back" href="index.html">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2">
      <polyline points="9,2 4,7 9,12"/>
    </svg>
    Retour à la série
  </a>
  <a href="../index.html" title="Bertrand Basset">
    <img src="../assets/logo-b.svg" class="header-logo" alt="B">
  </a>
  <div class="header-right">
    <span class="header-series">Dust'in Kolor</span>
    <a class="header-cart" href="../panier.html">
      <span class="cart-badge" id="cartCount" style="display:none">0</span>
      Panier
    </a>
  </div>
</header>

<!-- PAGE -->
<div class="page-wrap">

  <div>
    <p class="page-kicker">Dust'in Kolor</p>
    <h1 class="page-title">Cartes postales</h1>
  </div>

  <!-- PLAYER + COMPTEUR -->
  <div class="player-area">

    <div class="player-wrap">
      <button class="player-nav prev" onclick="go(-1)" aria-label="Précédent">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke-width="1.5"><polyline points="7.5,1 2.5,5.5 7.5,10"/></svg>
      </button>
      <img class="player-img" id="playerImg" src="" alt="">
      <button class="player-nav next" onclick="go(+1)" aria-label="Suivant">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke-width="1.5"><polyline points="3.5,1 8.5,5.5 3.5,10"/></svg>
      </button>
      <span class="player-num" id="playerNum">1 / 9</span>
    </div>

    <!-- COMPTEUR PAR CARTE -->
    <div class="qty-panel">
      <button class="qty-btn" id="qtyPlus"  onclick="changeQty(+1)" aria-label="+1">+</button>
      <span  class="qty-val zero" id="qtyVal">0</span>
      <button class="qty-btn" id="qtyMinus" onclick="changeQty(-1)" aria-label="-1" disabled>−</button>
      <span class="qty-card-num" id="qtyCardNum">#01</span>
    </div>

  </div>

  <!-- STRIP -->
  <div class="strip-scroll" id="stripScroll"></div>

  <!-- RÉCAP -->
  <div class="recap-bar">
    <div class="recap-list" id="recapList">
      <span class="recap-empty">Aucune carte sélectionnée</span>
    </div>
    <div class="recap-total-block">
      <span class="recap-total-label">Total</span>
      <span class="recap-total-prix" id="recapPrix">0<sup> €</sup></span>
      <span class="recap-pack-note" id="packNote"></span>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="actions-row">
    <button class="btn-add-cart" id="btnAdd" onclick="addToCart()" disabled>Ajouter au panier</button>
    <button class="btn-voir-panier" onclick="location.href='../panier.html'">Voir le panier</button>
  </div>

  <!-- INFOS -->
  <div class="infos-row">
    <div class="info-col">
      <p class="info-label">Format</p>
      <p class="info-val">99 × 210 mm (DL)</p>
    </div>
    <div class="info-col">
      <p class="info-label">Support</p>
      <p class="info-val">Papier premium soft touch</p>
    </div>
    <div class="info-col">
      <p class="info-label">Prix</p>
      <p class="info-val">6 € / carte · Pack 3 = 15 €</p>
    </div>
    <div class="info-col">
      <p class="info-label">Livraison</p>
      <p class="info-val">4 € — offerte dès 35 €</p>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
var CARTES = [
  { id:'cp-01', num:'01' }, { id:'cp-02', num:'02' }, { id:'cp-03', num:'03' },
  { id:'cp-04', num:'04' }, { id:'cp-05', num:'05' }, { id:'cp-06', num:'06' },
  { id:'cp-07', num:'07' }, { id:'cp-08', num:'08' }, { id:'cp-09', num:'09' }
];

var PRIX_UNITE = 6;
var PRIX_PACK  = 15;   // pour 3

var current   = 0;
var quantities = {};   // id → qty
CARTES.forEach(function(c) { quantities[c.id] = 0; });

/* ── BUILD STRIP ── */
function buildStrip() {
  var strip = document.getElementById('stripScroll');
  strip.innerHTML = CARTES.map(function(c, i) {
    return '<div class="strip-thumb' + (i === 0 ? ' active' : '') + '" id="th-' + c.id + '" onclick="goTo(' + i + ')">' +
      '<img src="../images/cartes-postales/' + c.id + '.jpg" alt="Carte ' + c.num + '" loading="' + (i < 4 ? 'eager' : 'lazy') + '">' +
      '<span class="strip-badge" id="badge-' + c.id + '">0</span>' +
    '</div>';
  }).join('');
}

/* ── NAVIGATION ── */
function goTo(i) {
  current = (i + CARTES.length) % CARTES.length;
  var c = CARTES[current];

  var img = document.getElementById('playerImg');
  img.classList.add('fade');
  setTimeout(function() {
    img.src = '../images/cartes-postales/' + c.id + '.jpg';
    img.alt = 'Carte #' + c.num;
    img.classList.remove('fade');
  }, 140);

  document.getElementById('playerNum').textContent = (current + 1) + ' / ' + CARTES.length;

  document.querySelectorAll('.strip-thumb').forEach(function(el, idx) {
    el.classList.toggle('active', idx === current);
  });
  var th = document.getElementById('th-' + c.id);
  if (th) th.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });

  updateQtyPanel();
}

function go(dir) { goTo(current + dir); }

/* ── COMPTEUR PAR CARTE ── */
function changeQty(delta) {
  var id = CARTES[current].id;
  quantities[id] = Math.max(0, quantities[id] + delta);
  updateQtyPanel();
  updateStripBadge(id);
  updateRecap();
}

function updateQtyPanel() {
  var id  = CARTES[current].id;
  var qty = quantities[id];
  var valEl = document.getElementById('qtyVal');
  valEl.textContent = qty;
  valEl.className = 'qty-val ' + (qty > 0 ? 'nonzero' : 'zero');
  document.getElementById('qtyMinus').disabled = (qty === 0);
  document.getElementById('qtyCardNum').textContent = '#' + CARTES[current].num;
}

function updateStripBadge(id) {
  var qty = quantities[id];
  var badge = document.getElementById('badge-' + id);
  var thumb = document.getElementById('th-' + id);
  if (!badge || !thumb) return;
  badge.textContent = qty;
  thumb.classList.toggle('has-qty', qty > 0);
}

/* ── RÉCAP & PRIX ── */
function calcPrix(total) {
  // Groupes de 3 au prix pack, reste à l'unité
  var packs = Math.floor(total / 3);
  var reste = total % 3;
  return packs * PRIX_PACK + reste * PRIX_UNITE;
}

function updateRecap() {
  var list   = document.getElementById('recapList');
  var prixEl = document.getElementById('recapPrix');
  var noteEl = document.getElementById('packNote');

  var items = CARTES.filter(function(c) { return quantities[c.id] > 0; });
  var total  = items.reduce(function(s, c) { return s + quantities[c.id]; }, 0);
  var prix   = calcPrix(total);

  if (items.length === 0) {
    list.innerHTML = '<span class="recap-empty">Aucune carte sélectionnée</span>';
    prixEl.innerHTML = '0<sup> €</sup>';
    noteEl.textContent = '';
    document.getElementById('btnAdd').disabled = true;
    document.getElementById('btnAdd').textContent = 'Ajouter au panier';
    return;
  }

  list.innerHTML = items.map(function(c) {
    var qty = quantities[c.id];
    return '<div class="recap-item">' +
      '<span class="recap-item-label">Carte #' + c.num + '</span>' +
      '<span>× ' + qty + '&nbsp;&nbsp;<span style="color:var(--dim);font-size:0.65rem">' + (qty * PRIX_UNITE) + ' €</span></span>' +
    '</div>';
  }).join('');

  prixEl.innerHTML = prix + '<sup> €</sup>';

  var packs = Math.floor(total / 3);
  if (packs > 0) {
    noteEl.textContent = packs === 1
      ? '✓ Pack 3 cartes appliqué (−' + (3 * PRIX_UNITE - PRIX_PACK) + ' €)'
      : '✓ ' + packs + ' packs appliqués';
  } else {
    noteEl.textContent = total >= 2 ? 'Ajoutez ' + (3 - total) + ' carte de plus pour le pack à 15 €' : '';
  }

  document.getElementById('btnAdd').disabled = false;
  document.getElementById('btnAdd').textContent = 'Ajouter au panier — ' + prix + ' €';
}

/* ── PANIER ── */
function getCart() {
  try { return JSON.parse(localStorage.getItem('bb_cart') || '[]'); } catch(e) { return []; }
}
function saveCart(c) { localStorage.setItem('bb_cart', JSON.stringify(c)); }

function addToCart() {
  var items = CARTES.filter(function(c) { return quantities[c.id] > 0; });
  if (items.length === 0) return;

  var total = items.reduce(function(s, c) { return s + quantities[c.id]; }, 0);
  var cart  = getCart();

  // Groupes de 3 en pack, reste à l'unité
  var remaining = total;
  var allIds    = [];
  items.forEach(function(c) {
    for (var k = 0; k < quantities[c.id]; k++) allIds.push(c.id);
  });

  var packs = Math.floor(remaining / 3);
  var idx   = 0;
  for (var p = 0; p < packs; p++) {
    var ids3 = allIds.slice(idx, idx + 3);
    idx += 3;
    var nums = ids3.map(function(id){ return id.replace('cp-',''); }).join(', #');
    cart.push({ type:'carte-pack', ids: ids3,
      titre: 'Pack 3 cartes Dust\'in Kolor (#' + nums + ')',
      prix: PRIX_PACK, qty: 1 });
  }
  // Reste à l'unité
  for (; idx < allIds.length; idx++) {
    var id   = allIds[idx];
    var num  = id.replace('cp-','');
    var item = { type:'carte', id: id,
      titre: 'Carte postale Dust\'in Kolor #' + num,
      prix: PRIX_UNITE, qty: 1 };
    var found = cart.findIndex(function(c) { return c.type === 'carte' && c.id === id; });
    if (found >= 0) { cart[found].qty = (cart[found].qty || 1) + 1; }
    else { cart.push(item); }
  }

  saveCart(cart);
  updateBadge();
  showToast('Ajouté au panier');

  // reset
  CARTES.forEach(function(c) {
    quantities[c.id] = 0;
    updateStripBadge(c.id);
  });
  updateQtyPanel();
  updateRecap();
}

function updateBadge() {
  var n = getCart().reduce(function(s, i) { return s + (i.qty || 1); }, 0);
  var el = document.getElementById('cartCount');
  if (n > 0) { el.textContent = n; el.style.display = ''; }
  else { el.style.display = 'none'; }
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

/* ── CLAVIER ── */
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'BUTTON') return;
  if (e.key === 'ArrowLeft')  go(-1);
  if (e.key === 'ArrowRight') go(+1);
  if (e.key === '+' || e.key === 'ArrowUp')   changeQty(+1);
  if (e.key === '-' || e.key === 'ArrowDown') changeQty(-1);
});

/* ── INIT ── */
buildStrip();
updateBadge();
updateRecap();
goTo(0);
</script>
</body>
</html>
