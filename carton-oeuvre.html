<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartons d'œuvres — Bertrand Basset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --font: 'IBM Plex Sans', Arial, sans-serif; }
    html { font-family: var(--font); -webkit-font-smoothing: antialiased; }

    body { background: #ddd; padding: 24px; }

    .screen-bar {
      max-width: 220mm; margin: 0 auto 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .screen-bar-title { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #888; }
    .btn-print {
      font-family: var(--font); padding: 8px 20px; background: #111; color: #fff;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px;
    }
    .btn-print:hover { background: #333; }

    /* ── PAGE A4 ── */
    .page {
      width: 210mm;
      background: white;
      margin: 0 auto 20px;
      padding: 10mm;
      box-shadow: 0 2px 20px rgba(0,0,0,0.15);
    }

    /* Page 1 : 2×2 artwork grid */
    .page-artworks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 5mm;
      height: 277mm; /* A4 content height */
    }

    /* Page 2 : 2 artworks top + postcard full width bottom */
    .page-mixed {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr auto;
      gap: 5mm;
      min-height: 277mm;
    }

    /* ── ARTWORK CARTON ── */
    .carton {
      border: 0.5pt solid #ccc;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .c-header { padding: 5mm 6mm 4.5mm 7mm; flex-shrink: 0; }
    .c-header-top {
      display: flex; justify-content: space-between; margin-bottom: 1.5mm;
    }
    .c-num { font-size: 6pt; letter-spacing: 0.2em; text-transform: uppercase; }
    .c-serie { font-size: 5.5pt; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 300; }
    .c-title { font-size: 22pt; font-weight: 300; letter-spacing: -0.02em; line-height: 1; }
    .c-body {
      flex: 1; padding: 4mm 6mm 4mm 7mm;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .c-desc { font-size: 6.5pt; color: #444; line-height: 1.6; font-weight: 300; margin-bottom: 3mm; }
    .c-specs { font-size: 6.5pt; color: #555; line-height: 1.65; font-weight: 300; }
    .c-specs strong { font-weight: 500; color: #111; }
    .c-bottom {
      display: flex; justify-content: space-between; align-items: flex-end;
      padding-top: 3mm; border-top: 0.3pt solid #ddd; margin-top: 3mm;
    }
    .c-price { font-size: 15pt; font-weight: 300; letter-spacing: -0.02em; color: #111; line-height: 1; }
    .c-price-note { font-size: 5pt; letter-spacing: 0.06em; color: #888; margin-top: 1mm; text-transform: uppercase; line-height: 1.5; }
    .c-qr { width: 16mm; height: 16mm; flex-shrink: 0; }
    .c-qr canvas, .c-qr img { width: 100% !important; height: 100% !important; }

    /* ── CARTE POSTALE — pleine largeur ── */
    .carton-carte {
      grid-column: 1 / -1;
      border: 0.5pt solid #ccc;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .cc-header {
      background: #111; padding: 4.5mm 8mm; flex-shrink: 0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .cc-header-left {}
    .cc-expo { font-size: 6pt; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 1mm; }
    .cc-title { font-size: 18pt; font-weight: 300; color: #fff; letter-spacing: -0.02em; line-height: 1; }
    .cc-header-right { font-size: 6pt; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); text-align: right; }

    .cc-body {
      flex: 1; padding: 5mm 8mm 5mm;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6mm;
      align-items: center;
    }

    /* Left col — info */
    .cc-info { display: flex; flex-direction: column; justify-content: center; gap: 2mm; }
    .cc-sub { font-size: 7pt; color: #888; font-weight: 300; line-height: 1.5; }
    .cc-scan-note { font-size: 6pt; letter-spacing: 0.1em; text-transform: uppercase; color: #aaa; }

    /* Middle col — produit */
    .cc-produit {
      border: 0.5pt solid #ddd; padding: 4mm 5mm;
      display: flex; flex-direction: column; gap: 1.5mm;
      height: 100%;
    }
    .cc-produit-name { font-size: 7pt; font-weight: 400; color: #111; letter-spacing: 0.04em; text-transform: uppercase; }
    .cc-produit-price { font-size: 26pt; font-weight: 300; color: #111; letter-spacing: -0.03em; line-height: 1; }
    .cc-produit-note { font-size: 5.5pt; color: #999; font-style: italic; }

    /* Right col — QR */
    .cc-qr-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2mm; }
    .cc-qr { width: 26mm; height: 26mm; }
    .cc-qr canvas, .cc-qr img { width: 100% !important; height: 100% !important; }
    .cc-qr-label { font-size: 5.5pt; letter-spacing: 0.1em; text-transform: uppercase; color: #aaa; text-align: center; }

    /* ── PRINT ── */
    @media print {
      body { background: none; padding: 0; }
      .screen-bar { display: none; }
      .page { margin: 0; box-shadow: none; page-break-after: always; break-after: page; }
      .page-artworks { height: 277mm; }
      .carton, .carton-carte { border: 0.3pt solid #bbb; }
      @page { size: A4 portrait; margin: 0; padding: 10mm; }
    }
  </style>
</head>
<body>

<div class="screen-bar">
  <span class="screen-bar-title">Cartons d'œuvres — 2 pages A4 · 6 tirages + cartes postales</span>
  <button class="btn-print" onclick="window.print()">Imprimer</button>
</div>

<!-- PAGE 1 : 4 cartons -->
<div class="page">
  <div class="page-artworks" id="page1"></div>
</div>

<!-- PAGE 2 : 2 cartons + carte postale -->
<div class="page">
  <div class="page-mixed" id="page2"></div>
</div>

<script>
const BASE_URL  = 'https://bertrandbasset.com/boutique.html?id=';
const PAYER_URL = 'https://bertrandbasset.com/payer.html';

/* After the Storm (03) exclue — pas encore tiré */
const EDITIONS = [
  { slug:'sandstorm-feu',          num:'01', titre:'Sandstorm',      code:'6090_Feu',   hex:'#FF4500', format:'60 × 90 cm',  papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm', prix_vente:'850 €'   },
  { slug:'flying-car-orange',      num:'02', titre:'Flying Car',     code:'70124_Orange',hex:'#FF6600', format:'70 × 124 cm', papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm', prix_vente:'1 290 €' },
  { slug:'lost-in-the-dust-rouge', num:'04', titre:'Lost in the Dust',code:'6080_Rouge', hex:'#CC0000', format:'60 × 80 cm',  papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm', prix_vente:'890 €'   },
  { slug:'camp-lighters-jaune',    num:'05', titre:'Camp Lighters',  code:'40100_Jaune', hex:'#FFB300', format:'40 × 100 cm', papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm', prix_vente:'790 €'   },
  { slug:'im-here-bleu',           num:'06', titre:"I'm Here",       code:'6080_Bleu',   hex:'#0066CC', format:'60 × 80 cm',  papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm', prix_vente:'890 €'   },
  { slug:'umbrellas-way-rose',     num:'08', titre:'Umbrellas Way',  code:'6080_Rose',   hex:'#FF1493', format:'60 × 80 cm',  papier:'Hahnemühle Museum Etching 350g, contrecollé Aludibon 2mm', prix_vente:'890 €'   },
];

function makeCarton(ed) {
  const hex = ed.hex.replace('#','');
  const r = parseInt(hex.substr(0,2),16);
  const g = parseInt(hex.substr(2,2),16);
  const b = parseInt(hex.substr(4,2),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  const tc  = lum > 0.55 ? '#111' : '#fff';
  const tc2 = lum > 0.55 ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.6)';

  const div = document.createElement('div');
  div.className = 'carton';
  div.innerHTML = `
    <div class="c-header" style="background:${ed.hex}">
      <div class="c-header-top">
        <span class="c-num" style="color:${tc2}">№ ${ed.num}</span>
        <span class="c-serie" style="color:${tc2}">Dust'in Kolor</span>
      </div>
      <div class="c-title" style="color:${tc}">${ed.titre}</div>
    </div>
    <div class="c-body">
      <div>
        <div class="c-desc">Série limitée à 10 exemplaires numérotée et signée par l'artiste, avec certificat d'authenticité.</div>
        <div class="c-specs"><strong>${ed.format}</strong> · ${ed.papier}<br>Tirage d'art : Pix in the City, Auray</div>
      </div>
      <div class="c-bottom">
        <div>
          <div class="c-price">${ed.prix_vente}</div>
          <div class="c-price-note">3 premiers exemplaires à ce prix<br>Prix progressif ensuite</div>
        </div>
        <div class="c-qr" id="qr-${ed.slug}"></div>
      </div>
    </div>`;
  return div;
}

function makeCartePostale() {
  const div = document.createElement('div');
  div.className = 'carton-carte';
  div.innerHTML = `
    <div class="cc-header">
      <div class="cc-header-left">
        <div class="cc-expo">Exposition · Dust'in Kolor</div>
        <div class="cc-title">Cartes postales</div>
      </div>
      <div class="cc-header-right">Bertrand Basset<br>bertrandbasset.com</div>
    </div>
    <div class="cc-body">
      <div class="cc-info">
        <div class="cc-sub">Format 10 × 15 cm<br>Impression haute définition<br>Pix in the City, Auray</div>
        <div class="cc-scan-note">Scannez pour payer par carte bancaire</div>
      </div>
      <div class="cc-produit">
        <div class="cc-produit-name">1 carte postale</div>
        <div class="cc-produit-price">6 €</div>
        <div class="cc-produit-note">l'unité</div>
      </div>
      <div class="cc-produit">
        <div class="cc-produit-name">Pack 3 cartes</div>
        <div class="cc-produit-price">15 €</div>
        <div class="cc-produit-note">5 € la carte · économisez 17 %</div>
      </div>
    </div>`;

  // On ne met pas le QR dans le HTML string — on l'ajoute après
  return div;
}

/* --- Build pages --- */
const page1 = document.getElementById('page1');
const page2 = document.getElementById('page2');

EDITIONS.forEach((ed, i) => {
  (i < 4 ? page1 : page2).appendChild(makeCarton(ed));
});

const cartePostale = makeCartePostale();
page2.appendChild(cartePostale);

// Ajouter le QR de la carte postale dans la cc-body
const qrCol = document.createElement('div');
qrCol.className = 'cc-qr-col';
qrCol.innerHTML = `<div class="cc-qr" id="qr-carte-postale"></div><div class="cc-qr-label">Payer en ligne</div>`;
cartePostale.querySelector('.cc-body').appendChild(qrCol);

/* --- QR Codes --- */
EDITIONS.forEach(ed => {
  new QRCode(document.getElementById('qr-' + ed.slug), {
    text: BASE_URL + ed.slug, width: 150, height: 150,
    colorDark: '#111', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M
  });
});
new QRCode(document.getElementById('qr-carte-postale'), {
  text: PAYER_URL, width: 200, height: 200,
  colorDark: '#111', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M
});
</script>
</body>
</html>
