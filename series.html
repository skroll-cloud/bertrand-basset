<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bertrand Basset</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-b.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    html, body { height: 100%; overflow: hidden; font-family: var(--font); -webkit-font-smoothing: antialiased; background: #0a0a0a; }
    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font); cursor: pointer; border: none; background: none; }

    /* ── LANDING ── */
    #landing {
      position: fixed; inset: 0;
      background: #f8f8f8;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 3rem 2rem;
      z-index: 100;
      transition: opacity 0.7s ease;
    }
    #landing.out { opacity: 0; pointer-events: none; }

    .landing-inner { max-width: 520px; width: 100%; }

    .landing-back {
      position: absolute; top: 1.5rem; left: 1.8rem;
      font-size: 0.55rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: #aaa; transition: color 0.15s;
    }
    .landing-back:hover { color: #333; }

    .landing-lang {
      position: absolute; top: 1.4rem; right: 1.8rem;
      display: flex; gap: 0.3rem;
      font-size: 0.58rem; letter-spacing: 0.08em;
    }
    .landing-lang a { color: #bbb; transition: color 0.15s; cursor: pointer; }
    .landing-lang a.active { color: #111; }
    .landing-lang span { color: #ddd; }

    .landing-kicker {
      font-size: 0.5rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: #aaa; margin-bottom: 0.7rem;
    }
    .landing-title {
      font-size: clamp(2.4rem, 5vw, 3.8rem); font-weight: 300;
      letter-spacing: -0.02em; color: #111; line-height: 1; margin-bottom: 0.5rem;
    }
    .landing-sub { font-size: 0.78rem; font-style: italic; color: #888; margin-bottom: 2.2rem; }
    .landing-sep { width: 40px; height: 1px; background: #ddd; margin-bottom: 2.2rem; }
    .landing-desc { font-size: 0.82rem; line-height: 1.8; color: #555; font-weight: 300; margin-bottom: 3rem; }

    /* Boutons CTA — support 1 ou plusieurs */
    .landing-ctas { display: flex; flex-direction: column; gap: 1.1rem; }

    .landing-enter {
      display: inline-flex; align-items: center; gap: 0.8rem;
      font-size: 0.62rem; font-weight: 500; letter-spacing: 0.16em;
      text-transform: uppercase; color: #111;
      cursor: pointer; background: none; border: none; padding: 0;
      transition: gap 0.25s;
    }
    .landing-enter:hover { gap: 1.2rem; }
    .landing-enter-arrow { font-size: 1rem; font-weight: 200; transition: transform 0.25s; }
    .landing-enter:hover .landing-enter-arrow { transform: translateX(4px); }

    /* Bouton secondaire (lien externe ex: film) */
    .landing-enter-secondary {
      display: inline-flex; align-items: center; gap: 0.8rem;
      font-size: 0.58rem; font-weight: 400; letter-spacing: 0.14em;
      text-transform: uppercase; color: #999;
      cursor: pointer; background: none; border: none; padding: 0;
      transition: color 0.2s, gap 0.25s;
    }
    .landing-enter-secondary:hover { color: #444; gap: 1.2rem; }

    /* ── GALERIE ── */
    #gallery {
      position: fixed; inset: 0; background: #0a0a0a;
      opacity: 0; pointer-events: none;
      transition: opacity 0.7s ease 0.3s;
    }
    #gallery.in { opacity: 1; pointer-events: auto; }

    .g-photo-area { position: absolute; inset: 0; }
    .g-img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; opacity: 0; transition: opacity 0.5s ease;
    }
    .g-img.active { opacity: 1; }

    .g-nav-zone {
      position: absolute; top: 0; bottom: 0; width: 40%;
      z-index: 10; cursor: pointer;
      display: flex; align-items: center;
    }
    .g-nav-zone.left  { left: 0; justify-content: flex-start; padding-left: 2rem; }
    .g-nav-zone.right { right: 0; justify-content: flex-end;  padding-right: 2rem; }
    .g-arrow {
      font-size: 1.4rem; color: rgba(255,255,255,0);
      transition: color 0.2s; font-weight: 200; user-select: none;
    }
    .g-nav-zone:hover .g-arrow { color: rgba(255,255,255,0.35); }

    .g-topbar {
      position: absolute; top: 0; left: 0; right: 0; height: 3rem;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.6rem; z-index: 20;
    }
    .g-logo {
      width: 22px; height: 22px; opacity: 0.85;
      cursor: pointer; transition: opacity 0.15s; filter: invert(1);
    }
    .g-logo:hover { opacity: 1; }

    .g-actions { display: flex; align-items: center; gap: 1.4rem; }
    .g-btn {
      font-size: 0.56rem; font-weight: 500; letter-spacing: 0.16em;
      text-transform: uppercase; color: rgba(255,255,255,0.55);
      cursor: pointer; transition: color 0.15s;
      display: flex; align-items: center; gap: 0.4rem;
      background: none; border: none; padding: 0; text-decoration: none;
    }
    .g-btn:hover { color: rgba(255,255,255,0.95); }

    .g-bottom {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 1.4rem 1.8rem;
      display: flex; align-items: flex-end; justify-content: space-between;
      z-index: 20;
      background: linear-gradient(transparent, rgba(0,0,0,0.35));
    }
    .g-title-block { display: flex; flex-direction: column; gap: 0.2rem; }
    .g-work-num { font-size: 0.45rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.35); }
    .g-work-title { font-size: 0.88rem; font-weight: 300; letter-spacing: 0.04em; color: rgba(255,255,255,0.75); }
    .g-counter { font-size: 0.58rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.35); text-align: right; }

    @media (max-width: 767px) {
      .g-nav-zone { width: 30%; }
    }
  </style>
</head>
<body>

  <!-- ── LANDING ── -->
  <div id="landing">
    <a href="index.html" class="landing-back" id="lblBack">← Bertrand Basset</a>
    <div class="landing-lang" id="landingLang">
      <a data-lang="fr" class="active" onclick="setLang('fr')">FR</a>
      <span>/</span>
      <a data-lang="en" onclick="setLang('en')">EN</a>
    </div>
    <div class="landing-inner">
      <p class="landing-kicker" id="lblKicker"></p>
      <h1 class="landing-title" id="lblTitle"></h1>
      <p class="landing-sub" id="lblSub">Bertrand Basset</p>
      <div class="landing-sep"></div>
      <p class="landing-desc" id="lblDesc"></p>
      <div class="landing-ctas" id="ctas"></div>
    </div>
  </div>

  <!-- ── GALERIE ── -->
  <div id="gallery">
    <div class="g-photo-area" id="photoArea"></div>
    <div class="g-nav-zone left"  onclick="prev()"><span class="g-arrow">←</span></div>
    <div class="g-nav-zone right" onclick="next()"><span class="g-arrow">→</span></div>
    <div class="g-topbar">
      <img src="assets/logo-b.svg" class="g-logo" alt="B"
           onclick="location.href='index.html'" title="Retour au portfolio">
      <div class="g-actions" id="gActions"></div>
    </div>
    <div class="g-bottom">
      <div class="g-title-block">
        <span class="g-work-num"  id="gWorkNum"></span>
        <span class="g-work-title" id="gWorkTitle"></span>
      </div>
      <span class="g-counter" id="gCounter"></span>
    </div>
  </div>

  <script>
  /* ══════════════════════════════════════════════════════════
     CONFIG DES SÉRIES
     Pour ajouter une série : copier un bloc, changer l'id.
     buttons.action : "gallery" | "url" | "buy"
  ══════════════════════════════════════════════════════════ */
  const SERIES = {

    'dustin-kolor': {
      title: "Dust'in Kolor",
      kicker: { fr: 'Série photographique — 2016', en: 'Photography series — 2016' },
      desc: {
        fr: "En pleine tempête de sable, la visibilité est proche de zéro. On enfile les goggles — ces lunettes aux verres colorés. Le monde devient rouge, bleu, orange, rose…\n\nDust'in Kolor n'est pas une série colorisée. C'est ce que j'ai vu.\n\nDésert du Nevada — Burning Man, août 2016.",
        en: "In the middle of a sandstorm, visibility drops to near zero. You put on goggles — those coloured protective lenses. The world turns red, blue, orange, pink…\n\nDust'in Kolor is not a colorised series. It's what I saw.\n\nNevada Desert — Burning Man, August 2016."
      },
      imagePath: 'images/dustin-kolor/',
      images: [
        { file: '01.jpg', title: 'Sandstorm' },
        { file: '02.jpg', title: 'Flying Car' },
        { file: '03.jpg', title: 'After the Storm' },
        { file: '04.jpg', title: 'Lost in the Dust' },
        { file: '05.jpg', title: 'Camp Lighters' },
        { file: '06.jpg', title: "I'm Here" },
        { file: '08.jpg', title: 'Umbrellas Way' }
      ],
      buttons: [
        { fr: 'Entrer dans la série', en: 'Enter the series', action: 'gallery' },
        { fr: 'Commander un tirage', en: 'Order a print', action: 'url', url: 'dustin-kolor/index.html' }
      ]
    },

    'jarrive': {
      title: "J'arrive",
      kicker: { fr: 'Série documentaire — 2023', en: 'Documentary series — 2023' },
      desc: {
        fr: "Description de la série J'arrive. Quelques lignes pour planter le contexte, le lieu, la démarche.\n\nRemplacez ce texte par le vrai.",
        en: "Description of the J'arrive series. A few lines to set the context, the place, the approach.\n\nReplace this text with the real one."
      },
      imagePath: 'images/jarrive/',
      images: [
        { file: '01.jpg', title: '' },
        { file: '02.jpg', title: '' }
      ],
      buttons: [
        { fr: 'Voir les images', en: 'See the images', action: 'gallery' },
        { fr: 'Voir le film', en: 'Watch the film', action: 'url', url: '#' }
      ]
    }

    /* ── Ajouter d'autres séries ici ── */

  };

  /* ══════════════════════════════════════════════════════════
     INIT : lecture de l'id dans l'URL (?id=xxx)
  ══════════════════════════════════════════════════════════ */
  const urlId  = new URLSearchParams(location.search).get('id') || '';
  const series = SERIES[urlId];

  if (!series) {
    document.title = 'Bertrand Basset';
    document.getElementById('lblTitle').textContent = 'Série introuvable';
    document.getElementById('lblDesc').textContent  = 'Aucune série avec cet identifiant.';
  }

  let lang      = document.documentElement.lang || 'fr';
  let current   = 0;
  let inGallery = false;

  /* ── I18N ── */
  function t(obj) { return typeof obj === 'string' ? obj : (obj[lang] || obj.fr || ''); }

  function applyLang() {
    if (!series) return;
    document.title  = series.title + ' — Bertrand Basset';
    document.getElementById('lblKicker').textContent = t(series.kicker);
    document.getElementById('lblTitle').textContent  = series.title;
    document.getElementById('lblDesc').innerHTML     = t(series.desc).replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
    document.getElementById('lblBack').textContent   = lang === 'en' ? '← Bertrand Basset' : '← Bertrand Basset';
    document.querySelectorAll('[data-lang]').forEach(a => a.classList.toggle('active', a.dataset.lang === lang));
    buildCTAs();
    buildGalleryActions();
    if (inGallery) showPhoto(current);
  }

  function setLang(l) { lang = l; applyLang(); }

  /* ── CTAs landing ── */
  function buildCTAs() {
    if (!series) return;
    const container = document.getElementById('ctas');
    container.innerHTML = series.buttons.map((btn, i) => {
      const label = t(btn);
      if (btn.action === 'gallery') {
        return `<button class="landing-enter${i > 0 ? ' landing-enter-secondary' : ''}"
                        onclick="enterGallery()">
                  <span>${label}</span>
                  <span class="landing-enter-arrow">→</span>
                </button>`;
      } else if (btn.action === 'url') {
        return `<a href="${btn.url}" class="landing-enter${i > 0 ? ' landing-enter-secondary' : ''}">
                  <span>${label}</span>
                  <span class="landing-enter-arrow">→</span>
                </a>`;
      }
      return '';
    }).join('');
  }

  /* ── Actions haut-droite dans la galerie ── */
  function buildGalleryActions() {
    if (!series) return;
    const el = document.getElementById('gActions');
    // Boutons URL non-gallery dans les actions de la galerie
    const extras = series.buttons.filter(b => b.action !== 'gallery');
    el.innerHTML = extras.map(btn => {
      const label = t(btn);
      if (btn.action === 'url') {
        return `<a href="${btn.url}" class="g-btn">${label}</a>`;
      }
      return '';
    }).join('');
  }

  /* ── Photos ── */
  function buildPhotos() {
    if (!series) return;
    document.getElementById('photoArea').innerHTML = series.images.map((img, i) =>
      `<img class="g-img${i === 0 ? ' active' : ''}"
            src="${series.imagePath}${img.file}"
            alt="${img.title || ''}" data-index="${i}"
            loading="${i === 0 ? 'eager' : 'lazy'}">`
    ).join('');
  }

  function showPhoto(i) {
    current = i;
    document.querySelectorAll('.g-img').forEach(img =>
      img.classList.toggle('active', +img.dataset.index === i)
    );
    const img = series.images[i];
    const num = String(i + 1).padStart(2, '0');
    document.getElementById('gWorkNum').textContent   = series.title + ' — ' + num;
    document.getElementById('gWorkTitle').textContent = img.title || '';
    document.getElementById('gCounter').textContent   = `${i + 1} / ${series.images.length}`;
    history.replaceState(null, '', `?id=${urlId}#${num}`);
  }

  function prev() { showPhoto((current - 1 + series.images.length) % series.images.length); }
  function next() { showPhoto((current + 1) % series.images.length); }

  function enterGallery() {
    inGallery = true;
    document.getElementById('landing').classList.add('out');
    setTimeout(() => document.getElementById('gallery').classList.add('in'), 200);
  }

  /* ── Clavier ── */
  document.addEventListener('keydown', e => {
    if (!inGallery) return;
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')    prev();
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown')  next();
  });

  /* ── INIT ── */
  if (series) {
    buildPhotos();
    applyLang();
    // Deep link : ?id=xxx#02
    const hash = location.hash.replace('#','');
    if (hash) {
      const idx = parseInt(hash, 10) - 1;
      if (!isNaN(idx) && idx >= 0 && idx < series.images.length) {
        current = idx;
        enterGallery();
      }
    }
    showPhoto(current);
  }
  </script>
</body>
</html>
